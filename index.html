tom:8px}\n.cmd-title{font-weight:700;font-size:.98rem;color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.where{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px}\n.where.dc{background:rgba(56,189,248,.16);color:#7dd3fc;border:1px solid rgba(56,189,248,.35)}\n.where.w10{background:rgba(168,85,247,.18);color:#d8b4fe;border:1px solid rgba(168,85,247,.35)}\n.where.both{background:rgba(16,185,129,.16);color:#6ee7b7;border:1px solid rgba(16,185,129,.35)}\n.cmd-desc{color:#cbd5e1;font-size:.88rem;margin:0 0 10px}\n.cmd-actions{display:flex;gap:6px;flex-wrap:wrap}\n\n/* Terminal preview */\n.term{background:var(--term);border:1px solid #1e293b;border-radius:10px;padding:12px 14px;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:.86rem;line-height:1.65;color:#e2e8f0;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}\n.tok-empty{display:inline-block;background:rgba(245,158,11,.2);color:#fbbf24;border:1px dashed rgba(245,158,11,.65);border-radius:5px;padding:0 6px;font-weight:700}\n.tok-filled{display:inline-block;background:rgba(16,185,129,.18);color:#34d399;border:1px solid rgba(16,185,129,.45);border-radius:5px;padding:0 5px;font-weight:700}\n\n/* Inputs del CommandBuilder */\n.cmd-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:10px}\n.link-tag{font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px;background:rgba(56,189,248,.15);color:#7dd3fc}\n.link-tag.custom{background:rgba(245,158,11,.18);color:#fcd34d;cursor:pointer}\n\n/* Desglose de par\u00e1metros */\n.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}\n.part{background:#0f172a;border:1px solid #243045;border-radius:7px;padding:4px 9px;font-size:.78rem;color:#cbd5e1}\n.part code{color:#38bdf8;font-family:ui-monospace,Consolas,monospace;font-weight:700;margin-right:4px}\n.cmd-warn{margin-top:8px;font-size:.8rem;color:#fda4af;background:rgba(244,63,94,.1);border-left:3px solid var(--red);padding:6px 10px;border-radius:6px}\n\n/* Checklist interactivo */\n.chk-wrap{margin-top:8px}\n.chk-prog{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.82rem;color:var(--muted)}\n.chk-bar{flex:1;height:8px;background:#1e293b;border-radius:999px;overflow:hidden}\n.chk-bar div{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));transition:width .25s}\n.chk-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:9px;border:1px solid transparent;cursor:pointer;transition:background .12s}\n.chk-item:hover{background:rgba(255,255,255,.04)}\n.chk-item input{margin-top:3px;width:16px;height:16px;accent-color:var(--green);cursor:pointer}\n.chk-item.done span{text-decoration:line-through;color:var(--muted)}\n.chk-item span{font-size:.88rem;color:#e2e8f0}\n\n/* \u00c1rbol visual ADUC */\n.tree{background:var(--term);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-family:ui-monospace,Consolas,monospace;font-size:.86rem;line-height:1.7;overflow-x:auto;white-space:pre}\n.tree .ou{color:#38bdf8;font-weight:700}\n.tree .prot{color:#fbbf24;font-weight:700}\n.tree .cnt{color:#94a3b8}\n\n/* Tablas */\ntable{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:8px}\nth,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}\nth{background:var(--panel2);color:#e2e8f0;font-weight:700}\ntd code{background:#0f172a;color:#7dd3fc;padding:2px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:.82rem}\n\n/* Acorde\u00f3n */\ndetails{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}\nsummary{cursor:pointer;font-weight:700;color:#7dd3fc;font-size:.9rem}\n\n/* Filtros GPO */\n.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}\n.filter-bar input{flex:1;min-width:200px;background:#090f1d;border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-size:.88rem}\n.pill-f{background:#0f172a;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:.8rem;font-weight:700;cursor:pointer}\n.pill-f.active{background:rgba(236,72,153,.2);border-color:var(--pink);color:#fbcfe8}\n\n.hidden{display:none!important}\n@media(max-width:640px){.hero-inner{padding-right:0;padding-top:34px}.gb-grid{grid-template-columns:1fr 1fr}}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"hero\">\n  <div class=\"hero-inner\">\n    <h1>Gu\u00eda Pr\u00e1ctica Interactiva \u00b7 Active Directory <span class=\"badge-pill\">Temas 2.2 \u2013 2.6<\/span><\/h1>\n    <p>Rellena arriba los datos de tu examen o pr\u00e1ctica y todos los comandos PowerShell y rutas UNC se adaptar\u00e1n solos. Cada comando explica <b>para qu\u00e9 sirve<\/b> y <b>qu\u00e9 significa cada par\u00e1metro<\/b>.<\/p>\n  <\/div>\n<\/div>\n\n<!-- BARRA GLOBAL DE VARIABLES -->\n<div class=\"global-bar\">\n  <div class=\"container\">\n    <div class=\"gb-head\">\n      <div class=\"gb-title\">\n        <span>\u2699\ufe0f Tus datos del entorno<\/span>\n        <small>(se sincronizan solos con todos los comandos de abajo)<\/small>\n      <\/div>\n      <div class=\"gb-actions\">\n        <button class=\"btn primary sm\" id=\"btnLoadEx\">\u2728 Cargar ejemplo (addrm.local)<\/button>\n        <button class=\"btn warn sm\" id=\"btnClearAll\">\ud83e\uddf9 Vaciar huecos<\/button>\n        <button class=\"btn sm\" id=\"btnToggleBar\">\u25b2 Ocultar<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"gb-grid\" id=\"gbGrid\">\n      <div class=\"field\">\n        <label>Dominio DNS<\/label>\n        <input id=\"g_domain\" placeholder=\"ej: addrm.local\">\n      <\/div>\n      <div class=\"field\">\n        <label>Ruta LDAP Base (auto)<\/label>\n        <input id=\"g_ldap\" readonly placeholder=\"DC=addrm,DC=local\">\n      <\/div>\n      <div class=\"field\">\n        <label>Nombre NetBIOS<\/label>\n        <input id=\"g_netbios\" placeholder=\"ej: ADDRM\">\n      <\/div>\n      <div class=\"field\">\n        <label>Servidor AD (Hostname)<\/label>\n        <input id=\"g_server\" placeholder=\"ej: SRV-AD\">\n      <\/div>\n      <div class=\"field\">\n        <label>IP del Servidor DC<\/label>\n        <input id=\"g_ip\" placeholder=\"ej: 192.168.10.10\">\n      <\/div>\n      <div class=\"field\">\n        <label>Contrase\u00f1a por defecto<\/label>\n        <input id=\"g_pass\" placeholder=\"ej: P@ssw0rd123\">\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"container\">\n  <!-- NAVEGACI\u00d3N DE TEMAS -->\n  <div class=\"tabs\" id=\"mainTabs\">\n    <button class=\"tab active\" data-tab=\"t22\">2.2 Instalar AD y Unir PC<\/button>\n    <button class=\"tab\" data-tab=\"t23\">2.3 ADUC Gr\u00e1fico<\/button>\n    <button class=\"tab\" data-tab=\"t24\">2.4 PowerShell AD<\/button>\n    <button class=\"tab\" data-tab=\"t25\">2.5 Carpetas y Perfiles<\/button>\n    <button class=\"tab\" data-tab=\"t26\">2.6 Directivas GPO<\/button>\n  <\/div>\n\n  <!-- ================= TEMA 2.2 ================= -->\n  <div class=\"tab-panel\" id=\"panel-t22\">\n    <div class=\"goal-box\">\n      <b>\ud83c\udfaf Objetivo del Tema 2.2 en 1 frase<\/b>\n      <p>Convertir un Windows Server normal en un <b>Controlador de Dominio (DC)<\/b> con DNS propio, y despu\u00e9s unir un cliente <b>Windows 10<\/b> a ese dominio.<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>\ud83d\udda5\ufe0f Mapa del laboratorio (c\u00f3mo encajan las 3 piezas)<\/h2>\n      <div class=\"grid-3\">\n        <div class=\"mini-card\">\n          <b>1. Red Interna (SOX)<\/b>\n          <p>Ambas m\u00e1quinas virtuales deben estar en la <b>misma red interna<\/b> para verse entre s\u00ed sin interferencias del router de clase.<\/p>\n        <\/div>\n        <div class=\"mini-card\">\n          <b>2. Servidor DC (SRV-AD)<\/b>\n          <p>IP est\u00e1tica fija y <b>hostname configurado ANTES<\/b> de promocionar. Al promocionar se instala AD DS + DNS.<\/p>\n        <\/div>\n        <div class=\"mini-card\">\n          <b>3. Cliente (WIN10)<\/b>\n          <p>Su <b>DNS preferido DEBE ser la IP del servidor<\/b>. Si no apunta al servidor como DNS, nunca encontrar\u00e1 el dominio.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"warn-box\">\u26a0\ufe0f <b>Regla de oro del examen:<\/b> Una vez promocionado el servidor a Controlador de Dominio, <b>NO se puede cambiar su hostname<\/b>. C\u00e1mbialo siempre en el paso 1.<\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>\u2705 Checklist paso a paso (E1 \u00b7 E2 \u00b7 E3)<\/h2>\n      <div id=\"chk-t22\"><\/div>\n    <\/div>\n\n    <h3 style=\"color:#7dd3fc;margin:18px 0 10px\">\ud83d\udee0\ufe0f Generador de comandos \u00b7 Tema 2.2<\/h3>\n    <div id=\"cmds-t22\"><\/div>\n  <\/div>\n\n  <!-- ================= TEMA 2.3 ================= -->\n  <div class=\"tab-panel hidden\" id=\"panel-t23\">\n    <div class=\"goal-box\">\n      <b>\ud83c\udfaf Objetivo del Tema 2.3 en 1 frase<\/b>\n      <p>Organizar usuarios, grupos y equipos desde la herramienta gr\u00e1fica <b>ADUC<\/b> (<code>dsa.msc<\/code>) usando Unidades Organizativas (OUs) limpias y entendiendo c\u00f3mo quitar la protecci\u00f3n contra borrado.<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>\ud83d\udce6 Contenedor por defecto vs Unidad Organizativa (OU)<\/h2>\n      <div class=\"grid-2\">\n        <div class=\"mini-card\">\n          <b>\ud83d\udcc1 Contenedores por defecto (Users, Computers)<\/b>\n          <p>Vienen creados de f\u00e1brica y <b>NO tienen icono de librito<\/b>. No se les puede aplicar una GPO directamente. <b>No creamos cosas aqu\u00ed dentro.<\/b><\/p>\n        <\/div>\n        <div class=\"mini-card\">\n          <b>\ud83d\udcd8 Unidad Organizativa (ej. ORG)<\/b>\n          <p>Las creamos nosotros. Sirven para ordenar nuestra empresa y aplicar GPOs. <b>Regla:<\/b> nunca mezclar usuarios y equipos en la misma OU.<\/p>\n        <\/div>\n      <\/div>\n      <h3>\ud83c\udf33 Estructura de OUs de la pr\u00e1ctica<\/h3>\n      <div class=\"tree\" id=\"ouTree\"><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>\ud83d\udee1\ufe0f Procedimiento E2: \u00bfC\u00f3mo borrar la OU protegida \u00aberror\u00bb?<\/h2>\n      <p style=\"color:#cbd5e1;font-size:.88rem;margin:0 0 8px\">Al crear una OU, Windows marca por defecto <i>Protect container from accidental deletion<\/i>. Si intentas borrarla, dar\u00e1 error de acceso denegado. Sigue estos 4 pasos exactos:<\/p>\n      <div id=\"chk-t23\"><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>\ud83d\udc65 Datos de referencia (4 usuarios y 4 grupos)<\/h2>\n      <div class=\"grid-2\">\n        <div>\n          <h3>Usuarios de pr\u00e1ctica<\/h3>\n          <table>\n            <tr><th>Nombre<\/th><th>Login<\/th><th>OU destino<\/th><\/tr>\n            <tr><td>Anna Puig<\/td><td><code>a.puig<\/code><\/td><td>Alumnat<\/td><\/tr>\n            <tr><td>Marc Vila<\/td><td><code>m.vila<\/code><\/td><td>Alumnat<\/td><\/tr>\n            <tr><td>Laura Soler<\/td><td><code>l.soler<\/code><\/td><td>Professorat<\/td><\/tr>\n            <tr><td>Jordi Mas<\/td><td><code>j.mas<\/code><\/td><td>Administracio<\/td><\/tr>\n          <\/table>\n        <\/div>\n        <div>\n          <h3>Grupos (siempre Global + Security)<\/h3>\n          <table>\n            <tr><th>Grupo<\/th><th>\u00c1mbito / Tipo<\/th><th>Miembros<\/th><\/tr>\n            <tr><td><code>G_Alumnat<\/code><\/td><td>Global \u00b7 Security<\/td><td>a.puig, m.vila<\/td><\/tr>\n            <tr><td><code>G_Professorat<\/code><\/td><td>Global \u00b7 Security<\/td><td>l.soler<\/td><\/tr>\n            <tr><td><code>G_Admin<\/code><\/td><td>Global \u00b7 Security<\/td><td>j.mas<\/td><\/tr>\n            <tr><td><code>G_Centre<\/code><\/td><td>Global \u00b7 Security<\/td><td>Grupos anteriores<\/td><\/tr>\n          <\/table>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <h3 style=\"color:#7dd3fc;margin:18px 0 10px\">\ud83d\udee0\ufe0f Comandos r\u00e1pidos de apertura y verificaci\u00f3n \u00b7 Tema 2.3<\/h3>\n    <div id=\"cmds-t23\"><\/div>\n  <\/div>\n\n  <!-- ================= TEMA 2.4 ================= -->\n  <div class=\"tab-panel hidden\" id=\"panel-t24\">\n    <div class=\"goal-box\">\n      <b>\ud83c\udfaf Objetivo del Tema 2.4 en 1 frase<\/b>\n      <p>Hacer todo lo de Active Directory (crear OUs, grupos, usuarios, mover, renombrar y buscar) mediante <b>comandos y scripts de PowerShell<\/b>, mucho m\u00e1s r\u00e1pido y repetible que a mano.<\/p>\n    <\/div>\n\n    <details>\n      <summary>\ud83d\udccb Ver tabla de referencia de la pr\u00e1ctica (6 usuarios y 5 grupos)<\/summary>\n      <div class=\"grid-2\" style=\"margin-top:10px\">\n        <table>\n          <tr><th>Usuario<\/th><th>Login<\/th><th>OU<\/th><th>Email<\/th><\/tr>\n          <tr><td>Carla Fonts<\/td><td><code>c.fonts<\/code><\/td><td>Vendes<\/td><td>c.fonts@empresa.com<\/td><\/tr>\n          <tr><td>Pau Serra<\/td><td><code>p.serra<\/code><\/td><td>Vendes<\/td><td>p.serra@empresa.cat<\/td><\/tr>\n          <tr><td>N\u00faria Prat<\/td><td><code>n.prat<\/code><\/td><td>IT<\/td><td>n.prat@empresa.com<\/td><\/tr>\n          <tr><td>Oriol Camps<\/td><td><code>o.camps<\/code><\/td><td>IT<\/td><td>o.camps@empresa.cat<\/td><\/tr>\n          <tr><td>Marta Roig<\/td><td><code>m.roig<\/code><\/td><td>Direccio<\/td><td>m.roig@empresa.com<\/td><\/tr>\n          <tr><td>Pol Vidal<\/td><td><code>p.vidal<\/code><\/td><td>Direccio<\/td><td>p.vidal@empresa.local<\/td><\/tr>\n        <\/table>\n        <table>\n          <tr><th>Grupo<\/th><th>Scope<\/th><th>Miembros<\/th><\/tr>\n          <tr><td><code>G_Vendes<\/code><\/td><td>1 (Global)<\/td><td>c.fonts, p.serra<\/td><\/tr>\n          <tr><td><code>G_IT<\/code><\/td><td>1 (Global)<\/td><td>n.prat, o.camps<\/td><\/tr>\n          <tr><td><code>G_Direccio<\/code><\/td><td>1 (Global)<\/td><td>m.roig, p.vidal<\/td><\/tr>\n          <tr><td><code>G_Empleats<\/code><\/td><td>1 (Global)<\/td><td>G_Vendes, G_IT<\/td><\/tr>\n          <tr><td><code>G_Tots<\/code><\/td><td>1 (Global)<\/td><td>G_Empleats, G_Direccio<\/td><\/tr>\n        <\/table>\n      <\/div>\n    <\/details>\n\n    <div class=\"tip-box\">\n      \ud83d\udca1 <b>Truco para no liarte con los grupos en PowerShell:<\/b><br>\n      \u2022 <code>Add-ADGroupMember -Identity \"GRUPO\" -Members \"u1\",\"u2\"<\/code> \u2192 Piensa: <i>\u00abAl <b>grupo<\/b> le meto estos miembros\u00bb<\/i>.<br>\n      \u2022 <code>Add-ADPrincipalGroupMembership -Identity \"USUARIO\" -MemberOf \"G1\",\"G2\"<\/code> \u2192 Piensa: <i>\u00abA este <b>usuario<\/b> lo apunto a estos grupos\u00bb<\/i>.\n    <\/div>\n\n    <div class=\"subtabs\" id=\"psSubtabs\">\n      <button class=\"subtab active\" data-sub=\"vars\">0. Variables<\/button>\n      <button class=\"subtab\" data-sub=\"e1\">E1: OUs<\/button>\n      <button class=\"subtab\" data-sub=\"e2\">E2: Grupos<\/button>\n      <button class=\"subtab\" data-sub=\"e3\">E3: Usuarios<\/button>\n      <button class=\"subtab\" data-sub=\"e4\">E4: B\u00fasquedas y Filtros<\/button>\n    <\/div>\n\n    <div id=\"cmds-t24-vars\" class=\"subpanel\"><\/div>\n    <div id=\"cmds-t24-e1\" class=\"subpanel hidden\"><\/div>\n    <div id=\"cmds-t24-e2\" class=\"subpanel hidden\"><\/div>\n    <div id=\"cmds-t24-e3\" class=\"subpanel hidden\"><\/div>\n    <div id=\"cmds-t24-e4\" class=\"subpanel hidden\"><\/div>\n  <\/div>\n\n  <!-- ================= TEMA 2.5 ================= -->\n  <div class=\"tab-panel hidden\" id=\"panel-t25\">\n    <div class=\"goal-box\">\n      <b>\ud83c\udfaf Objetivo del Tema 2.5 en 1 frase<\/b>\n      <p>Dar a cada usuario una <b>carpeta personal privada<\/b> (unidad de red <code>P:<\/code>) y/o un <b>perfil m\u00f3vil (Roaming)<\/b> que le siga a cualquier ordenador del dominio donde inicie sesi\u00f3n.<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>\ud83d\udd10 Permisos de Red (SMB) vs Permisos NTFS (explicado f\u00e1cil)<\/h2>\n      <p style=\"color:#cbd5e1;font-size:.88rem;margin:0 0 10px\">Imagina un edificio de oficinas: cuando alguien entra por red, Windows comprueba <b>las dos puertas<\/b> y se queda siempre con el permiso <b>m\u00e1s restrictivo<\/b>.<\/p>\n      <div class=\"grid-2\">\n        <div class=\"mini-card\" style=\"border-color:rgba(56,189,248,.4)\">\n          <b>\ud83d\udeaa 1. Permisos de Red (SMB Share) = La puerta del edificio<\/b>\n          <p>Se configuran al compartir la carpeta. Lo habitual es dejar <code>Everyone<\/code> o <code>Authenticated Users<\/code> con <b>Change / Full Control<\/b> para no bloquear el paso, y controlar el detalle fino con NTFS.<\/p>\n        <\/div>\n        <div class=\"mini-card\" style=\"border-color:rgba(16,185,129,.4)\">\n          <b>\ud83d\udd11 2. Permisos NTFS (Seguridad) = La llave de cada habitaci\u00f3n<\/b>\n          <p>Controlan qui\u00e9n puede leer/escribir realmente dentro del disco. Aqu\u00ed <b>deshabilitamos la herencia<\/b>, quitamos a <code>Users<\/code> para que nadie cotillee carpetas ajenas y dejamos a <code>Admins<\/code> y al propietario.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"tip-box\">\n        \ud83d\udca1 <b>Dos s\u00edmbolos m\u00e1gicos que salen siempre en el examen:<\/b><br>\n        \u2022 <code>$<\/code> al final (<code>Profiles$<\/code>): hace que la carpeta compartida sea <b>oculta<\/b> al navegar por la red.<br>\n        \u2022 <code>%username%<\/code>: si seleccionas varios usuarios en ADUC y pones <code>\\\\SRV-AD\\Personals\\%username%<\/code>, Windows cambia <code>%username%<\/code> por el login de cada uno autom\u00e1ticamente.\n      <\/div>\n    <\/div>\n\n    <h3 style=\"color:#7dd3fc;margin:18px 0 10px\">\ud83d\udee0\ufe0f Generador de rutas UNC y comandos \u00b7 Tema 2.5<\/h3>\n    <div id=\"cmds-t25\"><\/div>\n\n    <div class=\"card\">\n      <h2>\u2705 Checklist de comprobaci\u00f3n en el cliente WIN10<\/h2>\n      <div id=\"chk-t25\"><\/div>\n      <div class=\"warn-box\">\u26a0\ufe0f <b>\u00bfC\u00f3mo s\u00e9 si el Perfil M\u00f3vil funciona?<\/b> En <i>Advanced System Settings \u2192 User Profiles<\/i> debe poner <b>Roaming | Roaming<\/b>. Si pone <b>Local<\/b> o <b>Temporal<\/b>, hay un fallo de permisos o de ruta y al cerrar sesi\u00f3n se perder\u00e1 todo.<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ================= TEMA 2.6 ================= -->\n  <div class=\"tab-panel hidden\" id=\"panel-t26\">\n    <div class=\"goal-box\">\n      <b>\ud83c\udfaf Objetivo del Tema 2.6 en 1 frase<\/b>\n      <p>Aplicar reglas autom\u00e1ticas a todos los ordenadores o usuarios del dominio (contrase\u00f1as, fondos de pantalla, bloquear Panel de Control o USBs\u2026) desde <b>Group Policy Management<\/b> (<code>gpmc.msc<\/code>).<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>\u2696\ufe0f Las 3 reglas de oro para no suspender GPOs<\/h2>\n      <div class=\"grid-3\">\n        <div class=\"mini-card\">\n          <b>1. Orden de prioridad (qui\u00e9n gana)<\/b>\n          <p><b>Local \u2192 Dominio \u2192 OU<\/b>. Gana siempre la \u00faltima que se aplica (la OU m\u00e1s profunda). Dentro de la misma OU, gana el <b>n\u00famero de orden m\u00e1s peque\u00f1o<\/b> (1 gana a 2).<\/p>\n        <\/div>\n        <div class=\"mini-card\">\n          <b>2. No mezclar ni tocar Defaults<\/b>\n          <p>Nunca edites la <code>Default Domain Policy<\/code>. Haz una GPO nueva y <b>no mezcles<\/b> ajustes de Equipo (arranque) con ajustes de Usuario (inicio de sesi\u00f3n).<\/p>\n        <\/div>\n        <div class=\"mini-card\">\n          <b>3. Filtrar por grupo (Scope)<\/b>\n          <p>En la pesta\u00f1a <b>Scope (\u00c1mbito) \u2192 Security Filtering<\/b>: quita <code>Authenticated Users<\/code> y a\u00f1ade tu grupo. <b>Nunca lo hagas en Delegation.<\/b><\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <h3 style=\"color:#7dd3fc;margin:18px 0 10px\">\ud83d\udee0\ufe0f Generador de comandos y rutas de im\u00e1genes \u00b7 Tema 2.6<\/h3>\n    <div id=\"cmds-t26\"><\/div>\n\n    <div class=\"card\">\n      <h2>\ud83d\udd0e Buscador de las 6 GPOs de pr\u00e1ctica (con ruta exacta)<\/h2>\n      <div class=\"filter-bar\">\n        <input id=\"gpoSearch\" placeholder=\"Buscar GPO (ej: fondo, usb, contrase\u00f1as, panel, logon)\u2026\">\n        <button class=\"pill-f active\" data-scope=\"all\">Todas<\/button>\n        <button class=\"pill-f\" data-scope=\"Equipo\">\ud83d\udda5\ufe0f Equipo<\/button>\n        <button class=\"pill-f\" data-scope=\"Usuario\">\ud83d\udc64 Usuario<\/button>\n      <\/div>\n      <table>\n        <thead>\n          <tr><th>GPO<\/th><th>\u00c1mbito<\/th><th>D\u00f3nde vincular<\/th><th>Ruta exacta en Editor de GPO<\/th><th>Qu\u00e9 consigue<\/th><\/tr>\n        <\/thead>\n        <tbody id=\"gpoBody\"><\/tbody>\n      <\/table>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function(){\n  // ===== ESTADO GLOBAL =====\n  const state = {\n    domain: '',\n    netbios: '',\n    server: '',\n    ip: '',\n    pass: ''\n  };\n\n  function calcLdap(dom){\n    if(!dom || !dom.trim()) return '';\n    return dom.trim().split('.').filter(Boolean).map(p => 'DC=' + p).join(',');\n  }\n\n  const gEls = {\n    domain: document.getElementById('g_domain'),\n    ldap: document.getElementById('g_ldap'),\n    netbios: document.getElementById('g_netbios'),\n    server: document.getElementById('g_server'),\n    ip: document.getElementById('g_ip'),\n    pass: document.getElementById('g_pass')\n  };\n\n  const builders = [];\n\n  function syncGlobals(){\n    state.domain = gEls.domain.value.trim();\n    state.netbios = gEls.netbios.value.trim();\n    state.server = gEls.server.value.trim();\n    state.ip = gEls.ip.value.trim();\n    state.pass = gEls.pass.value.trim();\n    const ldap = calcLdap(state.domain);\n    gEls.ldap.value = ldap;\n    renderOuTree();\n    builders.forEach(b => b.updateFromGlobal());\n  }\n\n  ['domain','netbios','server','ip','pass'].forEach(k => {\n    gEls[k].addEventListener('input', () => {\n      if(k === 'domain' && !gEls.netbios.dataset.edited){\n        const first = gEls.domain.value.trim().split('.')[0] || '';\n        gEls.netbios.value = first.toUpperCase();\n      }\n      if(k === 'netbios') gEls.netbios.dataset.edited = gEls.netbios.value ? '1' : '';\n      syncGlobals();\n    });\n  });\n\n  document.getElementById('btnLoadEx').addEventListener('click', () => {\n    gEls.domain.value = 'addrm.local';\n    gEls.netbios.value = 'ADDRM';\n    gEls.netbios.dataset.edited = '1';\n    gEls.server.value = 'SRV-AD';\n    gEls.ip.value = '192.168.10.10';\n    gEls.pass.value = 'P@ssw0rd123';\n    syncGlobals();\n  });\n\n  document.getElementById('btnClearAll').addEventListener('click', () => {\n    ['domain','netbios','server','ip','pass'].forEach(k => { gEls[k].value = ''; });\n    gEls.netbios.dataset.edited = '';\n    syncGlobals();\n    builders.forEach(b => b.clearLocal());\n  });\n\n  const btnTog = document.getElementById('btnToggleBar');\n  const gbGrid = document.getElementById('gbGrid');\n  btnTog.addEventListener('click', () => {\n    const col = gbGrid.classList.toggle('collapsed');\n    btnTog.textContent = col ? '\u25bc Mostrar datos' : '\u25b2 Ocultar';\n  });\n\n  // ===== PESTA\u00d1AS =====\n  document.querySelectorAll('#mainTabs .tab').forEach(btn => {\n    btn.addEventListener('click', () => {\n      document.querySelectorAll('#mainTabs .tab').forEach(b => b.classList.remove('active'));\n      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));\n      btn.classList.add('active');\n      document.getElementById('panel-' + btn.dataset.tab).classList.remove('hidden');\n    });\n  });\n\n  document.querySelectorAll('#psSubtabs .subtab').forEach(btn => {\n    btn.addEventListener('click', () => {\n      document.querySelectorAll('#psSubtabs .subtab').forEach(b => b.classList.remove('active'));\n      document.querySelectorAll('.subpanel').forEach(p => p.classList.add('hidden'));\n      btn.classList.add('active');\n      document.getElementById('cmds-t24-' + btn.dataset.sub).classList.remove('hidden');\n    });\n  });\n\n  // ===== \u00c1RBOL OU =====\n  function renderOuTree(){\n    const d = state.domain || 'addrm.local';\n    document.getElementById('ouTree').innerHTML =\n`<span class=\"ou\">\ud83c\udf10 ${esc(d)}<\/span>\n\u251c\u2500\u2500 <span class=\"cnt\">\ud83d\udcc1 Builtin / Computers / Users<\/span>  (contenedores por defecto \u00b7 NO crear aqu\u00ed)\n\u251c\u2500\u2500 <span class=\"ou\">\ud83d\udcd8 ORG<\/span>  (nuestra OU ra\u00edz de organizaci\u00f3n)\n\u2502   \u251c\u2500\u2500 <span class=\"ou\">\ud83d\udcd8 Usuaris<\/span>\n\u2502   \u2502   \u251c\u2500\u2500 <span class=\"ou\">\ud83d\udcd8 Alumnat<\/span>  (a.puig, m.vila)\n\u2502   \u2502   \u251c\u2500\u2500 <span class=\"ou\">\ud83d\udcd8 Professorat<\/span>  (l.soler)\n\u2502   \u2502   \u2514\u2500\u2500 <span class=\"ou\">\ud83d\udcd8 Administracio<\/span>  (j.mas)\n\u2502   \u251c\u2500\u2500 <span class=\"ou\">\ud83d\udcd8 Grups<\/span>  (G_Alumnat, G_Professorat, G_Admin, G_Centre)\n\u2502   \u2514\u2500\u2500 <span class=\"ou\">\ud83d\udcd8 Equips<\/span>  (WIN10 movido desde Computers)\n\u2514\u2500\u2500 <span class=\"prot\">\ud83d\udd12 error<\/span>  (OU protegida para practicar borrado en E2)`;\n  }\n\n  function esc(s){\n    return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;');\n  }\n\n  // ===== COMPONENTE COMMANDBUILDER =====\n  function createBuilder(container, cfg){\n    const localVals = {};\n    const customOverride = {};\n    cfg.fields.forEach(f => { localVals[f.key] = ''; customOverride[f.key] = false; });\n\n    const card = document.createElement('div');\n    card.className = 'cmd-card';\n\n    const whereLabel = cfg.where === 'dc' ? '\ud83d\udda5\ufe0f Servidor DC' : cfg.where === 'w10' ? '\ud83d\udcbb Cliente W10' : '\ud83d\udda5\ufe0f/\ud83d\udcbb DC o Cliente';\n    card.innerHTML = `\n      <div class=\"cmd-top\">\n        <div class=\"cmd-title\">${esc(cfg.title)} <span class=\"where ${cfg.where||'dc'}\">${whereLabel}<\/span><\/div>\n        <div class=\"cmd-actions\">\n          <button class=\"btn success sm btn-copy\">\ud83d\udccb Copiar<\/button>\n          <button class=\"btn sm btn-ex\">\u2728 Ejemplo<\/button>\n          <button class=\"btn sm btn-clr\">\ud83e\uddf9 Limpiar<\/button>\n        <\/div>\n      <\/div>\n      <p class=\"cmd-desc\">${cfg.desc}<\/p>\n      <div class=\"term\"><\/div>\n      <div class=\"cmd-inputs\"><\/div>\n      ${cfg.parts ? `<div class=\"parts\">${cfg.parts.map(p => `<div class=\"part\"><code>${esc(p[0])}<\/code>${esc(p[1])}<\/div>`).join('')}<\/div>` : ''}\n      ${cfg.warn ? `<div class=\"cmd-warn\">\u26a0\ufe0f <b>Ojo en el examen:<\/b> ${cfg.warn}<\/div>` : ''}\n    `;\n\n    const termEl = card.querySelector('.term');\n    const inputsEl = card.querySelector('.cmd-inputs');\n    const inputMap = {};\n    const tagMap = {};\n\n    cfg.fields.forEach(f => {\n      const wrap = document.createElement('div');\n      wrap.className = 'field';\n      const lbl = document.createElement('label');\n      lbl.innerHTML = `<span>${esc(f.label)}<\/span>`;\n      if(f.global){\n        const tg = document.createElement('span');\n        tg.className = 'link-tag';\n        tg.textContent = '\ud83d\udd17 Global';\n        tg.title = 'Sincronizado con la barra superior';\n        tg.addEventListener('click', () => {\n          if(customOverride[f.key]){\n            customOverride[f.key] = false;\n            updateFromGlobal();\n          }\n        });\n        lbl.appendChild(tg);\n        tagMap[f.key] = tg;\n      }\n      const inp = document.createElement('input');\n      inp.placeholder = f.placeholder || f.example || '';\n      inp.addEventListener('input', () => {\n        localVals[f.key] = inp.value;\n        if(f.global){\n          customOverride[f.key] = true;\n          tagMap[f.key].className = 'link-tag custom';\n          tagMap[f.key].textContent = '\u270f\ufe0f Manual (\u21ba)';\n          tagMap[f.key].title = 'Clic para volver a usar el valor global';\n        }\n        render();\n      });\n      wrap.appendChild(lbl);\n      wrap.appendChild(inp);\n      inputsEl.appendChild(wrap);\n      inputMap[f.key] = inp;\n    });\n\n    function getGlobalVal(gk){\n      if(gk === 'ldap') return calcLdap(state.domain);\n      return state[gk] || '';\n    }\n\n    function getVal(f){\n      if(f.global && !customOverride[f.key]) return getGlobalVal(f.global);\n      return localVals[f.key] || '';\n    }\n\n    function buildText(forHtml){\n      return cfg.template.replace(/\\{(\\w+)\\}/g, (_, k) => {\n        const f = cfg.fields.find(x => x.key === k);\n        if(!f) return '';\n        const v = getVal(f);\n        if(forHtml){\n          return v ? `<span class=\"tok-filled\">${esc(v)}<\/span>` : `<span class=\"tok-empty\">[${esc(f.label)}]<\/span>`;\n        }\n        return v || `<${f.label}>`;\n      });\n    }\n\n    function render(){\n      termEl.innerHTML = buildText(true);\n    }\n\n    function updateFromGlobal(){\n      cfg.fields.forEach(f => {\n        if(f.global && !customOverride[f.key]){\n          const gv = getGlobalVal(f.global);\n          inputMap[f.key].value = gv;\n          tagMap[f.key].className = 'link-tag';\n          tagMap[f.key].textContent = '\ud83d\udd17 Global';\n        }\n      });\n      render();\n    }\n\n    function clearLocal(){\n      cfg.fields.forEach(f => {\n        localVals[f.key] = '';\n        customOverride[f.key] = false;\n        inputMap[f.key].value = f.global ? getGlobalVal(f.global) : '';\n        if(f.global){\n          tagMap[f.key].className = 'link-tag';\n          tagMap[f.key].textContent = '\ud83d\udd17 Global';\n        }\n      });\n      render();\n    }\n\n    card.querySelector('.btn-ex').addEventListener('click', () => {\n      cfg.fields.forEach(f => {\n        const val = (f.global && getGlobalVal(f.global)) ? getGlobalVal(f.global) : (f.example || '');\n        localVals[f.key] = val;\n        inputMap[f.key].value = val;\n        if(f.global && !getGlobalVal(f.global)){\n          customOverride[f.key] = true;\n          tagMap[f.key].className = 'link-tag custom';\n          tagMap[f.key].textContent = '\u270f\ufe0f Ejemplo (\u21ba)';\n        }\n      });\n      render();\n    });\n\n    card.querySelector('.btn-clr').addEventListener('click', clearLocal);\n\n    const cpBtn = card.querySelector('.btn-copy');\n    cpBtn.addEventListener('click', () => {\n      const plain = buildText(false);\n      if(navigator.clipboard){\n        navigator.clipboard.writeText(plain).then(() => {\n          cpBtn.textContent = '\u2705 \u00a1Copiado!';\n          setTimeout(() => cpBtn.textContent = '\ud83d\udccb Copiar', 1300);\n        });\n      }\n    });\n\n    container.appendChild(card);\n    const api = { updateFromGlobal, clearLocal };\n    builders.push(api);\n    updateFromGlobal();\n  }\n\n  // ===== CHECKLISTS =====\n  function createChecklist(containerId, items){\n    const box = document.getElementById(containerId);\n    const prog = document.createElement('div');\n    prog.className = 'chk-prog';\n    prog.innerHTML = `<span class=\"chk-txt\">0 / ${items.length} completados<\/span><div class=\"chk-bar\"><div style=\"width:0%\"><\/div><\/div>`;\n    box.appendChild(prog);\n\n    const list = document.createElement('div');\n    list.className = 'chk-wrap';\n    let checks = [];\n\n    function update(){\n      const done = checks.filter(c => c.checked).length;\n      prog.querySelector('.chk-txt').textContent = `${done} / ${items.length} completados`;\n      prog.querySelector('.chk-bar div').style.width = Math.round(done / items.length * 100) + '%';\n    }\n\n    items.forEach(txt => {\n      const lbl = document.createElement('label');\n      lbl.className = 'chk-item';\n      const cb = document.createElement('input');\n      cb.type = 'checkbox';\n      cb.addEventListener('change', () => { lbl.classList.toggle('done', cb.checked); update(); });\n      const sp = document.createElement('span');\n      sp.innerHTML = txt;\n      lbl.appendChild(cb);\n      lbl.appendChild(sp);\n      list.appendChild(lbl);\n      checks.push(cb);\n    });\n    box.appendChild(list);\n  }\n\n  createChecklist('chk-t22', [\n    '<b>E1 \u00b7 Preparar servidor:<\/b> Poner tarjeta en red interna <code>SOX<\/code>, cambiar hostname (ej. <code>SRV-AD<\/code>), asignar IP est\u00e1tica y reiniciar.',\n    '<b>E2 \u00b7 Instalar rol AD DS:<\/b> Instalar <i>Active Directory Domain Services<\/i> y promocionar creando un nuevo bosque (<code>Add a new forest<\/code>).',\n    '<b>E2 \u00b7 Post-promoci\u00f3n:<\/b> Verificar que al reiniciar entras como <code>NETBIOS\\\\Administrator<\/code> y revisar el DNS preferido de la tarjeta.',\n    '<b>E3 \u00b7 Preparar Windows 10:<\/b> Poner red interna <code>SOX<\/code>, IP en el mismo rango y <b>DNS preferido = IP del servidor DC<\/b>.',\n    '<b>E3 \u00b7 Comprobar conectividad:<\/b> Hacer <code>ping<\/code> al servidor (IP y nombre DNS) y verificar que la <b>hora<\/b> coincide.',\n    '<b>E3 \u00b7 Unir al dominio:<\/b> Cambiar de Workgroup a Domain usando credenciales de Administrador del dominio y reiniciar.'\n  ]);\n\n  createChecklist('chk-t23', [\n    'Abrir <b>Active Directory Users and Computers<\/b> (<code>dsa.msc<\/code>).',\n    'En el men\u00fa superior, activar <b>View \u2192 Advanced Features<\/b> (si no lo activas, la pesta\u00f1a Object no existe).',\n    'Hacer clic derecho sobre la OU <code>error<\/code> \u2192 <b>Properties<\/b> \u2192 pesta\u00f1a <b>Object<\/b>.',\n    'Desmarcar <b>Protect object from accidental deletion<\/b> \u2192 Aplicar \u2192 ahora ya puedes hacer clic derecho y <b>Delete<\/b>.'\n  ]);\n\n  createChecklist('chk-t25', [\n    'Iniciar sesi\u00f3n en <code>WIN10<\/code> con un usuario del dominio configurado.',\n    'Abrir <b>This PC (Este equipo)<\/b> y comprobar que aparece la unidad de red personal (ej. <code>P:<\/code>) y puedes crear un archivo dentro.',\n    'Ir a <b>Advanced System Settings \u2192 User Profiles \u2192 Settings<\/b> y comprobar que el usuario aparece como <b>Roaming | Roaming<\/b>.',\n    'Crear un archivo en el Escritorio, cerrar sesi\u00f3n y verificar en el servidor que se ha guardado dentro de <code>Profiles$<\/code>.'\n  ]);\n\n  // ===== DEFINICI\u00d3N DE COMANDOS =====\n  const c22 = document.getElementById('cmds-t22');\n  [\n    {\n      title: '1. Cambiar el nombre del servidor (Hostname)', where: 'dc',\n      desc: 'Cambia el nombre del equipo y reinicia autom\u00e1ticamente. Es obligatorio hacerlo <b>antes<\/b> de instalar Active Directory.',\n      template: 'Rename-Computer -NewName \"{server}\" -Restart',\n      fields: [{key:'server', label:'Hostname servidor', global:'server', example:'SRV-AD'}],\n      parts: [['-NewName','Nuevo nombre del PC (sin \u00f1 ni acentos)'], ['-Restart','Reinicia al momento para aplicar el cambio']],\n      warn: 'Una vez promocionado a DC ya no se puede cambiar el nombre.'\n    },\n    {\n      title: '2. Asignar IP est\u00e1tica al servidor', where: 'dc',\n      desc: 'Un Controlador de Dominio nunca puede tener IP din\u00e1mica (DHCP). Con este comando fijas su IP en la interfaz de red interna.',\n      template: 'New-NetIPAddress -InterfaceAlias \"{iface}\" -IPAddress \"{ip}\" -PrefixLength {mask}',\n      fields: [\n        {key:'iface', label:'Tarjeta de red', example:'Ethernet'},\n        {key:'ip', label:'IP Servidor', global:'ip', example:'192.168.10.10'},\n        {key:'mask', label:'M\u00e1scara (CIDR)', example:'24'}\n      ],\n      parts: [['-InterfaceAlias','Nombre de la tarjeta (m\u00edralo con Get-NetAdapter)'], ['-PrefixLength 24','Equivale a 255.255.255.0']]\n    },\n    {\n      title: '3. Apuntar el DNS preferido al servidor DC', where: 'both',\n      desc: 'Indica al equipo qu\u00e9 servidor DNS debe consultar. En el cliente Windows 10 es <b>imprescindible<\/b> poner la IP del DC para poder unirlo.',\n      template: 'Set-DnsClientServerAddress -InterfaceAlias \"{iface}\" -ServerAddresses \"{ip}\"',\n      fields: [\n        {key:'iface', label:'Tarjeta de red', example:'Ethernet'},\n        {key:'ip', label:'IP del DNS (DC)', global:'ip', example:'192.168.10.10'}\n      ],\n      parts: [['-ServerAddresses','IP del servidor que resolver\u00e1 el dominio']]\n    },\n    {\n      title: '4. Instalar el rol Active Directory (AD DS)', where: 'dc',\n      desc: 'Instala el software de Active Directory y las herramientas gr\u00e1ficas de administraci\u00f3n (ADUC, GPMC). Todav\u00eda NO crea el dominio.',\n      template: 'Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools',\n      fields: [],\n      parts: [['AD-Domain-Services','Rol principal de Active Directory'], ['-IncludeManagementTools','Instala consolas gr\u00e1ficas (dsa.msc, gpmc.msc)']]\n    },\n    {\n      title: '5. Promocionar el servidor (Crear nuevo bosque/dominio)', where: 'dc',\n      desc: 'Convierte el servidor en el primer Controlador de Dominio del bosque e instala el servidor DNS integrado. Te pedir\u00e1 la contrase\u00f1a DSRM.',\n      template: 'Import-Module ADDSDeployment\\nInstall-ADDSForest -DomainName \"{domain}\" -DomainNetbiosName \"{netbios}\" -InstallDns:$true -CreateDnsDelegation:$false',\n      fields: [\n        {key:'domain', label:'Dominio DNS', global:'domain', example:'addrm.local'},\n        {key:'netbios', label:'Nombre NetBIOS', global:'netbios', example:'ADDRM'}\n      ],\n      parts: [['Install-ADDSForest','Crea el primer dominio del bosque'], ['-CreateDnsDelegation:$false','En clase no delegamos el DNS a un padre']]\n    },\n    {\n      title: '6. Degradar el \u00faltimo Controlador de Dominio', where: 'dc',\n      desc: 'Sirve para deshacer la promoci\u00f3n cuando quieres eliminar el dominio de forma limpia.',\n      template: 'Uninstall-ADDSDomainController -LastDomainControllerInDomain:$true -RemoveApplicationPartitions',\n      fields: [],\n      parts: [['-LastDomainControllerInDomain:$true','Indica que es el \u00fanico/\u00faltimo DC y se borra el dominio']]\n    },\n    {\n      title: '7. Unir cliente Windows 10 al dominio', where: 'w10',\n      desc: 'Une el PC cliente al dominio desde PowerShell (equivalente a Configuraci\u00f3n \u2192 Nombre de equipo \u2192 Dominio) y reinicia.',\n      template: 'Add-Computer -DomainName \"{domain}\" -Credential \"{netbios}\\\\Administrator\" -Restart',\n      fields: [\n        {key:'domain', label:'Dominio DNS', global:'domain', example:'addrm.local'},\n        {key:'netbios', label:'NetBIOS', global:'netbios', example:'ADDRM'}\n      ],\n      parts: [['-Credential','Pide la contrase\u00f1a del Administrador del dominio'], ['-Restart','Reinicia para aplicar la uni\u00f3n']]\n    },\n    {\n      title: '8. Comprobar conectividad y resoluci\u00f3n DNS', where: 'w10',\n      desc: 'Ejecuta esto en el cliente <b>antes<\/b> de unirlo al dominio. Si ambos responden bien, la uni\u00f3n funcionar\u00e1 sin errores.',\n      template: 'ping {ip}\\nnslookup {domain}',\n      fields: [\n        {key:'ip', label:'IP Servidor DC', global:'ip', example:'192.168.10.10'},\n        {key:'domain', label:'Dominio DNS', global:'domain', example:'addrm.local'}\n      ],\n      parts: [['ping','Comprueba conexi\u00f3n de red'], ['nslookup','Comprueba que el DNS del DC resuelve el dominio']]\n    }\n  ].forEach(c => createBuilder(c22, c));\n\n  // TEMA 2.3\n  const c23 = document.getElementById('cmds-t23');\n  [\n    {\n      title: 'Abrir consola gr\u00e1fica ADUC', where: 'dc',\n      desc: 'Atajo r\u00e1pido para abrir <i>Active Directory Users and Computers<\/i> desde Ejecutar (Win+R) o PowerShell.',\n      template: 'dsa.msc',\n      fields: []\n    },\n    {\n      title: 'Comprobar el \u00e1rbol de OUs creadas', where: 'dc',\n      desc: 'Lista todas las Unidades Organizativas y su ruta LDAP (DistinguishedName) para verificar que no te has equivocado de sitio.',\n      template: 'Get-ADOrganizationalUnit -Filter * | Select-Object Name, DistinguishedName',\n      fields: [],\n      parts: [['-Filter *','Muestra todas las OUs'], ['Select-Object','Ense\u00f1a solo el nombre y su ruta exacta']]\n    }\n  ].forEach(c => createBuilder(c23, c));\n\n  // TEMA 2.4\n  const c24v = document.getElementById('cmds-t24-vars');\n  createBuilder(c24v, {\n    title: 'Definir variables al principio de tu script (.ps1)', where: 'dc',\n    desc: 'Guardar el dominio, la ruta LDAP y la contrase\u00f1a en variables al principio del script evita repetir texto largo y reduce errores de escritura.',\n    template: '$domini = \"{domain}\"\\n$baseDN = \"{ldap}\"\\n$pass = ConvertTo-SecureString \"{pass}\" -AsPlainText -Force',\n    fields: [\n      {key:'domain', label:'Dominio DNS', global:'domain', example:'addrm.local'},\n      {key:'ldap', label:'Ruta LDAP Base', global:'ldap', example:'DC=addrm,DC=local'},\n      {key:'pass', label:'Contrase\u00f1a', global:'pass', example:'P@ssw0rd123'}\n    ],\n    parts: [['$baseDN','Ruta ra\u00edz del dominio en formato LDAP'], ['ConvertTo-SecureString','Convierte texto plano en contrase\u00f1a cifrada que acepta AD']]\n  });\n\n  const c24e1 = document.getElementById('cmds-t24-e1');\n  [\n    {\n      title: 'Crear una Unidad Organizativa (OU)', where: 'dc',\n      desc: 'Crea una nueva OU dentro de la ruta padre que indiques (la ra\u00edz del dominio o dentro de otra OU como ORG).',\n      template: 'New-ADOrganizationalUnit -Name \"{ou}\" -Path \"{parent}\" -ProtectedFromAccidentalDeletion $true',\n      fields: [\n        {key:'ou', label:'Nombre OU', example:'ORG'},\n        {key:'parent', label:'DN del padre', global:'ldap', example:'DC=addrm,DC=local'}\n      ],\n      parts: [['-Name','Nombre de la nueva OU'], ['-Path','D\u00f3nde se guarda (DN del padre)'], ['-ProtectedFromAccidentalDeletion','Protege contra borrado accidental']]\n    },\n    {\n      title: 'Quitar protecci\u00f3n a una OU (para poder moverla o borrarla)', where: 'dc',\n      desc: 'Equivale en PowerShell a desmarcar la casilla en View \u2192 Advanced Features \u2192 Object.',\n      template: 'Set-ADOrganizationalUnit -Identity \"OU={ou},{parent}\" -ProtectedFromAccidentalDeletion $false',\n      fields: [\n        {key:'ou', label:'OU a desproteger', example:'error'},\n        {key:'parent', label:'DN del padre', global:'ldap', example:'DC=addrm,DC=local'}\n      ]\n    },\n    {\n      title: 'Mover o Renombrar una OU (o cualquier objeto)', where: 'dc',\n      desc: '<code>Move-ADObject<\/code> cambia un objeto de carpeta/OU; <code>Rename-ADObject<\/code> solo le cambia el nombre.',\n      template: 'Move-ADObject -Identity \"OU={ou},{parent}\" -TargetPath \"{target}\" -Confirm:$false\\nRename-ADObject -Identity \"OU={ou},{target}\" -NewName \"{newname}\"',\n      fields: [\n        {key:'ou', label:'OU original', example:'Vendes'},\n        {key:'parent', label:'DN actual', global:'ldap', example:'DC=addrm,DC=local'},\n        {key:'target', label:'DN destino', example:'OU=ORG,DC=addrm,DC=local'},\n        {key:'newname', label:'Nuevo nombre', example:'Comercial'}\n      ]\n    },\n    {\n      title: 'Borrar una OU vac\u00eda', where: 'dc',\n      desc: 'Elimina una OU previamente desprotegida.',\n      template: 'Remove-ADOrganizationalUnit -Identity \"OU={ou},{parent}\" -Confirm:$false',\n      fields: [\n        {key:'ou', label:'OU a borrar', example:'error'},\n        {key:'parent', label:'DN del padre', global:'ldap', example:'DC=addrm,DC=local'}\n      ],\n      warn: 'NO uses -Recursive salvo que est\u00e9s 100% seguro: borra todo lo que haya dentro sin preguntar.'\n    }\n  ].forEach(c => createBuilder(c24e1, c));\n\n  const c24e2 = document.getElementById('cmds-t24-e2');\n  [\n    {\n      title: 'Crear un Grupo Global de Seguridad', where: 'dc',\n      desc: 'En clase todos los grupos son de \u00e1mbito <b>Global<\/b> (<code>-GroupScope 1<\/code>) y tipo <b>Security<\/b>.',\n      template: 'New-ADGroup -Name \"{grp}\" -Path \"OU={ou},{ldap}\" -GroupScope 1 -GroupCategory Security',\n      fields: [\n        {key:'grp', label:'Nombre Grupo', example:'G_IT'},\n        {key:'ou', label:'OU destino', example:'Grups,OU=ORG'},\n        {key:'ldap', label:'Ruta LDAP Base', global:'ldap', example:'DC=addrm,DC=local'}\n      ],\n      parts: [['-GroupScope 1','1 = Global (0=DomainLocal, 2=Universal)'], ['-GroupCategory Security','Grupo para dar permisos']]\n    },\n    {\n      title: 'A\u00f1adir miembros a un grupo (desde el Grupo)', where: 'dc',\n      desc: 'Mete uno o varios usuarios (o subgrupos) dentro de un grupo concreto.',\n      template: 'Add-ADGroupMember -Identity \"{grp}\" -Members \"{u1}\",\"{u2}\"',\n      fields: [\n        {key:'grp', label:'Grupo', example:'G_IT'},\n        {key:'u1', label:'Miembro 1', example:'n.prat'},\n        {key:'u2', label:'Miembro 2', example:'o.camps'}\n      ]\n    },\n    {\n      title: 'A\u00f1adir un usuario a varios grupos (desde el Usuario)', where: 'dc',\n      desc: 'Hace lo mismo pero pensado al rev\u00e9s: coges un usuario y le dices a qu\u00e9 grupos pertenece.',\n      template: 'Add-ADPrincipalGroupMembership -Identity \"{usr}\" -MemberOf \"{g1}\",\"{g2}\"',\n      fields: [\n        {key:'usr', label:'Usuario', example:'n.prat'},\n        {key:'g1', label:'Grupo 1', example:'G_IT'},\n        {key:'g2', label:'Grupo 2', example:'G_Empleats'}\n      ]\n    }\n  ].forEach(c => createBuilder(c24e2, c));\n\n  const c24e3 = document.getElementById('cmds-t24-e3');\n  [\n    {\n      title: 'Crear un Usuario por Script (contrase\u00f1a autom\u00e1tica)', where: 'dc',\n      desc: 'Crea un usuario activado (<code>-Enabled $true<\/code>) con su login, UPN, nombre, apellidos y contrase\u00f1a sin que PowerShell se pare a preguntar.',\n      template: 'New-ADUser -Name \"{name}\" -GivenName \"{gn}\" -Surname \"{sn}\" -SamAccountName \"{sam}\" -UserPrincipalName \"{sam}@{domain}\" -Path \"OU={ou},{ldap}\" -AccountPassword (ConvertTo-SecureString \"{pass}\" -AsPlainText -Force) -Enabled $true -PasswordNeverExpires $false',\n      fields: [\n        {key:'name', label:'Nombre completo', example:'Carla Fonts'},\n        {key:'gn', label:'Nombre', example:'Carla'},\n        {key:'sn', label:'Apellidos', example:'Fonts'},\n        {key:'sam', label:'Login (SamAccountName)', example:'c.fonts'},\n        {key:'domain', label:'Dominio', global:'domain', example:'addrm.local'},\n        {key:'ou', label:'OU destino', example:'Vendes,OU=ORG'},\n        {key:'ldap', label:'Ruta LDAP Base', global:'ldap', example:'DC=addrm,DC=local'},\n        {key:'pass', label:'Contrase\u00f1a', global:'pass', example:'P@ssw0rd123'}\n      ],\n      parts: [['-SamAccountName','Login corto (ej: c.fonts)'], ['-UserPrincipalName','Login completo (c.fonts@dominio)'], ['-Enabled $true','Activa la cuenta al crearla']]\n    },\n    {\n      title: 'Modificar atributos de un Usuario existente', where: 'dc',\n      desc: 'Con <code>Set-ADUser<\/code> solo escribes <code>-Identity<\/code> y las propiedades concretas que quieras cambiar (por ejemplo el correo o descripci\u00f3n).',\n      template: 'Set-ADUser -Identity \"{sam}\" -EmailAddress \"{email}\" -Description \"{desc}\"',\n      fields: [\n        {key:'sam', label:'Login usuario', example:'c.fonts'},\n        {key:'email', label:'Email', example:'c.fonts@empresa.com'},\n        {key:'desc', label:'Descripci\u00f3n', example:'Comercial de Vendes'}\n      ]\n    }\n  ].forEach(c => createBuilder(c24e3, c));\n\n  const c24e4 = document.getElementById('cmds-t24-e4');\n  [\n    {\n      title: 'Buscar usuarios con filtro (-like / -notlike)', where: 'dc',\n      desc: 'Busca usuarios cuyo correo NO acabe en <code>.com<\/code>. Recuerda a\u00f1adir <code>-Properties<\/code> para ver campos extra como EmailAddress.',\n      template: 'Get-ADUser -Filter {EmailAddress -notlike \"{pat}\"} -Properties EmailAddress | Select-Object Name, SamAccountName, EmailAddress',\n      fields: [{key:'pat', label:'Patr\u00f3n', example:'*.com'}],\n      parts: [['-notlike \"*.com\"','Descarta correos acabados en .com'], ['-Properties','Carga atributos que AD no muestra por defecto']]\n    },\n    {\n      title: 'Modificar varios objetos a la vez usando Pipe (|)', where: 'dc',\n      desc: 'El s\u00edmbolo <code>|<\/code> pasa el resultado del primer comando al segundo. Aqu\u00ed pone una descripci\u00f3n a todos los grupos del dominio.',\n      template: 'Get-ADGroup -Filter * -SearchBase \"OU={ou},{ldap}\" | Set-ADGroup -Description \"{desc}\"',\n      fields: [\n        {key:'ou', label:'OU donde buscar', example:'Grups,OU=ORG'},\n        {key:'ldap', label:'Ruta LDAP Base', global:'ldap', example:'DC=addrm,DC=local'},\n        {key:'desc', label:'Nueva descripci\u00f3n', example:'Grupo corporativo'}\n      ]\n    }\n  ].forEach(c => createBuilder(c24e4, c));\n\n  // TEMA 2.5\n  const c25 = document.getElementById('cmds-t25');\n  [\n    {\n      title: '1. Ruta UNC para Carpeta Personal (Home Folder \u00b7 Unidad P:)', where: 'dc',\n      desc: 'Pega esta ruta en ADUC \u2192 Propiedades del usuario \u2192 pesta\u00f1a <b>Profile<\/b> \u2192 <i>Home folder \u2192 Connect P:<\/i>.',\n      template: '\\\\\\\\{server}\\\\{share}\\\\%username%',\n      fields: [\n        {key:'server', label:'Servidor AD', global:'server', example:'SRV-AD'},\n        {key:'share', label:'Carpeta compartida', example:'Personals'}\n      ],\n      parts: [['%username%','ADUC lo sustituye autom\u00e1ticamente por el login de cada usuario seleccionado']]\n    },\n    {\n      title: '2. Ruta UNC para Perfil M\u00f3vil (Roaming oculto con $)', where: 'dc',\n      desc: 'Pega esta ruta en ADUC \u2192 Propiedades del usuario \u2192 pesta\u00f1a <b>Profile<\/b> \u2192 <i>Profile path<\/i>.',\n      template: '\\\\\\\\{server}\\\\{share}\\\\%username%',\n      fields: [\n        {key:'server', label:'Servidor AD', global:'server', example:'SRV-AD'},\n        {key:'share', label:'Carpeta oculta ($)', example:'Profiles$'}\n      ],\n      parts: [['$','El d\u00f3lar al final oculta el recurso compartido en la red']],\n      warn: 'Nunca configures scripts de inicio de sesi\u00f3n en esta pesta\u00f1a Profile; los scripts van siempre por GPO (Tema 2.6).'\n    },\n    {\n      title: '3. Crear carpeta y compartirla por PowerShell (New-SmbShare)', where: 'dc',\n      desc: 'Crea la carpeta f\u00edsica en el servidor y la comparte en red dando permiso SMB a los usuarios autenticados (luego ajustas NTFS).',\n      template: 'New-Item -Path \"{localpath}\" -ItemType Directory -Force\\nNew-SmbShare -Name \"{share}\" -Path \"{localpath}\" -FullAccess \"Authenticated Users\"',\n      fields: [\n        {key:'localpath', label:'Ruta local servidor', example:'D:\\\\Personals'},\n        {key:'share', label:'Nombre recurso red', example:'Personals'}\n      ],\n      warn: 'En un servidor real de producci\u00f3n, NUNCA guardes carpetas compartidas en C: (usa un disco de datos como D:).'\n    },\n    {\n      title: '4. Asignar Carpeta Personal y Perfil M\u00f3vil por PowerShell', where: 'dc',\n      desc: 'Configura la unidad personal y el perfil m\u00f3vil de un usuario directamente sin abrir ADUC.',\n      template: 'Set-ADUser -Identity \"{usr}\" -HomeDrive \"{drive}\" -HomeDirectory \"\\\\\\\\{server}\\\\Personals\\\\{usr}\" -ProfilePath \"\\\\\\\\{server}\\\\Profiles$\\\\{usr}\"',\n      fields: [\n        {key:'usr', label:'Login usuario', example:'a.puig'},\n        {key:'drive', label:'Letra unidad', example:'P:'},\n        {key:'server', label:'Servidor AD', global:'server', example:'SRV-AD'}\n      ]\n    }\n  ].forEach(c => createBuilder(c25, c));\n\n  // TEMA 2.6\n  const c26 = document.getElementById('cmds-t26');\n  [\n    {\n      title: '1. Abrir consola de Directivas de Grupo (GPMC)', where: 'dc',\n      desc: 'Abre <i>Group Policy Management<\/i> en el servidor para crear, editar y vincular GPOs.',\n      template: 'gpmc.msc',\n      fields: []\n    },\n    {\n      title: '2. Forzar aplicaci\u00f3n inmediata de GPOs en el cliente', where: 'w10',\n      desc: 'Obliga a Windows 10 a descargar y aplicar los cambios de las GPOs sin esperar 90 minutos ni reiniciar.',\n      template: 'gpupdate /force',\n      fields: [],\n      parts: [['/force','Reaplica todas las directivas, hayan cambiado o no']]\n    },\n    {\n      title: '3. Comprobar qu\u00e9 GPOs se han aplicado (Informe HTML o consola)', where: 'w10',\n      desc: 'Si una GPO no funciona en el examen, este comando te dice exactamente cu\u00e1les se aplicaron y cu\u00e1les fueron denegadas.',\n      template: 'gpresult /r\\ngpresult /h C:\\\\Users\\\\Public\\\\informe_gpo.html',\n      fields: [],\n      parts: [['/r','Resumen r\u00e1pido en consola'], ['/h','Genera un informe HTML visual muy claro']]\n    },\n    {\n      title: '4. Ruta UNC de imagen para Fondo de Escritorio / Pantalla de Bloqueo', where: 'dc',\n      desc: 'Las im\u00e1genes usadas en GPOs deben estar en una carpeta compartida con permiso <b>Authenticated Users \u2192 Read<\/b>.',\n      template: '\\\\\\\\{server}\\\\{share}\\\\{img}',\n      fields: [\n        {key:'server', label:'Servidor AD', global:'server', example:'SRV-AD'},\n        {key:'share', label:'Carpeta recursos', example:'RecursosGPO'},\n        {key:'img', label:'Archivo imagen', example:'fondo_empresa.jpg'}\n      ]\n    }\n  ].forEach(c => createBuilder(c26, c));\n\n  // TABLA INTERACTIVA DE 6 GPOS\n  const GPOS = [\n    {name:'GPO_Contrasenyes', scope:'Equipo', link:'Ra\u00edz del dominio', path:'Computer Config \u2192 Policies \u2192 Windows Settings \u2192 Security Settings \u2192 Account Policies \u2192 Password Policy', desc:'Exige longitud m\u00ednima, complejidad y caducidad de contrase\u00f1as.'},\n    {name:'GPO_Bloqueig_Comptes', scope:'Equipo', link:'Ra\u00edz del dominio', path:'Computer Config \u2192 Policies \u2192 Windows Settings \u2192 Security Settings \u2192 Account Policies \u2192 Account Lockout Policy', desc:'Bloquea la cuenta tras X intentos fallidos de contrase\u00f1a.'},\n    {name:'GPO_Inici_Local', scope:'Equipo', link:'OU Equips', path:'Computer Config \u2192 Policies \u2192 Windows Settings \u2192 Security Settings \u2192 Local Policies \u2192 User Rights Assignment \u2192 Allow log on locally', desc:'Controla qu\u00e9 usuarios o grupos tienen permiso para iniciar sesi\u00f3n en esos PCs.'},\n    {name:'GPO_Fons_Escriptori', scope:'Usuario', link:'OU Usuaris', path:'User Config \u2192 Policies \u2192 Administrative Templates \u2192 Desktop \u2192 Desktop \u2192 Desktop Wallpaper', desc:'Impone un fondo corporativo usando la ruta UNC compartida.'},\n    {name:'GPO_Bloqueig_Panel', scope:'Usuario', link:'OU Alumnat', path:'User Config \u2192 Policies \u2192 Administrative Templates \u2192 Control Panel \u2192 Prohibit access to Control Panel and PC settings', desc:'Impide que los usuarios abran el Panel de Control o Configuraci\u00f3n.'},\n    {name:'GPO_Bloqueig_USB', scope:'Usuario', link:'OU Alumnat', path:'User Config \u2192 Policies \u2192 Administrative Templates \u2192 System \u2192 Removable Storage Access', desc:'Bloquea lectura/escritura en pendrives USB y discos extra\u00edbles.'}\n  ];\n\n  let curScope = 'all';\n  const gpoSearch = document.getElementById('gpoSearch');\n  const gpoBody = document.getElementById('gpoBody');\n\n  function renderGpos(){\n    const q = gpoSearch.value.trim().toLowerCase();\n    const rows = GPOS.filter(g => {\n      if(curScope !== 'all' && g.scope !== curScope) return false;\n      if(!q) return true;\n      return (g.name + ' ' + g.path + ' ' + g.desc + ' ' + g.link).toLowerCase().includes(q);\n    });\n    gpoBody.innerHTML = rows.length ? rows.map(g => `\n      <tr>\n        <td><b>${esc(g.name)}<\/b><\/td>\n        <td><span class=\"where ${g.scope==='Equipo'?'dc':'w10'}\">${g.scope==='Equipo'?'\ud83d\udda5\ufe0f Equipo':'\ud83d\udc64 Usuario'}<\/span><\/td>\n        <td>${esc(g.link)}<\/td>\n        <td><code>${esc(g.path)}<\/code><\/td>\n        <td>${esc(g.desc)}<\/td>\n      <\/tr>\n    `).join('') : '<tr><td colspan=\"5\" style=\"text-align:center;color:#94a3b8\">No se encontr\u00f3 ninguna GPO con ese filtro.<\/td><\/tr>';\n  }\n\n  gpoSearch.addEventListener('input', renderGpos);\n  document.querySelectorAll('.pill-f').forEach(b => {\n    b.addEventListener('click', () => {\n      document.querySelectorAll('.pill-f').forEach(x => x.classList.remove('active'));\n      b.classList.add('active');\n      curScope = b.dataset.scope;\n      renderGpos();\n    });\n  });\n\n  // Inicializar\n  renderOuTree();\n  renderGpos();\n})();\n<\/script>\n<\/body>\n<\/html>";
