<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practica DNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2333;--muted:#5b6679;--line:#dde3ee;--blue:#2f6fed;--green:#16a36a;--red:#e5484d;--orange:#f28c18;--purple:#8b5cf6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#18202f;--ink:#e8edf7;--muted:#9aa6bd;--line:#2a3550}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
header{background:linear-gradient(120deg,var(--blue),var(--purple));color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px}
header h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;opacity:.9;font-size:.92rem}
.card{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 1px 5px rgba(20,30,60,.1)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 10px}
.bar div{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .3s}
.meta{font-size:.88rem;color:var(--muted)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;color:#fff;padding:2px 10px;border-radius:12px;margin-bottom:10px}
h2{margin:0 0 14px;font-size:1.2rem}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:rgba(47,111,237,.14);font-weight:600}
.opt:focus-visible,.btn:focus-visible,.dot:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn.fin{background:var(--green)}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.dot{width:32px;height:32px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.82rem;cursor:pointer}
.dot.done{background:rgba(47,111,237,.18);border-color:var(--blue)}
.dot.cur{outline:3px solid var(--orange)}
.big{font-size:3rem;font-weight:800;text-align:center;margin:4px 0}
.rev{border-left:5px solid var(--red);background:rgba(229,72,77,.08);border-radius:10px;padding:12px 14px;margin:12px 0}
.rev p{margin:4px 0}
.no{color:var(--red);font-weight:700}.yes{color:var(--green);font-weight:700}
.hist{margin-top:16px;font-size:.92rem;color:var(--muted)}
.c{text-align:center}
.opt.dead{opacity:.45;text-decoration:line-through;border-color:var(--red);cursor:default}
.opt.good{border-color:var(--green);background:rgba(22,163,106,.16);font-weight:600}
.help{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:5px solid var(--orange);background:rgba(242,140,24,.12)}
.help.ok{border-left-color:var(--green);background:rgba(22,163,106,.12)}
.mode{display:inline-block;font-size:.78rem;font-weight:700;color:var(--purple);margin-left:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hb{color:#fff;border-color:#fff;padding:8px 14px;margin:0}
.mb{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;cursor:pointer}
.mb:hover{border-color:var(--blue)}.mb:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.mb.rec{border-color:var(--green);background:rgba(22,163,106,.1)}
.mb.off,.mb:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.7)}
.mb.off:hover,.mb:disabled:hover{transform:none!important;box-shadow:none!important;border-color:var(--line)!important}
.mb b{display:block;font-size:1.1rem}.mb span{color:var(--muted);font-size:.92rem}
.inp{width:100%;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0}
.inp:focus{border-color:var(--blue);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.wrap{padding-top:72px}
header{background:var(--hg,linear-gradient(120deg,var(--blue),var(--purple)))}
.wheel{position:fixed;top:12px;left:12px;z-index:1000;width:46px;height:46px;border-radius:50%;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;overflow:hidden}
.wheel input{opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.wheel:focus-within{outline:3px solid var(--orange);outline-offset:2px}
.wr{position:fixed;top:19px;left:66px;z-index:1000;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:1rem;line-height:1}
.wr:focus-visible{outline:3px solid var(--orange)}
body.full .wrap{display:none}
#full{position:fixed;top:0;left:0;width:100%;height:100%;border:0;z-index:500;background:var(--bg)}
.fb{position:fixed;top:12px;right:12px;z-index:1000;margin:0;box-shadow:0 2px 8px rgba(0,0,0,.35)}

@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.card.enter{animation:in .28s ease both}
.shake{animation:shake .4s}.pop{animation:pop .35s}
.inp.shake{border-color:var(--red)}.inp.pop{border-color:var(--green)}
.mb,.opt,.btn{transition:transform .12s,border-color .12s,box-shadow .12s,background .12s}
.mb:hover,.opt:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(20,30,60,.14)}
.btn:not(:disabled):active,.mb:active,.opt:not(:disabled):active{transform:scale(.97)}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:2000;pointer-events:none;animation:fall linear forwards}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;font-weight:700;z-index:3000;animation:tin .25s both}
.stats{margin-top:18px;padding-top:12px;border-top:2px solid var(--line)}
.srow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:.88rem}
.sl{width:140px;flex:none}.sp{width:42px;text-align:right;font-weight:700}
.sbar{flex:1;height:12px;background:var(--line);border-radius:7px;overflow:hidden}
.sbar div{height:100%;border-radius:7px;transition:width .8s ease}
.fc{display:block;width:100%;height:210px;perspective:900px;background:none;border:0;padding:0;margin:8px 0;cursor:pointer;font:inherit;color:inherit}
.fci{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.fc:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:14px}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--tc,var(--blue));border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.ff b{font-size:1.35rem}.ff small{color:var(--muted)}
.ff.bk{transform:rotateY(180deg);border-color:var(--green)}
.wrap{position:relative;z-index:1}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
body.pt{--card:rgba(255,255,255,.13);--ink:#fff;--muted:rgba(255,255,255,.78);--line:rgba(255,255,255,.3);
font-family:'Fredoka','Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;font-weight:500;
background:linear-gradient(-45deg,#101a4f,var(--blue),#5b2a86,#0e7490,#101a4f);background-size:400% 400%;animation:bgshift 16s ease infinite;color:#fff}
body.pt header{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
body.pt header h1{font-weight:700;letter-spacing:.02em;text-shadow:0 0 16px rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.2)}
body.pt .card{background:color-mix(in srgb,var(--cd,#0e1234) 42%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 44px rgba(0,0,0,.32)}
body.pt .card.clear{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
body.pt h2{font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.18)}
body.pt .opt:not(:disabled):hover,body.pt .mb:hover{border-color:var(--hi,#8be9fd);background:rgba(255,255,255,.22)}
body.pt .opt.sel{background:color-mix(in srgb,var(--hi,#8be9fd) 25%,transparent);border-color:var(--hi,#8be9fd)}
body.pt .opt.good{background:rgba(34,197,94,.35);border-color:#4ade80}
body.pt .opt.dead{border-color:#ff6b70}
body.pt .mb.rec{background:rgba(34,197,94,.22);border-color:#4ade80}
body.pt .mb b{font-weight:700;font-size:1.15rem}
body.pt .btn.alt{color:#fff;border-color:rgba(255,255,255,.75)}
body.pt .btn{font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
body.pt .btn.alt{box-shadow:none}
body.pt .btn:not(:disabled):hover{filter:brightness(1.12)}
body.pt .dot.done{background:color-mix(in srgb,var(--hi,#8be9fd) 35%,transparent);border-color:var(--hi,#8be9fd)}
body.pt .dot.cur{outline-color:#ffe08a}
body.pt .bar div{box-shadow:0 0 12px color-mix(in srgb,var(--hi,#8be9fd) 70%,transparent)}
body.pt .help{background:rgba(250,204,21,.2);border-left-color:#fbbf24}
body.pt .help.ok{background:rgba(34,197,94,.28);border-left-color:#4ade80}
body.pt .rev{background:rgba(255,90,95,.18);border-left-color:#ff6b70}
body.pt .no{color:#ff9a9e}body.pt .yes{color:#6ee7a8}
body.pt .inp{background:rgba(255,255,255,.1);color:#fff}
body.pt .inp::placeholder{color:rgba(255,255,255,.55)}
body.pt .inp:focus{border-color:var(--hi,#8be9fd);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi,#8be9fd) 20%,transparent)}
body.pt .mode{color:#d8c9ff}
body.pt .ff{background:rgba(20,26,78,.78)}
body.pt .ff.bk{background:rgba(10,70,60,.75)}
body.pt .big{text-shadow:0 0 24px currentColor}
body.pt .stats{border-top-color:rgba(255,255,255,.28)}
#full{background:#101a4f}
@keyframes bgshift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes drop{from{opacity:0;transform:translateY(-70px) rotate(-14deg) scale(.5)}to{opacity:1;transform:none}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes up{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-75vh) rotate(28deg);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(139,233,253,.55),0 12px 32px rgba(0,0,0,.28)}50%{box-shadow:0 0 0 14px rgba(139,233,253,0),0 12px 32px rgba(0,0,0,.28)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
.portal{position:relative;min-height:64vh;display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;font-family:'Fredoka','Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif}
.ptitle{font-size:4.2rem;line-height:1.1;margin:0 0 6px;font-weight:700;letter-spacing:.03em;text-shadow:0 0 22px rgba(255,255,255,.5),0 5px 0 rgba(0,0,0,.22)}
.pl{display:inline-block;animation:drop .8s cubic-bezier(.2,1.5,.4,1) backwards,wave 2.6s ease-in-out infinite}
.psub{margin:0;font-size:1.05rem;color:rgba(255,255,255,.9);animation:up .7s .5s both}
.cback{position:absolute;top:0;left:0;z-index:2}
.fl{position:absolute;bottom:-24px;font-size:1.9rem;opacity:0;animation:rise 9s linear infinite;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));pointer-events:none}
.svc{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;margin-top:36px;text-align:left;font:inherit;color:#fff;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.45);border-radius:22px;padding:18px 22px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:glow 2.4s ease-in-out infinite,up .7s .7s both;transition:transform .15s,background .2s}
.svc:hover{background:rgba(255,255,255,.26)}
.svc:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.svc::after{content:'';position:absolute;top:0;left:0;width:34%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.6s ease-in-out infinite}
.svc .gl{flex:none;animation:bob 3s ease-in-out infinite}
.svc b{display:block;font-size:2rem;letter-spacing:.05em;line-height:1.1}
.svc .d{display:block;opacity:.9;font-size:.95rem}
.svc .ar{margin-left:auto;font-size:1.8rem;transition:transform .2s}
.svc:hover .ar{transform:translateX(7px)}
@media (max-width:520px){.ptitle{font-size:3.3rem}}
@media (max-width:520px){.sl{width:96px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.pt.dk{background:linear-gradient(-45deg,#04060c,#0a1028,#120820,#041a20,#04060c);background-size:400% 400%;animation:bgshift 16s ease infinite}

/* ===== Mejora visual ===== */
html{scroll-behavior:smooth}
::selection{background:var(--hi,#8be9fd);color:#06122e}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.wrap{max-width:780px;padding-bottom:90px}
body.pt header{border-radius:22px;padding:22px 26px;box-shadow:0 10px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.28)}
body.pt header h1{font-size:1.8rem;background:linear-gradient(90deg,#fff,#bff6ff 55%,#ffd6f0);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 10px color-mix(in srgb,var(--hi,#8be9fd) 35%,transparent))}

body.pt .opt:not(:disabled):hover{border-color:var(--hi,#8be9fd);background:color-mix(in srgb,var(--hi,#8be9fd) 16%,transparent);box-shadow:0 8px 22px rgba(0,0,0,.28),0 0 0 3px color-mix(in srgb,var(--hi,#8be9fd) 15%,transparent)}

/* ===== Transiciones y barra personalizada ===== */
html{scrollbar-width:thin;scrollbar-color:var(--hi,#8be9fd) rgba(255,255,255,.08)}
::-webkit-scrollbar{width:16px;height:16px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.07);border-radius:12px;margin:10px 0;box-shadow:inset 0 0 6px rgba(0,0,0,.35)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--hi,#8be9fd),var(--hi2,#a78bfa) 55%,#ff9ecb);border-radius:12px;border:4px solid transparent;background-clip:content-box;min-height:56px;transition:background .3s}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#bff6ff,#c4b5fd 55%,#ffc2e0);background-clip:content-box;border-width:3px}
::-webkit-scrollbar-thumb:active{background:linear-gradient(180deg,#4ade80,var(--hi,#8be9fd));background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
#sp{position:fixed;top:0;left:0;height:4px;width:0;z-index:2500;background:linear-gradient(90deg,#4ade80,var(--hi,#8be9fd),var(--hi2,#a78bfa),#ff9ecb);box-shadow:0 0 12px color-mix(in srgb,var(--hi,#8be9fd) 80%,transparent);transition:width .15s linear;pointer-events:none}
@keyframes drift{to{transform:translate(5%,-4%) scale(1.12)}}
@keyframes hdrin{from{opacity:0;transform:translateY(-22px) scale(.97)}to{opacity:1;transform:none}}

3px;font-weight:700}\nb.k{color:var(--c)}\n.tip,.warn{border-radius:8px;padding:10px 14px;margin:12px 0 2px;font-size:.93rem}\n.tip{background:rgba(22,163,106,.13);border-left:5px solid var(--green)}\n.warn{background:rgba(229,72,77,.12);border-left:5px solid var(--red)}\n.rec{display:grid;grid-template-columns:78px 1fr;gap:8px 12px;align-items:start}\n.badge{color:#fff;font-weight:800;text-align:center;border-radius:6px;padding:3px 0;font-size:.85rem}\n.tree{font-family:ui-monospace,Consolas,monospace;background:var(--code);padding:14px 18px;border-radius:8px;overflow-x:auto;white-space:pre;font-size:.9rem;line-height:1.5}\n.tree em{font-style:normal;color:var(--orange);font-weight:700}\n.tree strong{color:var(--green)}\n.steps{counter-reset:s;list-style:none;padding:0}\n.steps li{counter-increment:s;position:relative;padding-left:38px;margin:9px 0}\n.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;text-align:center;line-height:26px;font-size:.85rem}\n.sub{font-weight:700;margin:16px 0 4px;color:var(--c)}\n.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}\n.cols div{border-radius:8px;padding:10px 12px;border:2px solid var(--c2)}\n.cols b{color:var(--c2)}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header><h1>DNS: resumen para estudiar<\/h1><p>MP07 Servicios en red · CFGM SMX · UF1 · NF1.2<\/p><\/header>\n\n<div class=\"legend\">\n<span><mark>Amarillo<\/mark> = dato clave para el examen<\/span>\n<span><code>rosa<\/code> = comando, nombre o valor<\/span>\n<span>🟢 = truco para recordar<\/span>\n<span>🔴 = ojo, error típico<\/span>\n<\/div>\n\n<nav>\n<a href=\"#d2\" style=\"background:var(--blue)\">Qué es<\/a>\n<a href=\"#d4\" style=\"background:var(--green)\">Términos<\/a>\n<a href=\"#d5\" style=\"background:var(--orange)\">Registros<\/a>\n<a href=\"#d6\" style=\"background:var(--purple)\">Jerarquía<\/a>\n<a href=\"#d7\" style=\"background:var(--pink)\">Zonas<\/a>\n<a href=\"#d8\" style=\"background:var(--teal)\">AD DS<\/a>\n<\/nav>\n\n<section id=\"d2\" style=\"--c:var(--blue)\">\n<h2>Qué es el DNS <small>diapositivas 2 y 3<\/small><\/h2>\n<p>Sistema de nombres <mark>jerárquico<\/mark> sobre una base de datos <mark>distribuida<\/mark>. Funciona en internet y en redes privadas.<\/p>\n<p>Su trabajo: <mark>traducir nombres de dominio a direcciones IP<\/mark>.<\/p>\n<ul>\n<li>Protocolo normal: <mark>UDP<\/mark><\/li>\n<li>Puerto: <mark>53<\/mark><\/li>\n<li>A veces usa el mismo puerto con <mark>TCP<\/mark><\/li>\n<\/ul>\n<div class=\"tip\">🟢 Resumen: DNS = <b>53<\/b>, normalmente <b>UDP<\/b>, y traduce nombre → IP.<\/div>\n<\/section>\n\n<section id=\"d4\" style=\"--c:var(--green)\">\n<h2>Terminología básica <small>diapositiva 4<\/small><\/h2>\n<div class=\"cols\" style=\"--c2:var(--green)\">\n<div><b>Host name<\/b><br>Nombre de un equipo. <mark>Una sola palabra<\/mark> (letras, números, guiones).<br>Ej: <code>www<\/code>, <code>PC1<\/code><\/div>\n<div style=\"--c2:var(--blue)\"><b>FQDN<\/b><br>Nombre completo = <mark>host + punto + dominio<\/mark>.<br>Ej: <code>server1.sapalomera.cat.<\/code><\/div>\n<div style=\"--c2:var(--orange)\"><b>Domain name<\/b><br>Nombres unidos por puntos.<br>Ej: <code>www.google.com<\/code><\/div>\n<div style=\"--c2:var(--purple)\"><b>TLD<\/b><br>Dominios de <mark>nivel superior<\/mark>, no pertenecen a otro.<br>Ej: <code>com<\/code> <code>org<\/code> <code>cat<\/code><\/div>\n<\/div>\n<div class=\"tip\">🟢 FQDN = el nombre <b>entero<\/b>, el que acaba en punto.<\/div>\n<\/section>\n\n<section id=\"d5\" style=\"--c:var(--orange)\">\n<h2>Registros DNS <small>diapositiva 5<\/small><\/h2>\n<div class=\"rec\">\n<span class=\"badge\" style=\"background:var(--red)\">SOA<\/span><span>Servidor que mantiene la <mark>zona primaria<\/mark>. Solo indica el FQDN, <b>no la IP<\/b>.<\/span>\n<span class=\"badge\" style=\"background:var(--blue)\">NS<\/span><span><b>Name Server<\/b>: servidor(es) de nombres del dominio.<\/span>\n<span class=\"badge\" style=\"background:var(--green)\">A<\/span><span><b>Address<\/b>: nombre de host → <mark>IP<\/mark>.<\/span>\n<span class=\"badge\" style=\"background:var(--purple)\">CNAME<\/span><span><b>Alias<\/b> de un host.<\/span>\n<span class=\"badge\" style=\"background:var(--pink)\">MX<\/span><span><b>Mail Exchange<\/b>: servidor que recibe el <mark>correo<\/mark>.<\/span>\n<span class=\"badge\" style=\"background:var(--teal)\">PTR<\/span><span>Registro <mark>inverso<\/mark>: IP → nombre.<\/span>\n<span class=\"badge\" style=\"background:var(--orange)\">SRV<\/span><span><b>Service Locator<\/b>: los clientes encuentran <mark>servicios de red<\/mark>.<\/span>\n<\/div>\n<div class=\"warn\">🔴 No confundir: <b>A<\/b> = nombre → IP. <b>PTR<\/b> = IP → nombre.<\/div>\n<\/section>\n\n<section id=\"d6\" style=\"--c:var(--purple)\">\n<h2>Jerarquía DNS <small>diapositiva 6<\/small><\/h2>\n<div class=\"tree\"><em>.<\/em>  (raíz)\n├── <strong>com<\/strong>\n├── <strong>org<\/strong>      ← TLD\n│   ├── wikipedia   ← dominio\n│   │   ├── nds\n│   │   └── <em>es<\/em>    → es.wikipedia.org.\n│   └── fsf\n├── <strong>net<\/strong>\n└── <strong>onu<\/strong><\/div>\n<div class=\"tip\">🟢 Se lee de <b>derecha a izquierda<\/b>: raíz → TLD → dominio → subdominio.<\/div>\n<\/section>\n\n<section id=\"d7\" style=\"--c:var(--pink)\">\n<h2>Zonas DNS <small>diapositiva 7<\/small><\/h2>\n<div class=\"cols\" style=\"--c2:var(--pink)\">\n<div><b>Zona principal<\/b><br>El servidor es la <mark>fuente principal<\/mark> y guarda la <mark>copia maestra<\/mark>.<\/div>\n<div style=\"--c2:var(--blue)\"><b>Zona secundaria<\/b><br><mark>Copia<\/mark> de una zona principal que está en <mark>otro servidor<\/mark>.<\/div>\n<div style=\"--c2:var(--orange)\"><b>Zona de rutas internas<\/b> (stub)<br>Solo los registros para identificar los <mark>servidores DNS autoritativos<\/mark>.<\/div>\n<\/div>\n<\/section>\n\n<section id=\"d8\" style=\"--c:var(--teal)\">\n<h2>Integración con Active Directory <small>diapositiva 8<\/small><\/h2>\n<p>El DNS es <mark>imprescindible<\/mark> para AD DS:<\/p>\n<ul>\n<li>Los <b class=\"k\">clientes<\/b> buscan los <mark>controladores de dominio<\/mark> por DNS (así se autentican equipos y usuarios).<\/li>\n<li>Los controladores <b class=\"k\">se encuentran entre sí<\/b> por DNS (así hay <mark>replicación<\/mark>).<\/li>\n<li>También localizan al <mark>Catálogo Global<\/mark> mediante DNS.<\/li>\n<\/ul>\n<\/section>\n<\/div>\n<\/body>\n<\/html>\n";

it,minmax(230px,1fr));gap:10px;margin:10px 0}\n.cols>div{border-radius:10px;padding:11px 13px;border:2px solid var(--c2,rgba(255,255,255,.25));background:rgba(255,255,255,.06)}\n.cols b{color:#fff}\ntable{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem}\nth,td{border:1px solid rgba(255,255,255,.2);padding:8px 10px;text-align:left;vertical-align:top}\nth{background:rgba(255,255,255,.14);font-weight:700}\n.path{display:inline-block;background:rgba(139,233,253,.16);border:1px solid rgba(139,233,253,.35);padding:2px 8px;border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:.86rem;color:#c7f5ff}\n.okb{color:#4ade80;font-weight:800}.nob{color:#ff7b82;font-weight:800}\n@media (max-width:600px){table{font-size:.82rem}th,td{padding:6px}}\n\n.cmd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:0 0 8px}\n.cmd .d{margin:0 0 4px;font-size:.94rem;color:var(--ink)}\n.cmd .d b{color:#8be9fd}\n.cmd .m{margin:0 0 8px;font-size:.86rem;color:var(--muted)}\n.cmd.hidden{display:none}\n.cmd.gui{border-left:5px solid var(--c)}\n.cmd.gui .steps2{margin:2px 0 0;font-size:.9rem;line-height:1.7}\n.cmd.gui .steps2 span.p{display:inline-block;background:rgba(139,233,253,.16);border:1px solid rgba(139,233,253,.35);padding:1px 8px;border-radius:6px;margin:1px 2px;font-size:.85rem}\n.cw{position:relative}\n.cw pre{margin:0;padding:11px 78px 11px 13px;background:#0b1224;color:#e8f6ff;border:1px solid rgba(255,255,255,.18)}\n.cw .cp{top:7px;right:7px}\n.cmd.note{border-left:5px solid #f28c18}\n.ph{background:#fff3a3;color:#1b2333;font-weight:700;border-radius:4px;padding:0 4px}\n.cmd .ch{margin:0 0 8px;font-size:.85rem;color:var(--ink);line-height:1.9}\n.sec-sub{margin:16px 0 6px;font-weight:700;color:#8be9fd;font-size:.95rem}\nsection{background:var(--card)}\n\n</style>\n\n<style id=\"ad-clean-redesign\">\n:root{color-scheme:light;--bg:#f3f6fb;--card:#fff;--ink:#182338;--muted:#59677d;--line:#d9e1ed;--blue:#245fca;--green:#16835d;--orange:#b96a08;--purple:#7050bd;--pink:#b43d79;--teal:#087f91;--red:#c83f48;--yellow:#fff1b8}\nhtml,body{background:var(--bg)!important;color:var(--ink)!important;font:15px/1.58 system-ui,-apple-system,\"Segoe UI\",sans-serif!important}\n.wrap{max-width:1160px!important;margin:auto!important;padding:20px clamp(12px,2.5vw,28px) 80px!important}\nheader{background:linear-gradient(115deg,#214f9f,#386fc1)!important;border-radius:14px!important;padding:22px 24px!important;box-shadow:0 5px 18px #18345b20}\nheader h1{font-size:clamp(1.35rem,3vw,1.8rem)!important;line-height:1.25!important}\n.search-box{position:sticky;top:0;z-index:30;background:#f3f6fbf2!important;padding:10px!important;border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:0 3px 12px #1a315018!important;gap:8px!important}\n.search-box input{min-width:0!important;background:#fff!important;color:var(--ink)!important;border:1px solid #bdcadd!important;border-radius:9px!important;box-shadow:none!important;padding:12px 14px!important}\n.search-box input::placeholder{color:#758198!important}\n.search-box button{background:#e9eef7!important;color:#24344e!important;border:1px solid #cbd5e3!important;border-radius:9px!important}\n.search-stat{color:#43536c!important;margin:0 0 8px!important}\n.legend{color:#53627a!important;gap:8px 16px!important}\nnav{top:68px!important;background:#f3f6fbf5!important;border:1px solid var(--line)!important;border-radius:12px!important;padding:9px!important;gap:8px!important;box-shadow:0 3px 12px #1a315010!important;overflow-x:auto!important}\nnav a{flex:0 0 auto!important;border-radius:8px!important;padding:8px 12px!important;font-size:.82rem!important;box-shadow:none!important}\nsection{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-top:4px solid var(--c)!important;border-radius:13px!important;padding:clamp(14px,2vw,22px)!important;margin:0 0 16px!important;box-shadow:0 3px 14px #1c35500c!important}\nsection h2{color:#203451!important;font-size:clamp(1.12rem,2vw,1.35rem)!important;line-height:1.3!important}\nh3,.sec-sub{color:#28558f!important}\n.cmd{background:#fbfcfe!important;border:1px solid #e0e6ef!important;border-radius:10px!important;padding:12px 14px!important;margin:0 0 10px!important}\n.cmd .d{color:#24344d!important;line-height:1.45!important}\n.cmd .d b{color:#1e3d69!important}\n.cmd .m{color:#52627a!important;line-height:1.5!important}\n.cw pre,pre{background:#17243a!important;color:#edf4ff!important;border:1px solid #263a58!important;border-radius:9px!important;padding:13px 86px 13px 14px!important;font-size:.87rem!important;line-height:1.55!important;white-space:pre-wrap!important;overflow-wrap:anywhere!important}\n.cp{background:#e8eef8!important;color:#24436d!important;border:1px solid #c4d2e5!important;border-radius:7px!important}\n.info{background:#eaf2ff!important;color:#23436f!important;border-left:4px solid #3978d5!important}\n.tip{background:#e8f6ef!important;color:#205b43!important;border-left:4px solid #16835d!important}\n.warn{background:#fff1f0!important;color:#8b2f36!important;border-left:4px solid #c83f48!important}\n.ph,mark{background:#fff1b8!important;color:#493900!important;border-radius:4px!important}\n.path{background:#eaf2ff!important;color:#23436f!important;border-color:#c7d8f2!important}\ntable{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}th,td{border:1px solid var(--line)!important;padding:8px 10px!important}th{background:#edf2f9!important;color:#233b5c!important}\n@media(max-width:600px){.wrap{padding:10px 10px 70px!important}header{padding:16px!important}nav{top:60px!important}section{padding:13px!important}.search-box input{padding:10px 12px!important}}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<header>\n<h1>Active Directory · Guía de comandos y prácticas</h1>\n<p>SOX (M0224) · Temas 2.1 a 2.6 · Busca una palabra o salta directamente al tema que necesitas</p>\n</header>\n<section id=\"esquema\" style=\"--c:var(--red)\">\n<h2>Esquema rápido de Active Directory</h2>\n<p>Ejemplo visual de cómo se organizan los objetos dentro del dominio.</p>\n<div class=\"tree\" style=\"padding:12px;overflow-x:auto;background:var(--soft);border:1px solid var(--line);border-radius:12px\">\n<svg aria-label=\"Árbol de Active Directory: dominio ejemplo.local, OU Usuarios, OU Alumnos, usuario alumno1 y grupo GrupoAlumnos\" role=\"img\" style=\"display:block;width:100%;min-width:560px;height:auto;font-family:Arial,sans-serif\" viewbox=\"0 0 760 330\">\n<defs><marker id=\"adArrow\" markerheight=\"8\" markerwidth=\"8\" orient=\"auto\" refx=\"6\" refy=\"3\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"#8292aa\" stroke-width=\"1.2\"></path></marker></defs>\n<g fill=\"none\" marker-end=\"url(#adArrow)\" stroke=\"#8292aa\" stroke-width=\"2\"><path d=\"M380 68 V100\"></path><path d=\"M380 150 V181\"></path><path d=\"M380 231 V252 H190 V270\"></path><path d=\"M380 252 H570 V270\"></path></g>\n<rect fill=\"#244b86\" height=\"53\" rx=\"12\" width=\"270\" x=\"245\" y=\"15\"></rect><text fill=\"#fff\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" x=\"380\" y=\"38\">Dominio</text><text fill=\"#e5efff\" font-size=\"13\" text-anchor=\"middle\" x=\"380\" y=\"56\">ejemplo.local</text>\n<rect fill=\"#176b68\" height=\"50\" rx=\"10\" width=\"270\" x=\"245\" y=\"100\"></rect><text fill=\"#fff\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" x=\"380\" y=\"121\">OU=Usuarios</text><text fill=\"#e1fffa\" font-size=\"12\" text-anchor=\"middle\" x=\"380\" y=\"139\">Unidad organizativa</text>\n<rect fill=\"#176b68\" height=\"50\" rx=\"10\" width=\"270\" x=\"245\" y=\"181\"></rect><text fill=\"#fff\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" x=\"380\" y=\"202\">OU=Alumnos</text><text fill=\"#e1fffa\" font-size=\"12\" text-anchor=\"middle\" x=\"380\" y=\"220\">Sub-OU</text>\n<rect fill=\"#6b4aa1\" height=\"48\" rx=\"10\" width=\"250\" x=\"65\" y=\"270\"></rect><text fill=\"#fff\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" x=\"190\" y=\"290\">CN=alumno1</text><text fill=\"#f2eaff\" font-size=\"12\" text-anchor=\"middle\" x=\"190\" y=\"307\">Usuario</text>\n<rect fill=\"#9a5a24\" height=\"48\" rx=\"10\" width=\"250\" x=\"445\" y=\"270\"></rect><text fill=\"#fff\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" x=\"570\" y=\"290\">CN=GrupoAlumnos</text><text fill=\"#fff0df\" font-size=\"12\" text-anchor=\"middle\" x=\"570\" y=\"307\">Grupo</text>\n</svg>\n</div>\n<div class=\"info\" style=\"margin-top:10px\"><b>DN del usuario:</b><br/><code>CN=alumno1,OU=Alumnos,OU=Usuarios,DC=ejemplo,DC=local</code></div>\n<p style=\"margin:10px 0 5px\"><b>Qué significa cada parte</b></p>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n<span class=\"ph\">DC = dominio</span><span class=\"ph\">OU = carpeta organizativa</span><span class=\"ph\">CN = objeto</span><span class=\"ph\">DN = ruta completa</span><span class=\"ph\">GPO = directiva</span>\n</div>\n<div class=\"tip\" style=\"margin-top:10px\"><b>Truco:</b> el DN se escribe desde el objeto hacia fuera: <code>CN</code> → <code>OU</code> → <code>DC</code>.</div>\n</section>\n<div class=\"search-box\">\n<input autocomplete=\"off\" id=\"q\" placeholder=\"🔎 Buscar (ej: Move-ADObject, gpupdate, perfil, bloqueo, contraseña…)\" type=\"search\"/>\n<button id=\"clr\" title=\"Limpiar búsqueda\" type=\"button\">✕</button>\n</div>\n<div class=\"search-stat\" id=\"st\"></div>\n<div class=\"info\" style=\"margin:8px 0 12px\"><b>Como referencia:</b> usa el buscador para escribir lo que pide el enunciado (por ejemplo, «crear usuario», «promocionar dominio» o «GPO»). También puedes tocar un tema de la barra para ir directamente a esa parte.</div>\n<div class=\"legend\">\n<span><span class=\"ph\">&lt;AQUÍ-…&gt;</span> = pon tu valor correspondiente y borra también los &lt; &gt;</span>\n<span>Botón <b>Copiar</b> = copia el comando</span>\n<span>Barra de color = ruta gráfica (Windows en castellano)</span>\n<span>Barra naranja = práctica adicional / aviso</span>\n</div>\n<nav><a href=\"#esquema\" style=\"background:var(--red)\">OU, DN y conceptos</a><a href=\"#posibles\" style=\"background:var(--orange)\">Prácticas adicionales</a><a href=\"#ex\" style=\"background:var(--red)\">Comandos habituales</a><a href=\"#t21\" style=\"background:var(--blue)\">2.1 Dominios y DN</a><a href=\"#t22\" style=\"background:var(--teal)\">2.2 Instalar AD y unir equipos</a><a href=\"#t23\" style=\"background:var(--green)\">2.3 ADUC (gráfico)</a><a href=\"#t24\" style=\"background:var(--orange)\">2.4 PowerShell de AD</a><a href=\"#t25\" style=\"background:var(--purple)\">2.5 Perfiles y carpetas</a><a href=\"#t26\" style=\"background:var(--pink)\">2.6 GPO</a></nav>\n<section id=\"comandos\" style=\"--c:var(--red)\">\n<h2>Comandos habituales de Active Directory</h2>\n<div class=\"sec-sub\">Plantillas generales · sustituye los valores entre &lt; &gt; por los datos de tu entorno.</div>\n<div class=\"cmd\"><p class=\"d\"><b>Importar el módulo de despliegue de Active Directory.</b></p><p class=\"m\">En fácil: Permite instalar y configurar Active Directory.</p><div class=\"cw\"><pre>Import-Module ADDSDeployment</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Crear un dominio nuevo y promocionar el servidor como primer controlador.</b></p><p class=\"m\">En fácil: Crea un dominio nuevo.</p><div class=\"cw\"><pre>Install-ADDSForest -DomainName \"&lt;dominio.local&gt;\" -InstallDns:$true -CreateDnsDelegation:$false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Importar el módulo de Active Directory.</b></p><p class=\"m\">En fácil: Activa los comandos de administración de Active Directory.</p><div class=\"cw\"><pre>Import-Module ActiveDirectory</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Crear una unidad organizativa (OU).</b></p><p class=\"m\">En fácil: Crea una unidad organizativa (OU).</p><div class=\"cw\"><pre>New-ADOrganizationalUnit -Name \"&lt;Nombre-OU&gt;\" -Path \"&lt;DN-del-dominio-o-OU-padre&gt;\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Crear un usuario.</b></p><p class=\"m\">En fácil: Crea un usuario en la OU indicada.</p><div class=\"cw\"><pre>$pass = ConvertTo-SecureString \"&lt;Contraseña-de-ejemplo&gt;\" -AsPlainText -Force\nNew-ADUser -Name \"&lt;Nombre completo&gt;\" -SamAccountName \"&lt;usuario&gt;\" -UserPrincipalName \"&lt;usuario@dominio.local&gt;\" -Path \"&lt;DN-de-la-OU&gt;\" -AccountPassword $pass -Enabled $true</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Crear un grupo global de seguridad.</b></p><p class=\"m\">En fácil: Crea un grupo.</p><div class=\"cw\"><pre>New-ADGroup -Name \"&lt;Nombre-grupo&gt;\" -GroupScope Global -GroupCategory Security -Path \"&lt;DN-de-la-OU&gt;\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Añadir usuarios a un grupo.</b></p><p class=\"m\">En fácil: Añade usuarios al grupo.</p><div class=\"cw\"><pre>Add-ADGroupMember -Identity \"&lt;Nombre-grupo&gt;\" -Members \"&lt;usuario1&gt;\",\"&lt;usuario2&gt;\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Consultar los miembros de un grupo.</b></p><p class=\"m\">En fácil: Muestra los miembros del grupo.</p><div class=\"cw\"><pre>Get-ADGroupMember -Identity \"&lt;Nombre-grupo&gt;\" | Select-Object Name, SamAccountName</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Cambiar la descripción de todos los grupos del dominio.</b></p><p class=\"m\">En fácil: Cambia la descripción de los grupos.</p><div class=\"cw\"><pre>Get-ADGroup -Filter * | Set-ADGroup -Description \"&lt;Descripción&gt;\"\nGet-ADGroup -Filter * -Properties Description | Select-Object Name, Description</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Configurar perfil móvil y carpeta personal de un usuario.</b></p><p class=\"m\">En fácil: Configura el perfil móvil y la carpeta personal del usuario.</p><div class=\"cw\"><pre>Set-ADUser -Identity \"&lt;usuario&gt;\" -ProfilePath \"\\\\&lt;servidor&gt;\\&lt;recurso-perfiles&gt;\\%username%\"\nSet-ADUser -Identity \"&lt;usuario&gt;\" -HomeDirectory \"\\\\&lt;servidor&gt;\\&lt;recurso-personal&gt;\\%username%\" -HomeDrive \"P:\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Actualizar y consultar las directivas de grupo en el cliente.</b></p><p class=\"m\">En fácil: Actualiza las directivas y muestra cuáles se han aplicado.</p><div class=\"cw\"><pre>gpupdate /force\ngpresult /r</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd note\"><p class=\"d\"><b>Nota:</b> los nombres entre &lt; &gt; son marcadores de posición. Sustitúyelos por los nombres, rutas y valores que correspondan en cada instalación.</p></div>\n</section>\n<section id=\"t21\" style=\"--c:var(--blue)\"><h2>2.1 Dominios y DN</h2><div class=\"sec-sub\">Formato del Distinguished Name (DN)</div><div class=\"cmd\"><p class=\"d\"><b>DN de un usuario.</b> Identifica un objeto de abajo hacia arriba: objeto → UOs → dominio.</p><p class=\"m\">En fácil: Es la dirección completa del objeto dentro de Active Directory.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>) · <span class=\"ph\">&lt;AQUÍ-SUBUO&gt;</span> = nombre de la sub-UO (ej. <code>Alumnat</code>) · <span class=\"ph\">&lt;AQUÍ-UO&gt;</span> = nombre de la UO (ej. <code>Usuaris</code>) · <span class=\"ph\">&lt;AQUÍ-DOMINIO-SIN-EXTENSIÓN&gt;</span> = el dominio sin la extensión (ej. <code>dominio</code>) · <span class=\"ph\">&lt;AQUÍ-EXTENSIÓN&gt;</span> = la extensión del dominio (ej. <code>local</code>)</p><div class=\"cw\"><pre>cn=<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>,ou=<span class=\"ph\">&lt;AQUÍ-SUBUO&gt;</span>,ou=<span class=\"ph\">&lt;AQUÍ-UO&gt;</span>,dc=<span class=\"ph\">&lt;AQUÍ-DOMINIO-SIN-EXTENSIÓN&gt;</span>,dc=<span class=\"ph\">&lt;AQUÍ-EXTENSIÓN&gt;</span></pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>DN de una UO.</b> Igual pero sin <code>cn</code>: empieza por la UO.</p><p class=\"m\">En fácil: Indica dónde crear un objeto o qué objeto modificar.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-SUBUO&gt;</span> = nombre de la sub-UO (ej. <code>Alumnat</code>) · <span class=\"ph\">&lt;AQUÍ-UO&gt;</span> = nombre de la UO (ej. <code>Usuaris</code>) · <span class=\"ph\">&lt;AQUÍ-DOMINIO-SIN-EXTENSIÓN&gt;</span> = el dominio sin la extensión (ej. <code>dominio</code>) · <span class=\"ph\">&lt;AQUÍ-EXTENSIÓN&gt;</span> = la extensión del dominio (ej. <code>local</code>)</p><div class=\"cw\"><pre>ou=<span class=\"ph\">&lt;AQUÍ-SUBUO&gt;</span>,ou=<span class=\"ph\">&lt;AQUÍ-UO&gt;</span>,dc=<span class=\"ph\">&lt;AQUÍ-DOMINIO-SIN-EXTENSIÓN&gt;</span>,dc=<span class=\"ph\">&lt;AQUÍ-EXTENSIÓN&gt;</span></pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Consultar el dominio</div><div class=\"cmd\"><p class=\"d\"><b>Ver datos del dominio</b> (nombre, NetBIOS, DN…).</p><p class=\"m\">En fácil: Muestra el nombre del dominio y su DN.</p><div class=\"cw\"><pre>Get-ADDomain</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver el controlador de dominio.</b></p><p class=\"m\">En fácil: Muestra información del controlador de dominio al que estás conectado.</p><div class=\"cw\"><pre>Get-ADDomainController</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div></section><section id=\"t22\" style=\"--c:var(--teal)\"><h2>2.2 Instalar AD y unir equipos</h2><div class=\"sec-sub\">Preparar el servidor</div><div class=\"cmd\"><p class=\"d\"><b>Cambiar el nombre del servidor</b> y reiniciar. Hazlo ANTES de promocionar: después no se puede cambiar.</p><p class=\"m\">En fácil: Cambia el nombre del equipo y lo reinicia.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span> = nombre (hostname) del servidor (ej. <code>SRV-AD</code>)</p><div class=\"cw\"><pre>Rename-Computer -NewName \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span>\" -Restart</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver el nombre de las tarjetas de red.</b></p><p class=\"m\">En fácil: Muestra el nombre de la tarjeta de red.</p><div class=\"cw\"><pre>Get-NetAdapter</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Poner IP fija</b> al servidor (un DC nunca usa DHCP).</p><p class=\"m\">En fácil: Configura la dirección IP del equipo.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-TARJETA&gt;</span> = nombre de la tarjeta de red (míralo con Get-NetAdapter) (ej. <code>Ethernet</code>) · <span class=\"ph\">&lt;AQUÍ-IP-DEL-SERVIDOR&gt;</span> = IP del controlador de dominio (ej. <code>192.168.10.10</code>)</p><div class=\"cw\"><pre>New-NetIPAddress -InterfaceAlias \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-TARJETA&gt;</span>\" -IPAddress \"<span class=\"ph\">&lt;AQUÍ-IP-DEL-SERVIDOR&gt;</span>\" -PrefixLength 24</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Poner el DNS preferido.</b> En el cliente debe ser la IP del DC.</p><p class=\"m\">En fácil: Configura el servidor DNS que utilizará el equipo.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-TARJETA&gt;</span> = nombre de la tarjeta de red (míralo con Get-NetAdapter) (ej. <code>Ethernet</code>) · <span class=\"ph\">&lt;AQUÍ-IP-DEL-SERVIDOR&gt;</span> = IP del controlador de dominio (ej. <code>192.168.10.10</code>)</p><div class=\"cw\"><pre>Set-DnsClientServerAddress -InterfaceAlias \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-TARJETA&gt;</span>\" -ServerAddresses \"<span class=\"ph\">&lt;AQUÍ-IP-DEL-SERVIDOR&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver la configuración de red</b> (IP, DNS, máscara).</p><p class=\"m\">En fácil: Comprueba la configuración de red.</p><div class=\"cw\"><pre>ipconfig /all</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Instalar y promocionar</div><div class=\"cmd\"><p class=\"d\"><b>Instalar el rol AD DS</b> con sus herramientas.</p><p class=\"m\">En fácil: Instala el servicio de Active Directory y sus herramientas.</p><div class=\"cw\"><pre>Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Promocionar el servidor a DC</b> creando un bosque nuevo. Pide la contraseña DSRM.</p><p class=\"m\">En fácil: Prepara la instalación del nuevo dominio.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span> = el dominio (ej. <code>dominio.local</code>)</p><div class=\"cw\"><pre>Import-Module ADDSDeployment\nInstall-ADDSForest -DomainName \"<span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span>\" -CreateDnsDelegation:$false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Promocionar indicando también el NetBIOS y el DNS.</b></p><p class=\"m\">En fácil: Instala el DNS y crea el dominio con el nombre NetBIOS indicado.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span> = el dominio (ej. <code>dominio.local</code>) · <span class=\"ph\">&lt;AQUÍ-TU-NETBIOS&gt;</span> = nombre NetBIOS (primera parte del dominio, en mayúsculas) (ej. <code>DOMINIO</code>)</p><div class=\"cw\"><pre>Install-ADDSForest -DomainName \"<span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span>\" -DomainNetbiosName \"<span class=\"ph\">&lt;AQUÍ-TU-NETBIOS&gt;</span>\" -InstallDns:$true -CreateDnsDelegation:$false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Degradar el último DC</b> del dominio.</p><p class=\"m\">En fácil: Quita Active Directory del servidor y elimina el dominio si es el último controlador.</p><div class=\"cw\"><pre>Uninstall-ADDSDomainController -LastDomainControllerInDomain:$true</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Unir el cliente al dominio</div><div class=\"cmd\"><p class=\"d\"><b>Comprobar conexión con el DC</b> (antes de unir el cliente).</p><p class=\"m\">En fácil: Comprueba que el servidor responde por IP y por nombre.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-IP-DEL-SERVIDOR&gt;</span> = IP del controlador de dominio (ej. <code>192.168.10.10</code>) · <span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span> = nombre (hostname) del servidor (ej. <code>SRV-AD</code>) · <span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span> = el dominio (ej. <code>dominio.local</code>)</p><div class=\"cw\"><pre>ping <span class=\"ph\">&lt;AQUÍ-IP-DEL-SERVIDOR&gt;</span>\nping <span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span>\nnslookup <span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span></pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Unir el equipo al dominio</b> y reiniciar.</p><p class=\"m\">En fácil: Une el equipo al dominio.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span> = el dominio (ej. <code>dominio.local</code>) · <span class=\"ph\">&lt;AQUÍ-TU-NETBIOS&gt;</span> = nombre NetBIOS (primera parte del dominio, en mayúsculas) (ej. <code>DOMINIO</code>)</p><div class=\"cw\"><pre>Add-Computer -DomainName \"<span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span>\" -Credential \"<span class=\"ph\">&lt;AQUÍ-TU-NETBIOS&gt;</span>\\Administrador\" -Restart</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Sacar el equipo del dominio</b> (volver a grupo de trabajo).</p><p class=\"m\">En fácil: Saca el equipo del dominio y lo devuelve a un grupo de trabajo.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-GRUPO-DE-TRABAJO&gt;</span> = nombre del grupo de trabajo (ej. <code>WORKGROUP</code>) · <span class=\"ph\">&lt;AQUÍ-TU-NETBIOS&gt;</span> = nombre NetBIOS (primera parte del dominio, en mayúsculas) (ej. <code>DOMINIO</code>)</p><div class=\"cw\"><pre>Remove-Computer -WorkgroupName \"<span class=\"ph\">&lt;AQUÍ-GRUPO-DE-TRABAJO&gt;</span>\" -UnjoinDomainCredential \"<span class=\"ph\">&lt;AQUÍ-TU-NETBIOS&gt;</span>\\Administrador\" -Restart</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Iniciar sesión con usuario del dominio</b> (cualquiera de las tres formas).</p><p class=\"m\">En fácil: Inicia sesión con una cuenta del dominio.</p><div class=\"cw\"><pre>usuari\nNETBIOS\\usuari\nusuari@domini.local</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Iniciar sesión con usuario local</b> en un equipo que está en el dominio.</p><p class=\"m\">En fácil: Inicia sesión con una cuenta local del equipo.</p><div class=\"cw\"><pre>.\\usuari\nhostname\\usuari</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver quién eres y de qué grupos.</b></p><p class=\"m\">En fácil: Muestra el usuario y los grupos de la sesión actual.</p><div class=\"cw\"><pre>whoami\nwhoami /groups</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Rutas gráficas (Windows en castellano)</div><div class=\"cmd gui\"><p class=\"d\"><b>Instalar el rol AD DS.</b></p><div class=\"steps2\"><span class=\"p\">Administrador del servidor</span> → <span class=\"p\">Administrar</span> → <span class=\"p\">Agregar roles y características</span> → marcar <span class=\"p\">Servicios de dominio de Active Directory</span> → <span class=\"p\">Agregar características</span> → <span class=\"p\">Instalar</span></div></div><div class=\"cmd gui\"><p class=\"d\"><b>Promocionar a controlador de dominio.</b></p><div class=\"steps2\"><span class=\"p\">Administrador del servidor</span> → <span class=\"p\">AD DS</span> → <span class=\"p\">Más…</span> → <span class=\"p\">Promover este servidor a controlador de dominio</span> → <span class=\"p\">Agregar un nuevo bosque</span> + <span class=\"p\">Nombre de dominio raíz</span> → poner contraseña DSRM → Siguiente hasta <span class=\"p\">Instalar</span> (se reinicia solo)</div></div><div class=\"cmd gui\"><p class=\"d\"><b>Poner el DNS preferido en el cliente.</b></p><div class=\"steps2\"><span class=\"p\">Panel de control</span> → <span class=\"p\">Centro de redes y recursos compartidos</span> → <span class=\"p\">Cambiar configuración del adaptador</span> → clic derecho en la tarjeta → <span class=\"p\">Propiedades</span> → <span class=\"p\">Protocolo de Internet versión 4 (TCP/IPv4)</span> → <span class=\"p\">Usar las siguientes direcciones de servidor DNS</span> → <span class=\"p\">Servidor DNS preferido</span> = IP del DC</div></div><div class=\"cmd gui\"><p class=\"d\"><b>Unir un Windows 10 al dominio.</b></p><div class=\"steps2\"><span class=\"p\">Configuración</span> → <span class=\"p\">Sistema</span> → <span class=\"p\">Acerca de</span> → <span class=\"p\">Configuración avanzada del sistema</span> → pestaña <span class=\"p\">Nombre de equipo</span> → <span class=\"p\">Cambiar…</span> → marcar <span class=\"p\">Dominio</span> → escribir el dominio → credenciales del administrador del dominio → reiniciar</div></div><div class=\"cmd gui\"><p class=\"d\"><b>Degradar el DC (gráfico).</b></p><div class=\"steps2\"><span class=\"p\">Administrador del servidor</span> → <span class=\"p\">Administrar</span> → <span class=\"p\">Quitar roles y características</span> → desmarcar AD DS → <span class=\"p\">Degradar este controlador de dominio</span> → marcar <span class=\"p\">Último controlador de dominio del dominio</span></div></div></section><section id=\"t23\" style=\"--c:var(--green)\"><h2>2.3 ADUC (gráfico)</h2><div class=\"sec-sub\">Herramientas</div><div class=\"cmd\"><p class=\"d\"><b>Abrir Usuarios y equipos de Active Directory (ADUC).</b></p><p class=\"m\">En fácil: Abre la consola gráfica de usuarios y equipos de Active Directory.</p><div class=\"cw\"><pre>dsa.msc</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Abrir Administración de directivas de grupo.</b></p><p class=\"m\">En fácil: Abre la consola para administrar las directivas de grupo (GPO).</p><div class=\"cw\"><pre>gpmc.msc</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Listar todas las UOs</b> con su DN.</p><p class=\"m\">En fácil: Muestra el DN de una OU.</p><div class=\"cw\"><pre>Get-ADOrganizationalUnit -Filter * | Select-Object Name, DistinguishedName</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Rutas gráficas (Windows en castellano)</div><div class=\"cmd gui\"><p class=\"d\"><b>Abrir ADUC.</b></p><div class=\"steps2\"><span class=\"p\">Administrador del servidor</span> → <span class=\"p\">Herramientas</span> → <span class=\"p\">Usuarios y equipos de Active Directory</span></div></div><div class=\"cmd gui\"><p class=\"d\"><b>Crear UO, usuario o grupo.</b> Hazlo siempre dentro de tu UO (ORG), no en Users ni Computers.</p><div class=\"steps2\">Clic derecho en espacio vacío de la UO → <span class=\"p\">Nuevo</span> → <span class=\"p\">Unidad organizativa</span> / <span class=\"p\">Usuario</span> / <span class=\"p\">Grupo</span>. En grupo: <span class=\"p\">Ámbito: Global</span> + <span class=\"p\">Tipo: Seguridad</span></div></div><div class=\"cmd gui\"><p class=\"d\"><b>Quitar la protección de una UO</b> para poder moverla o borrarla.</p><div class=\"steps2\">Menú <span class=\"p\">Ver</span> → <span class=\"p\">Características avanzadas</span> → clic derecho en la UO → <span class=\"p\">Propiedades</span> → pestaña <span class=\"p\">Objeto</span> → desmarcar <span class=\"p\">Proteger objeto contra eliminación accidental</span></div></div><div class=\"cmd gui\"><p class=\"d\"><b>Desbloquear cuenta, horario y equipos permitidos.</b></p><div class=\"steps2\">Usuario → <span class=\"p\">Propiedades</span> → pestaña <span class=\"p\">Cuenta</span> → <span class=\"p\">Desbloquear cuenta</span> / <span class=\"p\">Horas de inicio de sesión…</span> / <span class=\"p\">Iniciar sesión en…</span></div></div><div class=\"cmd gui\"><p class=\"d\"><b>Horario de inicio de sesión.</b></p><div class=\"steps2\"><span class=\"p\">Cuenta</span> → <span class=\"p\">Horas de inicio de sesión…</span> → seleccionar toda la cuadrícula → <span class=\"p\">Inicio de sesión denegado</span> → seleccionar solo la franja permitida → <span class=\"p\">Inicio de sesión permitido</span></div></div><div class=\"cmd gui\"><p class=\"d\"><b>Meter un usuario en grupos.</b></p><div class=\"steps2\">Usuario → <span class=\"p\">Propiedades</span> → pestaña <span class=\"p\">Miembro de</span> → <span class=\"p\">Agregar…</span> → nombre del grupo → <span class=\"p\">Comprobar nombres</span> → Aceptar</div></div><div class=\"cmd gui\"><p class=\"d\"><b>Meter miembros en un grupo.</b></p><div class=\"steps2\">Grupo → <span class=\"p\">Propiedades</span> → pestaña <span class=\"p\">Miembros</span> → <span class=\"p\">Agregar…</span>. (La pestaña <span class=\"p\">Miembro de</span> del grupo sirve para meter ese grupo dentro de otros.)</div></div><div class=\"cmd gui\"><p class=\"d\"><b>Mover un equipo/usuario a otra UO.</b> Los equipos unidos aparecen en <span class=\"p\">Computers</span>.</p><div class=\"steps2\">Clic derecho en el objeto → <span class=\"p\">Mover…</span> → elegir la UO</div></div></section><section id=\"t24\" style=\"--c:var(--orange)\"><h2>2.4 PowerShell de AD</h2><div class=\"sec-sub\">Unidades Organizativas (UO)</div><div class=\"cmd\"><p class=\"d\"><b>Crear una UO.</b></p><p class=\"m\">En fácil: Crea una OU y evita que se borre por accidente.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-UO&gt;</span> = nombre de la UO (ej. <code>Alumnat</code>) · <span class=\"ph\">&lt;AQUÍ-DN-DONDE-SE-CREA&gt;</span> = DN de la UO o dominio donde se crea (ej. <code>ou=ORG,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>New-ADOrganizationalUnit -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-UO&gt;</span>\" -Path \"<span class=\"ph\">&lt;AQUÍ-DN-DONDE-SE-CREA&gt;</span>\" -ProtectedFromAccidentalDeletion $true</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Modificar una UO</b> (ejemplo: quitar la protección para poder moverla o borrarla).</p><p class=\"m\">En fácil: Cambia las propiedades de una OU.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span> = DN completo del objeto (UO, usuario, grupo…) (ej. <code>cn=a.puig,ou=Alumnat,dc=dominio,dc=local</code>) · <span class=\"ph\">&lt;AQUÍ-DESCRIPCIÓN&gt;</span> = texto libre (ej. <code>Alumna de primero</code>)</p><div class=\"cw\"><pre>Set-ADOrganizationalUnit -Identity \"<span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span>\" -Description \"<span class=\"ph\">&lt;AQUÍ-DESCRIPCIÓN&gt;</span>\" -ProtectedFromAccidentalDeletion $false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Mover una UO</b> (vale para cualquier objeto: UO, usuario, grupo, equipo).</p><p class=\"m\">En fácil: Mueve un objeto a otra OU.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span> = DN completo del objeto (UO, usuario, grupo…) (ej. <code>cn=a.puig,ou=Alumnat,dc=dominio,dc=local</code>) · <span class=\"ph\">&lt;AQUÍ-DN-DESTINO&gt;</span> = DN de la UO a la que lo mueves (ej. <code>ou=Professorat,ou=ORG,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>Move-ADObject -Identity \"<span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span>\" -TargetPath \"<span class=\"ph\">&lt;AQUÍ-DN-DESTINO&gt;</span>\" -Confirm:$false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Borrar una UO.</b> Antes quítale la protección. No uses -Recursive: borra todo lo de dentro.</p><p class=\"m\">En fácil: Borra una OU (si no está protegida).</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span> = DN completo del objeto (UO, usuario, grupo…) (ej. <code>cn=a.puig,ou=Alumnat,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>Remove-ADOrganizationalUnit -Identity \"<span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span>\" -Confirm:$false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Buscar una UO</b> concreta.</p><p class=\"m\">En fácil: Muestra una OU concreta.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span> = DN completo del objeto (UO, usuario, grupo…) (ej. <code>cn=a.puig,ou=Alumnat,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>Get-ADOrganizationalUnit -Identity \"<span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Buscar UOs con filtro</b> (ejemplo: las protegidas).</p><p class=\"m\">En fácil: Busca objetos que cumplan una condición y muestra sus propiedades.</p><div class=\"cw\"><pre>Get-ADOrganizationalUnit -Filter {ProtectedFromAccidentalDeletion -eq $true} -Properties *</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Usuarios</div><div class=\"cmd\"><p class=\"d\"><b>Crear usuario</b> pidiendo la contraseña por teclado.</p><p class=\"m\">En fácil: Crea una cuenta de usuario y la deja activa.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-COMPLETO&gt;</span> = nombre completo del usuario (ej. <code>Anna Puig</code>) · <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>) · <span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span> = el dominio (ej. <code>dominio.local</code>) · <span class=\"ph\">&lt;AQUÍ-DN-DONDE-SE-CREA&gt;</span> = DN de la UO o dominio donde se crea (ej. <code>ou=ORG,dc=dominio,dc=local</code>) · <span class=\"ph\">&lt;AQUÍ-NOMBRE&gt;</span> = nombre de pila (ej. <code>Anna</code>) · <span class=\"ph\">&lt;AQUÍ-APELLIDOS&gt;</span> = apellidos (ej. <code>Puig Soler</code>) · <span class=\"ph\">&lt;AQUÍ-INICIALES&gt;</span> = iniciales (ej. <code>AP</code>)</p><div class=\"cw\"><pre>New-ADUser -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-COMPLETO&gt;</span>\" -SamAccountName \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\" -UserPrincipalName \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>@<span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span>\" `\n  -Enabled $true -AccountPassword (Read-Host -AsSecureString \"introdueix password\") `\n  -Path \"<span class=\"ph\">&lt;AQUÍ-DN-DONDE-SE-CREA&gt;</span>\" -GivenName \"<span class=\"ph\">&lt;AQUÍ-NOMBRE&gt;</span>\" -Surname \"<span class=\"ph\">&lt;AQUÍ-APELLIDOS&gt;</span>\" -Initials \"<span class=\"ph\">&lt;AQUÍ-INICIALES&gt;</span>\" -PasswordNeverExpires $false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Crear usuario en un script</b> (contraseña en texto plano).</p><p class=\"m\">En fácil: Crea un usuario usando una contraseña escrita en el comando.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-COMPLETO&gt;</span> = nombre completo del usuario (ej. <code>Anna Puig</code>) · <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>) · <span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span> = el dominio (ej. <code>dominio.local</code>) · <span class=\"ph\">&lt;AQUÍ-CONTRASEÑA&gt;</span> = contraseña (que cumpla la complejidad) (ej. <code>P@ssw0rd123</code>) · <span class=\"ph\">&lt;AQUÍ-DN-DONDE-SE-CREA&gt;</span> = DN de la UO o dominio donde se crea (ej. <code>ou=ORG,dc=dominio,dc=local</code>) · <span class=\"ph\">&lt;AQUÍ-NOMBRE&gt;</span> = nombre de pila (ej. <code>Anna</code>) · <span class=\"ph\">&lt;AQUÍ-APELLIDOS&gt;</span> = apellidos (ej. <code>Puig Soler</code>)</p><div class=\"cw\"><pre>New-ADUser -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-COMPLETO&gt;</span>\" -SamAccountName \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\" -UserPrincipalName \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>@<span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span>\" `\n  -Enabled $true -AccountPassword (ConvertTo-SecureString \"<span class=\"ph\">&lt;AQUÍ-CONTRASEÑA&gt;</span>\" -AsPlainText -Force) `\n  -Path \"<span class=\"ph\">&lt;AQUÍ-DN-DONDE-SE-CREA&gt;</span>\" -GivenName \"<span class=\"ph\">&lt;AQUÍ-NOMBRE&gt;</span>\" -Surname \"<span class=\"ph\">&lt;AQUÍ-APELLIDOS&gt;</span>\" -PasswordNeverExpires $false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Crear muchos usuarios desde un CSV</b> (columnas: nom, login, ou).</p><p class=\"m\">En fácil: Crea usuarios leyendo sus datos desde un archivo CSV.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-RUTA-DEL-CSV&gt;</span> = ruta del archivo CSV (ej. <code>C:\\usuarios.csv</code>) · <span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span> = el dominio (ej. <code>dominio.local</code>) · <span class=\"ph\">&lt;AQUÍ-CONTRASEÑA&gt;</span> = contraseña (que cumpla la complejidad) (ej. <code>P@ssw0rd123</code>)</p><div class=\"cw\"><pre>Import-Csv \"<span class=\"ph\">&lt;AQUÍ-RUTA-DEL-CSV&gt;</span>\" | ForEach-Object {\n  New-ADUser -Name $_.nom -SamAccountName $_.login -UserPrincipalName \"$($_.login)@<span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span>\" `\n    -Path $_.ou -Enabled $true -AccountPassword (ConvertTo-SecureString \"<span class=\"ph\">&lt;AQUÍ-CONTRASEÑA&gt;</span>\" -AsPlainText -Force)\n}</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Modificar usuario.</b> Pon solo -Identity y las propiedades que cambian.</p><p class=\"m\">En fácil: Cambia los datos de una cuenta de usuario.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN-O-DN&gt;</span> = login (o DN) del usuario (ej. <code>a.puig</code>) · <span class=\"ph\">&lt;AQUÍ-NOMBRE-NUEVO&gt;</span> = el nombre nuevo (ej. <code>Comercial</code>)</p><div class=\"cw\"><pre>Set-ADUser -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN-O-DN&gt;</span>\" -GivenName \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-NUEVO&gt;</span>\" -Enabled $true</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Poner correo y descripción</b> a un usuario.</p><p class=\"m\">En fácil: Cambia el correo y la descripción del usuario.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>) · <span class=\"ph\">&lt;AQUÍ-CORREO&gt;</span> = correo electrónico (ej. <code>a.puig@empresa.com</code>) · <span class=\"ph\">&lt;AQUÍ-DESCRIPCIÓN&gt;</span> = texto libre (ej. <code>Alumna de primero</code>)</p><div class=\"cw\"><pre>Set-ADUser -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\" -EmailAddress \"<span class=\"ph\">&lt;AQUÍ-CORREO&gt;</span>\" -Description \"<span class=\"ph\">&lt;AQUÍ-DESCRIPCIÓN&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Obligar a cambiar la contraseña</b> en el próximo inicio de sesión.</p><p class=\"m\">En fácil: Obliga al usuario a cambiar la contraseña al iniciar sesión.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>)</p><div class=\"cw\"><pre>Set-ADUser -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\" -ChangePasswordAtLogon $true</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Restringir en qué equipos puede iniciar sesión</b> (Iniciar sesión en…).</p><p class=\"m\">En fácil: Indica los equipos desde los que el usuario puede iniciar sesión.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>) · <span class=\"ph\">&lt;AQUÍ-EQUIPO-1&gt;</span> = primer equipo (ej. <code>PC1</code>) · <span class=\"ph\">&lt;AQUÍ-EQUIPO-2&gt;</span> = segundo equipo (ej. <code>PC2</code>)</p><div class=\"cw\"><pre>Set-ADUser -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\" -LogonWorkstations \"<span class=\"ph\">&lt;AQUÍ-EQUIPO-1&gt;</span>,<span class=\"ph\">&lt;AQUÍ-EQUIPO-2&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Mover usuario</b> a otra UO.</p><p class=\"m\">En fácil: Mueve un usuario o equipo a otra OU.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span> = DN completo del objeto (UO, usuario, grupo…) (ej. <code>cn=a.puig,ou=Alumnat,dc=dominio,dc=local</code>) · <span class=\"ph\">&lt;AQUÍ-DN-DESTINO&gt;</span> = DN de la UO a la que lo mueves (ej. <code>ou=Professorat,ou=ORG,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>Move-ADObject -Identity \"<span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span>\" -TargetPath \"<span class=\"ph\">&lt;AQUÍ-DN-DESTINO&gt;</span>\" -Confirm:$false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Borrar usuario.</b></p><p class=\"m\">En fácil: Borra una cuenta de usuario.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN-O-DN&gt;</span> = login (o DN) del usuario (ej. <code>a.puig</code>)</p><div class=\"cw\"><pre>Remove-ADUser -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN-O-DN&gt;</span>\" -Confirm:$false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver un usuario</b> con todas sus propiedades.</p><p class=\"m\">En fácil: Muestra los datos básicos de los usuarios.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN-O-DN&gt;</span> = login (o DN) del usuario (ej. <code>a.puig</code>)</p><div class=\"cw\"><pre>Get-ADUser -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN-O-DN&gt;</span>\" -Properties *</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver todos los usuarios de una UO.</b></p><p class=\"m\">En fácil: Busca usuarios dentro de una OU concreta y muestra los campos elegidos.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span> = DN completo de la UO (ej. <code>ou=Alumnat,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>Get-ADUser -Filter * -SearchBase \"<span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span>\" | Select-Object Name, SamAccountName</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Buscar usuarios con filtro</b> (ejemplo: correo que NO acaba en .com).</p><p class=\"m\">En fácil: Busca usuarios cuyo correo no termina en .com.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-PATRÓN&gt;</span> = patrón de búsqueda (* = cualquier cosa) (ej. <code>*.com</code>)</p><div class=\"cw\"><pre>Get-ADUser -Filter {EmailAddress -notlike \"<span class=\"ph\">&lt;AQUÍ-PATRÓN&gt;</span>\"} -Properties EmailAddress</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Cuentas: contraseña, bloqueo y desactivar</div><div class=\"cmd\"><p class=\"d\"><b>Cambiar (resetear) la contraseña</b> de un usuario.</p><p class=\"m\">En fácil: Asigna una contraseña nueva a la cuenta.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>) · <span class=\"ph\">&lt;AQUÍ-CONTRASEÑA&gt;</span> = contraseña (que cumpla la complejidad) (ej. <code>P@ssw0rd123</code>)</p><div class=\"cw\"><pre>Set-ADAccountPassword -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\" -Reset -NewPassword (ConvertTo-SecureString \"<span class=\"ph\">&lt;AQUÍ-CONTRASEÑA&gt;</span>\" -AsPlainText -Force)</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver las cuentas bloqueadas.</b></p><p class=\"m\">En fácil: Muestra las cuentas bloqueadas.</p><div class=\"cw\"><pre>Search-ADAccount -LockedOut</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Desbloquear una cuenta.</b></p><p class=\"m\">En fácil: Desbloquea una cuenta.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>)</p><div class=\"cw\"><pre>Unlock-ADAccount -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Desactivar una cuenta.</b></p><p class=\"m\">En fácil: Desactiva una cuenta para impedir que inicie sesión.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>)</p><div class=\"cw\"><pre>Disable-ADAccount -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Activar una cuenta.</b></p><p class=\"m\">En fácil: Activa de nuevo una cuenta.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>)</p><div class=\"cw\"><pre>Enable-ADAccount -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Grupos</div><div class=\"cmd\"><p class=\"d\"><b>Crear grupo Global</b> (siempre Global y Security).</p><p class=\"m\">En fácil: Crea un grupo de seguridad global.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span> = nombre del grupo (ej. <code>G_Alumnat</code>) · <span class=\"ph\">&lt;AQUÍ-DN-DONDE-SE-CREA&gt;</span> = DN de la UO o dominio donde se crea (ej. <code>ou=ORG,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>New-ADGroup -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span>\" -Path \"<span class=\"ph\">&lt;AQUÍ-DN-DONDE-SE-CREA&gt;</span>\" -GroupScope 1 -GroupCategory Security</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Modificar grupo.</b></p><p class=\"m\">En fácil: Cambia el nombre o la descripción de un grupo.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO-O-DN&gt;</span> = nombre (o DN) del grupo (ej. <code>G_Alumnat</code>) · <span class=\"ph\">&lt;AQUÍ-DESCRIPCIÓN&gt;</span> = texto libre (ej. <code>Alumna de primero</code>) · <span class=\"ph\">&lt;AQUÍ-NOMBRE-VISIBLE&gt;</span> = nombre visible del grupo (ej. <code>Grupo del alumnado</code>)</p><div class=\"cw\"><pre>Set-ADGroup -Identity \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO-O-DN&gt;</span>\" -Description \"<span class=\"ph\">&lt;AQUÍ-DESCRIPCIÓN&gt;</span>\" -DisplayName \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-VISIBLE&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Mover grupo.</b></p><p class=\"m\">En fácil: Mueve un grupo a otra OU.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span> = DN completo del objeto (UO, usuario, grupo…) (ej. <code>cn=a.puig,ou=Alumnat,dc=dominio,dc=local</code>) · <span class=\"ph\">&lt;AQUÍ-DN-DESTINO&gt;</span> = DN de la UO a la que lo mueves (ej. <code>ou=Professorat,ou=ORG,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>Move-ADObject -Identity \"<span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span>\" -TargetPath \"<span class=\"ph\">&lt;AQUÍ-DN-DESTINO&gt;</span>\" -Confirm:$false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Borrar grupo.</b></p><p class=\"m\">En fácil: Borra un grupo.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO-O-DN&gt;</span> = nombre (o DN) del grupo (ej. <code>G_Alumnat</code>)</p><div class=\"cw\"><pre>Remove-ADGroup -Identity \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO-O-DN&gt;</span>\" -Confirm:$false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver grupos</b> con todas sus propiedades.</p><p class=\"m\">En fácil: Muestra todos los grupos.</p><div class=\"cw\"><pre>Get-ADGroup -Filter * -Properties *</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Añadir miembros a un grupo</b> (desde el grupo).</p><p class=\"m\">En fácil: Añade usuarios al grupo indicado.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span> = nombre del grupo (ej. <code>G_Alumnat</code>) · <span class=\"ph\">&lt;AQUÍ-USUARIO-1&gt;</span> = primer usuario (login) (ej. <code>a.puig</code>) · <span class=\"ph\">&lt;AQUÍ-USUARIO-2&gt;</span> = segundo usuario (login) (ej. <code>m.vila</code>)</p><div class=\"cw\"><pre>Add-ADGroupMember -Identity \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span>\" -Members \"<span class=\"ph\">&lt;AQUÍ-USUARIO-1&gt;</span>\",\"<span class=\"ph\">&lt;AQUÍ-USUARIO-2&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Quitar miembros de un grupo</b> (desde el grupo).</p><p class=\"m\">En fácil: Quita usuarios del grupo.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span> = nombre del grupo (ej. <code>G_Alumnat</code>) · <span class=\"ph\">&lt;AQUÍ-USUARIO-1&gt;</span> = primer usuario (login) (ej. <code>a.puig</code>)</p><div class=\"cw\"><pre>Remove-ADGroupMember -Identity \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span>\" -Members \"<span class=\"ph\">&lt;AQUÍ-USUARIO-1&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Añadir un usuario a varios grupos</b> (desde el elemento).</p><p class=\"m\">En fácil: Indica a qué grupos pertenece el usuario.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>) · <span class=\"ph\">&lt;AQUÍ-GRUPO-1&gt;</span> = primer grupo (ej. <code>G_Alumnat</code>) · <span class=\"ph\">&lt;AQUÍ-GRUPO-2&gt;</span> = segundo grupo (ej. <code>G_Centre</code>)</p><div class=\"cw\"><pre>Add-ADPrincipalGroupMembership -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\" -MemberOf \"<span class=\"ph\">&lt;AQUÍ-GRUPO-1&gt;</span>\",\"<span class=\"ph\">&lt;AQUÍ-GRUPO-2&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Quitar un usuario de grupos</b> (desde el elemento).</p><p class=\"m\">En fácil: Añade el usuario a los grupos indicados.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>) · <span class=\"ph\">&lt;AQUÍ-GRUPO-1&gt;</span> = primer grupo (ej. <code>G_Alumnat</code>)</p><div class=\"cw\"><pre>Remove-ADPrincipalGroupMembership -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\" -MemberOf \"<span class=\"ph\">&lt;AQUÍ-GRUPO-1&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver los miembros de un grupo.</b></p><p class=\"m\">En fácil: Quita al usuario de los grupos indicados.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span> = nombre del grupo (ej. <code>G_Alumnat</code>)</p><div class=\"cw\"><pre>Get-ADGroupMember -Identity \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span>\" | Select-Object Name</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver los grupos de un usuario.</b></p><p class=\"m\">En fácil: Comprueba quién pertenece al grupo.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>)</p><div class=\"cw\"><pre>Get-ADPrincipalGroupMembership -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\" | Select-Object Name</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Equipos</div><div class=\"cmd\"><p class=\"d\"><b>Ver los equipos del dominio.</b></p><p class=\"m\">En fácil: Muestra los grupos a los que pertenece el usuario.</p><div class=\"cw\"><pre>Get-ADComputer -Filter * | Select-Object Name, DistinguishedName</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Mover un equipo a su UO</b> (no se crean a mano en ADUC: se unen desde el cliente).</p><p class=\"m\">En fácil: Muestra los equipos del contenedor Computers.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-EQUIPO&gt;</span> = nombre del equipo (ej. <code>WIN10</code>) · <span class=\"ph\">&lt;AQUÍ-DN-DEL-DOMINIO&gt;</span> = DN del dominio (ej. <code>dc=dominio,dc=local</code>) · <span class=\"ph\">&lt;AQUÍ-DN-UO-EQUIPOS&gt;
