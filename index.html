<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practica DNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2333;--muted:#5b6679;--line:#dde3ee;--blue:#2f6fed;--green:#16a36a;--red:#e5484d;--orange:#f28c18;--purple:#8b5cf6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#18202f;--ink:#e8edf7;--muted:#9aa6bd;--line:#2a3550}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
header{background:linear-gradient(120deg,var(--blue),var(--purple));color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px}
header h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;opacity:.9;font-size:.92rem}
.card{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 1px 5px rgba(20,30,60,.1)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 10px}
.bar div{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .3s}
.meta{font-size:.88rem;color:var(--muted)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;color:#fff;padding:2px 10px;border-radius:12px;margin-bottom:10px}
h2{margin:0 0 14px;font-size:1.2rem}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:rgba(47,111,237,.14);font-weight:600}
.opt:focus-visible,.btn:focus-visible,.dot:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn.fin{background:var(--green)}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.dot{width:32px;height:32px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.82rem;cursor:pointer}
.dot.done{background:rgba(47,111,237,.18);border-color:var(--blue)}
.dot.cur{outline:3px solid var(--orange)}
.big{font-size:3rem;font-weight:800;text-align:center;margin:4px 0}
.rev{border-left:5px solid var(--red);background:rgba(229,72,77,.08);border-radius:10px;padding:12px 14px;margin:12px 0}
.rev p{margin:4px 0}
.no{color:var(--red);font-weight:700}.yes{color:var(--green);font-weight:700}
.hist{margin-top:16px;font-size:.92rem;color:var(--muted)}
.c{text-align:center}
.opt.dead{opacity:.45;text-decoration:line-through;border-color:var(--red);cursor:default}
.opt.good{border-color:var(--green);background:rgba(22,163,106,.16);font-weight:600}
.help{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:5px solid var(--orange);background:rgba(242,140,24,.12)}
.help.ok{border-left-color:var(--green);background:rgba(22,163,106,.12)}
.mode{display:inline-block;font-size:.78rem;font-weight:700;color:var(--purple);margin-left:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hb{color:#fff;border-color:#fff;padding:8px 14px;margin:0}
.mb{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;cursor:pointer}
.mb:hover{border-color:var(--blue)}.mb:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.mb.rec{border-color:var(--green);background:rgba(22,163,106,.1)}
.mb b{display:block;font-size:1.1rem}.mb span{color:var(--muted);font-size:.92rem}
.inp{width:100%;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0}
.inp:focus{border-color:var(--blue);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.wrap{padding-top:72px}
header{background:var(--hg,linear-gradient(120deg,var(--blue),var(--purple)))}
.wheel{position:fixed;top:12px;left:12px;z-index:1000;width:46px;height:46px;border-radius:50%;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;overflow:hidden}
.wheel input{opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.wheel:focus-within{outline:3px solid var(--orange);outline-offset:2px}
.wr{position:fixed;top:19px;left:66px;z-index:1000;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:1rem;line-height:1}
.wr:focus-visible{outline:3px solid var(--orange)}
body.full .wrap{display:none}
#full{position:fixed;top:0;left:0;width:100%;height:100%;border:0;z-index:500;background:var(--bg)}
.fb{position:fixed;top:12px;right:12px;z-index:1000;margin:0;box-shadow:0 2px 8px rgba(0,0,0,.35)}

@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.card.enter{animation:in .28s ease both}
.shake{animation:shake .4s}.pop{animation:pop .35s}
.inp.shake{border-color:var(--red)}.inp.pop{border-color:var(--green)}
.mb,.opt,.btn{transition:transform .12s,border-color .12s,box-shadow .12s,background .12s}
.mb:hover,.opt:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(20,30,60,.14)}
.btn:not(:disabled):active,.mb:active,.opt:not(:disabled):active{transform:scale(.97)}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:2000;pointer-events:none;animation:fall linear forwards}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;font-weight:700;z-index:3000;animation:tin .25s both}
.stats{margin-top:18px;padding-top:12px;border-top:2px solid var(--line)}
.srow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:.88rem}
.sl{width:140px;flex:none}.sp{width:42px;text-align:right;font-weight:700}
.sbar{flex:1;height:12px;background:var(--line);border-radius:7px;overflow:hidden}
.sbar div{height:100%;border-radius:7px;transition:width .8s ease}
.fc{display:block;width:100%;height:210px;perspective:900px;background:none;border:0;padding:0;margin:8px 0;cursor:pointer;font:inherit;color:inherit}
.fci{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.fc:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:14px}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--tc,var(--blue));border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.ff b{font-size:1.35rem}.ff small{color:var(--muted)}
.ff.bk{transform:rotateY(180deg);border-color:var(--green)}
.wrap{position:relative;z-index:1}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
body.pt{--card:rgba(255,255,255,.13);--ink:#fff;--muted:rgba(255,255,255,.78);--line:rgba(255,255,255,.3);
font-family:'Fredoka','Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;font-weight:500;
background:linear-gradient(-45deg,#101a4f,var(--blue),#5b2a86,#0e7490,#101a4f);background-size:400% 400%;animation:bgshift 16s ease infinite;color:#fff}
body.pt header{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
body.pt header h1{font-weight:700;letter-spacing:.02em;text-shadow:0 0 16px rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.2)}
body.pt .card{background:color-mix(in srgb,var(--cd,#0e1234) 42%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 44px rgba(0,0,0,.32)}
body.pt .card.clear{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
body.pt h2{font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.18)}
body.pt .opt:not(:disabled):hover,body.pt .mb:hover{border-color:var(--hi,#8be9fd);background:rgba(255,255,255,.22)}
body.pt .opt.sel{background:color-mix(in srgb,var(--hi,#8be9fd) 25%,transparent);border-color:var(--hi,#8be9fd)}
body.pt .opt.good{background:rgba(34,197,94,.35);border-color:#4ade80}
body.pt .opt.dead{border-color:#ff6b70}
body.pt .mb.rec{background:rgba(34,197,94,.22);border-color:#4ade80}
body.pt .mb b{font-weight:700;font-size:1.15rem}
body.pt .btn.alt{color:#fff;border-color:rgba(255,255,255,.75)}
body.pt .btn{font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
body.pt .btn.alt{box-shadow:none}
body.pt .btn:not(:disabled):hover{filter:brightness(1.12)}
body.pt .dot.done{background:color-mix(in srgb,var(--hi,#8be9fd) 35%,transparent);border-color:var(--hi,#8be9fd)}
body.pt .dot.cur{outline-color:#ffe08a}
body.pt .bar div{box-shadow:0 0 12px color-mix(in srgb,var(--hi,#8be9fd) 70%,transparent)}
body.pt .help{background:rgba(250,204,21,.2);border-left-color:#fbbf24}
body.pt .help.ok{background:rgba(34,197,94,.28);border-left-color:#4ade80}
body.pt .rev{background:rgba(255,90,95,.18);border-left-color:#ff6b70}
body.pt .no{color:#ff9a9e}body.pt .yes{color:#6ee7a8}
body.pt .inp{background:rgba(255,255,255,.1);color:#fff}
body.pt .inp::placeholder{color:rgba(255,255,255,.55)}
body.pt .inp:focus{border-color:var(--hi,#8be9fd);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi,#8be9fd) 20%,transparent)}
body.pt .mode{color:#d8c9ff}
body.pt .ff{background:rgba(20,26,78,.78)}
body.pt .ff.bk{background:rgba(10,70,60,.75)}
body.pt .big{text-shadow:0 0 24px currentColor}
body.pt .stats{border-top-color:rgba(255,255,255,.28)}
#full{background:#101a4f}
@keyframes bgshift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes drop{from{opacity:0;transform:translateY(-70px) rotate(-14deg) scale(.5)}to{opacity:1;transform:none}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes up{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-75vh) rotate(28deg);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(139,233,253,.55),0 12px 32px rgba(0,0,0,.28)}50%{box-shadow:0 0 0 14px rgba(139,233,253,0),0 12px 32px rgba(0,0,0,.28)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
.portal{position:relative;min-height:64vh;display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;font-family:'Fredoka','Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif}
.ptitle{font-size:4.2rem;line-height:1.1;margin:0 0 6px;font-weight:700;letter-spacing:.03em;text-shadow:0 0 22px rgba(255,255,255,.5),0 5px 0 rgba(0,0,0,.22)}
.pl{display:inline-block;animation:drop .8s cubic-bezier(.2,1.5,.4,1) backwards,wave 2.6s ease-in-out infinite}
.psub{margin:0;font-size:1.05rem;color:rgba(255,255,255,.9);animation:up .7s .5s both}
.cback{position:absolute;top:0;left:0;z-index:2}
.fl{position:absolute;bottom:-24px;font-size:1.9rem;opacity:0;animation:rise 9s linear infinite;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));pointer-events:none}
.svc{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;margin-top:36px;text-align:left;font:inherit;color:#fff;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.45);border-radius:22px;padding:18px 22px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:glow 2.4s ease-in-out infinite,up .7s .7s both;transition:transform .15s,background .2s}
.svc:hover{background:rgba(255,255,255,.26)}
.svc:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.svc::after{content:'';position:absolute;top:0;left:0;width:34%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.6s ease-in-out infinite}
.svc .gl{flex:none;animation:bob 3s ease-in-out infinite}
.svc b{display:block;font-size:2rem;letter-spacing:.05em;line-height:1.1}
.svc .d{display:block;opacity:.9;font-size:.95rem}
.svc .ar{margin-left:auto;font-size:1.8rem;transition:transform .2s}
.svc:hover .ar{transform:translateX(7px)}
@media (max-width:520px){.ptitle{font-size:3.3rem}}
@media (max-width:520px){.sl{width:96px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.pt.dk{background:linear-gradient(-45deg,#04060c,#0a1028,#120820,#041a20,#04060c);background-size:400% 400%;animation:bgshift 16s ease infinite}
body.pt.dk .card{background:rgba(3,5,12,.78)}
body.pt.dk header{background:rgba(0,0,0,.5)!important}

/* ===== Mejora visual ===== */
html{scroll-behavior:smooth}
::selection{background:var(--hi,#8be9fd);color:#06122e}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.wrap{max-width:780px;padding-bottom:90px}
body.pt header{border-radius:22px;padding:22px 26px;box-shadow:0 10px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.28)}
body.pt header h1{font-size:1.8rem;background:linear-gradient(90deg,#fff,#bff6ff 55%,#ffd6f0);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 10px color-mix(in srgb,var(--hi,#8be9fd) 35%,transparent))}
body.pt header p{font-size:.95rem;opacity:.85}

body.pt .opt:not(:disabled):hover{border-color:var(--hi,#8be9fd);background:color-mix(in srgb,var(--hi,#8be9fd) 16%,transparent);box-shadow:0 8px 22px rgba(0,0,0,.28),0 0 0 3px color-mix(in srgb,var(--hi,#8be9fd) 15%,transparent)}

/* ===== Transiciones y barra personalizada ===== */
html{scrollbar-width:thin;scrollbar-color:var(--hi,#8be9fd) rgba(255,255,255,.08)}
::-webkit-scrollbar{width:16px;height:16px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.07);border-radius:12px;margin:10px 0;box-shadow:inset 0 0 6px rgba(0,0,0,.35)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--hi,#8be9fd),var(--hi2,#a78bfa) 55%,#ff9ecb);border-radius:12px;border:4px solid transparent;background-clip:content-box;min-height:56px;transition:background .3s}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#bff6ff,#c4b5fd 55%,#ffc2e0);background-clip:content-box;border-width:3px}
::-webkit-scrollbar-thumb:active{background:linear-gradient(180deg,#4ade80,var(--hi,#8be9fd));background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
#sp{position:fixed;top:0;left:0;height:4px;width:0;z-index:2500;background:linear-gradient(90deg,#4ade80,var(--hi,#8be9fd),var(--hi2,#a78bfa),#ff9ecb);box-shadow:0 0 12px color-mix(in srgb,var(--hi,#8be9fd) 80%,transparent);transition:width .15s linear;pointer-events:none}
@keyframes drift{to{transform:translate(5%,-4%) scale(1.12)}}
@keyframes hdrin{from{opacity:0;transform:translateY(-22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes zoomin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
body.pt::before{content:'';position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(circle at 18% 28%,color-mix(in srgb,var(--hi,#8be9fd) 20%,transparent),transparent 38%),radial-gradient(circle at 82% 72%,color-mix(in srgb,var(--hi2,#a78bfa) 24%,transparent),transparent 42%),radial-gradient(circle at 60% 10%,rgba(255,158,203,.14),transparent 35%);animation:drift 22s ease-in-out infinite alternate}

n<a href=\"#d7\" style=\"background:var(--pink)\">Zonas<\/a>\n<a href=\"#d8\" style=\"background:var(--teal)\">AD DS<\/a>\n<\/nav>\n\n<section id=\"d2\" style=\"--c:var(--blue)\">\n<h2>Qué es el DNS <small>diapositivas 2 y 3<\/small><\/h2>\n<p>Sistema de nombres <mark>jerárquico<\/mark> sobre una base de datos <mark>distribuida<\/mark>. Funciona en internet y en redes privadas.<\/p>\n<p>Su trabajo: <mark>traducir nombres de dominio a direcciones IP<\/mark>.<\/p>\n<ul>\n<li>Protocolo normal: <mark>UDP<\/mark><\/li>\n<li>Puerto: <mark>53<\/mark><\/li>\n<li>A veces usa el mismo puerto con <mark>TCP<\/mark><\/li>\n<\/ul>\n<div class=\"tip\">🟢 Resumen: DNS = <b>53<\/b>, normalmente <b>UDP<\/b>, y traduce nombre → IP.<\/div>\n<\/section>\n\n<section id=\"d4\" style=\"--c:var(--green)\">\n<h2>Terminología básica <small>diapositiva 4<\/small><\/h2>\n<div class=\"cols\" style=\"--c2:var(--green)\">\n<div><b>Host name<\/b><br>Nombre de un equipo. <mark>Una sola palabra<\/mark> (letras, números, guiones).<br>Ej: <code>www<\/code>, <code>PC1<\/code><\/div>\n<div style=\"--c2:var(--blue)\"><b>FQDN<\/b><br>Nombre completo = <mark>host + punto + dominio<\/mark>.<br>Ej: <code>server1.sapalomera.cat.<\/code><\/div>\n<div style=\"--c2:var(--orange)\"><b>Domain name<\/b><br>Nombres unidos por puntos.<br>Ej: <code>www.google.com<\/code><\/div>\n<div style=\"--c2:var(--purple)\"><b>TLD<\/b><br>Dominios de <mark>nivel superior<\/mark>, no pertenecen a otro.<br>Ej: <code>com<\/code> <code>org<\/code> <code>cat<\/code><\/div>\n<\/div>\n<div class=\"tip\">🟢 FQDN = el nombre <b>entero<\/b>, el que acaba en punto.<\/div>\n<\/section>\n\n<section id=\"d5\" style=\"--c:var(--orange)\">\n<h2>Registros DNS <small>diapositiva 5<\/small><\/h2>\n<div class=\"rec\">\n<span class=\"badge\" style=\"background:var(--red)\">SOA<\/span><span>Servidor que mantiene la <mark>zona primaria<\/mark>. Solo indica el FQDN, <b>no la IP<\/b>.<\/span>\n<span class=\"badge\" style=\"background:var(--blue)\">NS<\/span><span><b>Name Server<\/b>: servidor(es) de nombres del dominio.<\/span>\n<span class=\"badge\" style=\"background:var(--green)\">A<\/span><span><b>Address<\/b>: nombre de host → <mark>IP<\/mark>.<\/span>\n<span class=\"badge\" style=\"background:var(--purple)\">CNAME<\/span><span><b>Alias<\/b> de un host.<\/span>\n<span class=\"badge\" style=\"background:var(--pink)\">MX<\/span><span><b>Mail Exchange<\/b>: servidor que recibe el <mark>correo<\/mark>.<\/span>\n<span class=\"badge\" style=\"background:var(--teal)\">PTR<\/span><span>Registro <mark>inverso<\/mark>: IP → nombre.<\/span>\n<span class=\"badge\" style=\"background:var(--orange)\">SRV<\/span><span><b>Service Locator<\/b>: los clientes encuentran <mark>servicios de red<\/mark>.<\/span>\n<\/div>\n<div class=\"warn\">🔴 No confundir: <b>A<\/b> = nombre → IP. <b>PTR<\/b> = IP → nombre.<\/div>\n<\/section>\n\n<section id=\"d6\" style=\"--c:var(--purple)\">\n<h2>Jerarquía DNS <small>diapositiva 6<\/small><\/h2>\n<div class=\"tree\"><em>.<\/em>  (raíz)\n├── <strong>com<\/strong>\n├── <strong>org<\/strong>      ← TLD\n│   ├── wikipedia   ← dominio\n│   │   ├── nds\n│   │   └── <em>es<\/em>    → es.wikipedia.org.\n│   └── fsf\n├── <strong>net<\/strong>\n└── <strong>onu<\/strong><\/div>\n<div class=\"tip\">🟢 Se lee de <b>derecha a izquierda<\/b>: raíz → TLD → dominio → subdominio.<\/div>\n<\/section>\n\n<section id=\"d7\" style=\"--c:var(--pink)\">\n<h2>Zonas DNS <small>diapositiva 7<\/small><\/h2>\n<div class=\"cols\" style=\"--c2:var(--pink)\">\n<div><b>Zona principal<\/b><br>El servidor es la <mark>fuente principal<\/mark> y guarda la <mark>copia maestra<\/mark>.<\/div>\n<div style=\"--c2:var(--blue)\"><b>Zona secundaria<\/b><br><mark>Copia<\/mark> de una zona principal que está en <mark>otro servidor<\/mark>.<\/div>\n<div style=\"--c2:var(--orange)\"><b>Zona de rutas internas<\/b> (stub)<br>Solo los registros para identificar los <mark>servidores DNS autoritativos<\/mark>.<\/div>\n<\/div>\n<\/section>\n\n<section id=\"d8\" style=\"--c:var(--teal)\">\n<h2>Integración con Active Directory <small>diapositiva 8<\/small><\/h2>\n<p>El DNS es <mark>imprescindible<\/mark> para AD DS:<\/p>\n<ul>\n<li>Los <b class=\"k\">clientes<\/b> buscan los <mark>controladores de dominio<\/mark> por DNS (así se autentican equipos y usuarios).<\/li>\n<li>Los controladores <b class=\"k\">se encuentran entre sí<\/b> por DNS (así hay <mark>replicación<\/mark>).<\/li>\n<li>También localizan al <mark>Catálogo Global<\/mark> mediante DNS.<\/li>\n<\/ul>\n<\/section>\n<\/div>\n<\/body>\n<\/html>\n";

};

    const {getDatabase,ref,push,set,onValue,onDisconnect}=await import(B+'firebase-database.js');
