</span> = DN de la UO de equipos (ej. <code>ou=Equips,ou=ORG,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>Move-ADObject -Identity \"CN=<span class=\"ph\">&lt;AQUÍ-NOMBRE-EQUIPO&gt;</span>,CN=Computers,<span class=\"ph\">&lt;AQUÍ-DN-DEL-DOMINIO&gt;</span>\" -TargetPath \"<span class=\"ph\">&lt;AQUÍ-DN-UO-EQUIPOS&gt;</span>\" -Confirm:$false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Renombrar, pipe y filtros</div><div class=\"cmd\"><p class=\"d\"><b>Renombrar</b> cualquier objeto (UO, usuario, grupo, equipo).</p><p class=\"m\">En fácil: Mueve un equipo a otra OU.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span> = DN completo del objeto (UO, usuario, grupo…) (ej. <code>cn=a.puig,ou=Alumnat,dc=dominio,dc=local</code>) · <span class=\"ph\">&lt;AQUÍ-NOMBRE-NUEVO&gt;</span> = el nombre nuevo (ej. <code>Comercial</code>)</p><div class=\"cw\"><pre>Rename-ADObject -Identity \"<span class=\"ph\">&lt;AQUÍ-DN-DEL-OBJETO&gt;</span>\" -NewName \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-NUEVO&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Pipe (|):</b> pasa el resultado al siguiente comando. Ejemplo: poner descripción a todos los grupos.</p><p class=\"m\">En fácil: Cambia el nombre de un objeto.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-DESCRIPCIÓN&gt;</span> = texto libre (ej. <code>Alumna de primero</code>)</p><div class=\"cw\"><pre>Get-ADGroup -Filter * | Set-ADGroup -Description \"<span class=\"ph\">&lt;AQUÍ-DESCRIPCIÓN&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>-eq</b> igual a.</p><p class=\"m\">En fácil: Cambia la descripción de todos los grupos.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-APELLIDO&gt;</span> = apellido a buscar (ej. <code>Garcia</code>)</p><div class=\"cw\"><pre>{Surname -eq \"<span class=\"ph\">&lt;AQUÍ-APELLIDO&gt;</span>\"}</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>-ne</b> distinto de.</p><p class=\"m\">En fácil: Busca usuarios por apellido.</p><div class=\"cw\"><pre>{Enabled -ne $false}</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>-like</b> coincide con el patrón (comodín *).</p><p class=\"m\">En fácil: Busca cuentas que están activas.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-PATRÓN&gt;</span> = patrón de búsqueda (* = cualquier cosa) (ej. <code>*.com</code>)</p><div class=\"cw\"><pre>{Name -like \"<span class=\"ph\">&lt;AQUÍ-PATRÓN&gt;</span>\"}</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>-notlike</b> NO coincide con el patrón.</p><p class=\"m\">En fácil: Busca usuarios cuyo nombre empieza por el texto indicado.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-PATRÓN&gt;</span> = patrón de búsqueda (* = cualquier cosa) (ej. <code>*.com</code>)</p><div class=\"cw\"><pre>{EmailAddress -notlike \"<span class=\"ph\">&lt;AQUÍ-PATRÓN&gt;</span>\"}</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div></section><section id=\"t25\" style=\"--c:var(--purple)\"><h2>2.5 Perfiles y carpetas</h2><div class=\"sec-sub\">Rutas que se escriben en ADUC (Propiedades del usuario → pestaña Perfil)</div><div class=\"cmd\"><p class=\"d\"><b>Perfil móvil (Ruta de acceso del perfil).</b></p><p class=\"m\">En fácil: Busca usuarios cuyo correo no termina en .com.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span> = nombre (hostname) del servidor (ej. <code>SRV-AD</code>)</p><div class=\"cw\"><pre>\\\\<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span>\\Profiles$\\%username%</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Carpeta personal (Carpeta particular → Conectar).</b></p><p class=\"m\">En fácil: Asigna una carpeta personal distinta a cada usuario.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span> = nombre (hostname) del servidor (ej. <code>SRV-AD</code>)</p><div class=\"cw\"><pre>\\\\<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span>\\Personals\\%username%</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Hacerlo por PowerShell</div><div class=\"cmd\"><p class=\"d\"><b>Asignar carpeta personal y perfil móvil</b> a un usuario.</p><p class=\"m\">En fácil: Conecta la carpeta personal como una unidad de red.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span> = login del usuario (ej. <code>a.puig</code>) · <span class=\"ph\">&lt;AQUÍ-LETRA-UNIDAD&gt;</span> = letra de unidad (ej. <code>Z:</code>) · <span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span> = nombre (hostname) del servidor (ej. <code>SRV-AD</code>)</p><div class=\"cw\"><pre>Set-ADUser -Identity \"<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\" -HomeDrive \"<span class=\"ph\">&lt;AQUÍ-LETRA-UNIDAD&gt;</span>\" -HomeDirectory \"\\\\<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span>\\Personals\\<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\" -ProfilePath \"\\\\<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span>\\Profiles$\\<span class=\"ph\">&lt;AQUÍ-LOGIN&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Asignar perfil móvil a todos los usuarios de una UO.</b></p><p class=\"m\">En fácil: Configura la unidad personal y la ruta del perfil móvil.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span> = DN completo de la UO (ej. <code>ou=Alumnat,dc=dominio,dc=local</code>) · <span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span> = nombre (hostname) del servidor (ej. <code>SRV-AD</code>)</p><div class=\"cw\"><pre>Get-ADUser -Filter * -SearchBase \"<span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span>\" | ForEach-Object { Set-ADUser $_ -ProfilePath \"\\\\<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span>\\Profiles$\\$($_.SamAccountName)\" }</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Crear y compartir la carpeta en el servidor</div><div class=\"cmd\"><p class=\"d\"><b>Crear la carpeta y compartirla.</b> En Windows en castellano el grupo se llama <code>Usuarios autenticados</code>. En producción nunca en C:.</p><p class=\"m\">En fácil: Asigna rutas personales a todos los usuarios de una OU.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span> = nombre de la carpeta compartida (ej. <code>Personals</code>)</p><div class=\"cw\"><pre>New-Item -Path \"C:\\<span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span>\" -ItemType Directory\nNew-SmbShare -Name \"<span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span>\" -Path \"C:\\<span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span>\" -FullAccess \"Usuarios autenticados\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Compartir como carpeta oculta</b> (nombre con $).</p><p class=\"m\">En fácil: Crea una carpeta y la comparte en la red.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-CARPETA-PERFILES&gt;</span> = nombre de la carpeta de perfiles (con $ para ocultarla) (ej. <code>Profiles$</code>)</p><div class=\"cw\"><pre>New-SmbShare -Name \"<span class=\"ph\">&lt;AQUÍ-CARPETA-PERFILES&gt;</span>\" -Path \"C:\\<span class=\"ph\">&lt;AQUÍ-CARPETA-PERFILES&gt;</span>\" -FullAccess \"Usuarios autenticados\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver los permisos NTFS</b> de una carpeta.</p><p class=\"m\">En fácil: Comparte la carpeta sin mostrarla al explorar la red.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span> = nombre de la carpeta compartida (ej. <code>Personals</code>)</p><div class=\"cw\"><pre>icacls \"C:\\<span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Dar permisos NTFS</b> a un grupo.</p><p class=\"m\">En fácil: Muestra los permisos de la carpeta compartida.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span> = nombre de la carpeta compartida (ej. <code>Personals</code>) · <span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span> = nombre del grupo (ej. <code>G_Alumnat</code>)</p><div class=\"cw\"><pre>icacls \"C:\\<span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span>\" /grant \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span>:(OI)(CI)M\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Rutas gráficas (Windows en castellano)</div><div class=\"cmd gui\"><p class=\"d\"><b>Poner perfil móvil o carpeta personal.</b></p><div class=\"steps2\">ADUC → usuario (o varios seleccionados) → <span class=\"p\">Propiedades</span> → pestaña <span class=\"p\">Perfil</span> → <span class=\"p\">Ruta de acceso del perfil</span> / <span class=\"p\">Carpeta particular</span> → <span class=\"p\">Conectar</span> + letra + ruta</div></div><div class=\"cmd gui\"><p class=\"d\"><b>Compartir la carpeta (servidor).</b></p><div class=\"steps2\"><span class=\"p\">Administrador del servidor</span> → <span class=\"p\">Servicios de archivos y de almacenamiento</span> → <span class=\"p\">Recursos compartidos</span> → <span class=\"p\">Nuevo recurso compartido…</span> → <span class=\"p\">Recurso compartido SMB: rápido</span> → nombre → <span class=\"p\">Personalizar permisos…</span> → <span class=\"p\">Deshabilitar herencia</span> → <span class=\"p\">Convertir los permisos heredados en permisos explícitos</span> → quitar <span class=\"p\">Usuarios</span> y <span class=\"p\">CREATOR OWNER</span></div></div><div class=\"cmd gui\"><p class=\"d\"><b>Comprobar el perfil móvil en el cliente.</b> Debe poner Móvil | Móvil (en inglés Roaming | Roaming). Si pone Local o Temporal, hay un error.</p><div class=\"steps2\"><span class=\"p\">Configuración avanzada del sistema</span> → pestaña <span class=\"p\">Opciones avanzadas</span> → <span class=\"p\">Perfiles de usuario</span> → <span class=\"p\">Configuración…</span> → columnas <span class=\"p\">Tipo</span> y <span class=\"p\">Estado</span></div></div><div class=\"cmd gui\"><p class=\"d\"><b>Comprobar la carpeta personal en el cliente.</b></p><div class=\"steps2\">Iniciar sesión → abrir <span class=\"p\">Este equipo</span> → debe aparecer la unidad con la letra elegida</div></div></section><section id=\"t26\" style=\"--c:var(--pink)\"><h2>2.6 GPO</h2><div class=\"sec-sub\">Comandos en el cliente y servidor</div><div class=\"cmd\"><p class=\"d\"><b>Abrir Administración de directivas de grupo</b> (directivas de dominio).</p><p class=\"m\">En fácil: Da permisos de lectura, modificación o control total y permite heredarlos.</p><div class=\"cw\"><pre>gpmc.msc</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Abrir la directiva de seguridad local</b> (solo afecta a ese PC).</p><p class=\"m\">En fácil: Abre la consola para crear y vincular GPO.</p><div class=\"cw\"><pre>secpol.msc</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Aplicar las GPO en el cliente</b> sin reiniciar.</p><p class=\"m\">En fácil: Configura una directiva local solo para ese equipo.</p><div class=\"cw\"><pre>gpupdate /force</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver qué GPO se han aplicado</b> al equipo y al usuario.</p><p class=\"m\">En fácil: Fuerza la actualización de las directivas.</p><div class=\"cw\"><pre>gpresult /r</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Informe de GPO en HTML.</b></p><p class=\"m\">En fácil: Muestra qué directivas se han aplicado al usuario y al equipo.</p><div class=\"cw\"><pre>gpresult /h C:\\informe_gpo.html</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ruta de una imagen compartida</b> (fondo de escritorio en una GPO). La carpeta necesita Usuarios autenticados - Lectura.</p><p class=\"m\">En fácil: Crea un informe de las directivas aplicadas.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span> = nombre (hostname) del servidor (ej. <code>SRV-AD</code>) · <span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span> = nombre de la carpeta compartida (ej. <code>Personals</code>) · <span class=\"ph\">&lt;AQUÍ-ARCHIVO-IMAGEN&gt;</span> = archivo de imagen (ej. <code>fondo.jpg</code>)</p><div class=\"cw\"><pre>\\\\<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span>\\<span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span>\\<span class=\"ph\">&lt;AQUÍ-ARCHIVO-IMAGEN&gt;</span></pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">GPO por PowerShell (módulo GroupPolicy)</div><div class=\"cmd\"><p class=\"d\"><b>Crear una GPO.</b></p><p class=\"m\">En fácil: Guarda la imagen en una carpeta compartida para que los equipos puedan verla.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span> = nombre de la GPO (ej. <code>GPO_Fondo</code>)</p><div class=\"cw\"><pre>New-GPO -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Vincular una GPO a una UO.</b></p><p class=\"m\">En fácil: Crea una GPO, pero todavía no la aplica a ninguna OU.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span> = nombre de la GPO (ej. <code>GPO_Fondo</code>) · <span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span> = DN completo de la UO (ej. <code>ou=Alumnat,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>New-GPLink -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span>\" -Target \"<span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span>\" -Order 1</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Crear y vincular de una vez.</b></p><p class=\"m\">En fácil: Vincula la GPO a la OU o al dominio indicado.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span> = nombre de la GPO (ej. <code>GPO_Fondo</code>) · <span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span> = DN completo de la UO (ej. <code>ou=Alumnat,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>New-GPO -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span>\" | New-GPLink -Target \"<span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver todas las GPO.</b></p><p class=\"m\">En fácil: Pasa la GPO creada al comando que la vincula.</p><div class=\"cw\"><pre>Get-GPO -All | Select-Object DisplayName</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Cambiar el orden de una GPO en una UO.</b></p><p class=\"m\">En fácil: Muestra las GPO del dominio.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span> = nombre de la GPO (ej. <code>GPO_Fondo</code>) · <span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span> = DN completo de la UO (ej. <code>ou=Alumnat,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>Set-GPLink -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span>\" -Target \"<span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span>\" -Order 1</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver herencia y prioridad de una UO.</b></p><p class=\"m\">En fácil: La GPO con el número de orden más bajo tiene prioridad.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span> = DN completo de la UO (ej. <code>ou=Alumnat,dc=dominio,dc=local</code>)</p><div class=\"cw\"><pre>Get-GPInheritance -Target \"<span class=\"ph\">&lt;AQUÍ-DN-DE-LA-UO&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Borrar una GPO.</b></p><p class=\"m\">En fácil: Muestra las GPO vinculadas a una OU y su orden.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span> = nombre de la GPO (ej. <code>GPO_Fondo</code>)</p><div class=\"cw\"><pre>Remove-GPO -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Aplicar la GPO solo a un grupo</b> (filtrado de seguridad): paso 1, dar \"Aplicar\" al grupo.</p><p class=\"m\">En fácil: Elimina una GPO del dominio.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span> = nombre de la GPO (ej. <code>GPO_Fondo</code>) · <span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span> = nombre del grupo (ej. <code>G_Alumnat</code>)</p><div class=\"cw\"><pre>Set-GPPermission -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span>\" -TargetName \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;</span>\" -TargetType Group -PermissionLevel GpoApply</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Filtrado de seguridad: paso 2</b>, dejar a Usuarios autenticados solo con lectura.</p><p class=\"m\">En fácil: Permite que el grupo indicado pueda leer y aplicar la GPO.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span> = nombre de la GPO (ej. <code>GPO_Fondo</code>)</p><div class=\"cw\"><pre>Set-GPPermission -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span>\" -TargetName \"Usuarios autenticados\" -TargetType Group -PermissionLevel GpoRead -Replace</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Política de contraseñas y bloqueo del dominio.</b></p><p class=\"m\">En fácil: Limita la aplicación de la GPO al grupo indicado.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span> = el dominio (ej. <code>dominio.local</code>) · <span class=\"ph\">&lt;AQUÍ-N-CARACTERES&gt;</span> = longitud mínima de contraseña (ej. <code>8</code>) · <span class=\"ph\">&lt;AQUÍ-N-HISTORIAL&gt;</span> = contraseñas recordadas (ej. <code>5</code>) · <span class=\"ph\">&lt;AQUÍ-N-INTENTOS&gt;</span> = intentos fallidos antes de bloquear (ej. <code>3</code>)</p><div class=\"cw\"><pre>Set-ADDefaultDomainPasswordPolicy -Identity \"<span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;</span>\" -MinPasswordLength <span class=\"ph\">&lt;AQUÍ-N-CARACTERES&gt;</span> -PasswordHistoryCount <span class=\"ph\">&lt;AQUÍ-N-HISTORIAL&gt;</span> -LockoutThreshold <span class=\"ph\">&lt;AQUÍ-N-INTENTOS&gt;</span></pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Ver la política de contraseñas del dominio.</b></p><p class=\"m\">En fácil: Cambia la longitud mínima, el historial y el bloqueo de contraseñas.</p><div class=\"cw\"><pre>Get-ADDefaultDomainPasswordPolicy</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Bloquear el Panel de Control con PowerShell.</b></p><p class=\"m\">En fácil: Comprueba la configuración de la directiva de contraseñas.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span> = nombre de la GPO (ej. <code>GPO_Fondo</code>)</p><div class=\"cw\"><pre>Set-GPRegistryValue -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span>\" -Key \"HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\" -ValueName \"NoControlPanel\" -Type DWord -Value 1</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Poner fondo de escritorio con PowerShell.</b></p><p class=\"m\">En fácil: Configura la directiva con los valores indicados.</p><p class=\"ch\">✏️ <b>Cambia:</b> <span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span> = nombre de la GPO (ej. <code>GPO_Fondo</code>) · <span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span> = nombre (hostname) del servidor (ej. <code>SRV-AD</code>) · <span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span> = nombre de la carpeta compartida (ej. <code>Personals</code>) · <span class=\"ph\">&lt;AQUÍ-ARCHIVO-IMAGEN&gt;</span> = archivo de imagen (ej. <code>fondo.jpg</code>)</p><div class=\"cw\"><pre>Set-GPRegistryValue -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GPO&gt;</span>\" -Key \"HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\" -ValueName \"Wallpaper\" -Type String -Value \"\\\\<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;</span>\\<span class=\"ph\">&lt;AQUÍ-CARPETA-COMPARTIDA&gt;</span>\\<span class=\"ph\">&lt;AQUÍ-ARCHIVO-IMAGEN&gt;</span>\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"sec-sub\">Rutas gráficas (Windows en castellano)</div><div class=\"cmd gui\"><p class=\"d\"><b>Crear y vincular una GPO a una UO.</b></p><div class=\"steps2\"><span class=\"p\">Administración de directivas de grupo</span> → dominio → clic derecho en la UO → <span class=\"p\">Crear un GPO en este dominio y vincularlo aquí…</span> → nombre → clic derecho en la GPO → <span class=\"p\">Editar</span></div></div><div class=\"cmd gui\"><p class=\"d\"><b>Aplicar una GPO solo a un grupo.</b></p><div class=\"steps2\">Seleccionar la GPO → pestaña <span class=\"p\">Ámbito</span> → <span class=\"p\">Filtrado de seguridad</span> → quitar <span class=\"p\">Usuarios autenticados</span> → <span class=\"p\">Agregar…</span> el grupo (no confundir con la pestaña Delegación)</div></div><div class=\"cmd gui\"><p class=\"d\"><b>Cambiar el orden de las GPO de una UO.</b></p><div class=\"steps2\">Seleccionar la UO → pestaña <span class=\"p\">Objetos de directiva de grupo vinculados</span> → flechas arriba/abajo (el nº más pequeño gana)</div></div><div class=\"cmd gui\"><p class=\"d\"><b>Ver la herencia de directivas.</b></p><div class=\"steps2\">Seleccionar la UO → pestaña <span class=\"p\">Herencia de directivas de grupo</span></div></div><div class=\"cmd gui\"><p class=\"d\"><b>Contraseñas y bloqueo del dominio.</b> Siempre en la Default Domain Policy.</p><div class=\"steps2\">Clic derecho en <span class=\"p\">Default Domain Policy</span> → <span class=\"p\">Editar</span> → <span class=\"p\">Configuración del equipo</span> → <span class=\"p\">Directivas</span> → <span class=\"p\">Configuración de Windows</span> → <span class=\"p\">Configuración de seguridad</span> → <span class=\"p\">Directivas de cuenta</span></div></div><div class=\"sec-sub\">Rutas en el Editor de GPO (clic derecho en la GPO → Editar)</div><div class=\"cmd\"><p class=\"d\"><b>Scripts de inicio / apagado del equipo.</b></p><p class=\"m\">En fácil: Indica la ruta de red de la imagen que se usará como fondo.</p><div class=\"cw\"><pre>Configuración del equipo → Directivas → Configuración de Windows → Scripts (inicio/apagado)</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Política de contraseñas.</b></p><p class=\"m\">En fácil: Se aplican al encender o apagar el equipo.</p><div class=\"cw\"><pre>Configuración del equipo → Directivas → Configuración de Windows → Configuración de seguridad → Directivas de cuenta → Directiva de contraseñas</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Bloqueo de cuentas.</b></p><p class=\"m\">En fácil: Configura las reglas de las contraseñas.</p><div class=\"cw\"><pre>Configuración del equipo → Directivas → Configuración de Windows → Configuración de seguridad → Directivas de cuenta → Directiva de bloqueo de cuenta</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Privilegios de usuarios</b> (Permitir el inicio de sesión local, apagar el sistema…).</p><p class=\"m\">En fácil: Configura cuándo se bloquea una cuenta tras varios intentos fallidos.</p><div class=\"cw\"><pre>Configuración del equipo → Directivas → Configuración de Windows → Configuración de seguridad → Directivas locales → Asignación de derechos de usuario</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Pantalla de inicio / bloqueo.</b></p><p class=\"m\">En fácil: Controla quién puede realizar tareas del sistema.</p><div class=\"cw\"><pre>Configuración del equipo → Directivas → Plantillas administrativas → Panel de control → Personalización</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Scripts de inicio / cierre de sesión del usuario.</b></p><p class=\"m\">En fácil: Configura la pantalla de bloqueo.</p><div class=\"cw\"><pre>Configuración de usuario → Directivas → Configuración de Windows → Scripts (inicio/cierre de sesión)</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Bloquear el Panel de Control.</b></p><p class=\"m\">En fácil: Se aplican cuando el usuario inicia o cierra sesión.</p><div class=\"cw\"><pre>Configuración de usuario → Directivas → Plantillas administrativas → Panel de control</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Fondo de escritorio.</b></p><p class=\"m\">En fácil: Bloquea el acceso al Panel de control y a Configuración.</p><div class=\"cw\"><pre>Configuración de usuario → Directivas → Plantillas administrativas → Escritorio → Escritorio</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Menú Inicio y barra de tareas.</b></p><p class=\"m\">En fácil: Establece el fondo de escritorio mediante una imagen compartida.</p><div class=\"cw\"><pre>Configuración de usuario → Directivas → Plantillas administrativas → Menú Inicio y barra de tareas</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Opciones de Ctrl+Alt+Supr.</b></p><p class=\"m\">En fácil: Limita opciones del menú Inicio y de la barra de tareas.</p><div class=\"cw\"><pre>Configuración de usuario → Directivas → Plantillas administrativas → Sistema → Opciones de Ctrl+Alt+Supr</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Bloquear CDs, USB…</b></p><p class=\"m\">En fácil: Quita herramientas como el Administrador de tareas.</p><div class=\"cw\"><pre>Configuración de usuario → Directivas → Plantillas administrativas → Sistema → Acceso de almacenamiento extraíble</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div><div class=\"cmd\"><p class=\"d\"><b>Perfil de usuario.</b></p><p class=\"m\">En fácil: Controla el acceso a memorias USB y otros dispositivos extraíbles.</p><div class=\"cw\"><pre>Configuración de usuario → Directivas → Plantillas administrativas → Sistema → Perfiles de usuario</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div></section>\n<section id=\"posibles\" style=\"--c:var(--orange)\">\n<h2>Prácticas adicionales para preparar Active Directory</h2>\n<p>Ejercicios de práctica posibles a partir de las operaciones habituales de administración. Sirven para practicar variantes gráficas y por PowerShell.</p>\n<div class=\"sec-sub\">A · Administración gráfica</div>\n<div class=\"cmd gui\"><p class=\"d\"><b>Crear una OU y una sub-OU.</b></p><p class=\"m\">En fácil: Configura opciones de los perfiles de usuario.</p><div class=\"steps2\">Abrir <span class=\"p\">Usuarios y equipos de Active Directory (dsa.msc)</span> → clic derecho en el dominio → <span class=\"p\">Nuevo</span> → <span class=\"p\">Unidad organizativa</span> → escribir el nombre. Para crear una sub-OU, clic derecho sobre la OU padre y repetir.</div></div>\n<div class=\"cmd gui\"><p class=\"d\"><b>Crear un usuario y obligarle a cambiar la contraseña al iniciar sesión.</b></p><p class=\"m\">En fácil: Organiza usuarios, grupos y equipos en carpetas (OU).</p><div class=\"steps2\">En <span class=\"p\">dsa.msc</span> → OU correspondiente → <span class=\"p\">Nuevo</span> → <span class=\"p\">Usuario</span> → completar nombre y nombre de inicio de sesión → establecer contraseña → marcar <span class=\"p\">El usuario debe cambiar la contraseña en el siguiente inicio de sesión</span>.</div></div>\n<div class=\"cmd gui\"><p class=\"d\"><b>Restablecer la contraseña de un usuario.</b></p><div class=\"steps2\">En <span class=\"p\">dsa.msc</span> → clic derecho sobre el usuario → <span class=\"p\">Restablecer contraseña</span> → escribir y confirmar la nueva contraseña → seleccionar las opciones que indique el enunciado.</div></div>\n<div class=\"cmd gui\"><p class=\"d\"><b>Deshabilitar o habilitar una cuenta.</b></p><div class=\"steps2\">En <span class=\"p\">dsa.msc</span> → clic derecho sobre el usuario → <span class=\"p\">Deshabilitar cuenta</span> o <span class=\"p\">Habilitar cuenta</span>.</div></div>\n<div class=\"cmd gui\"><p class=\"d\"><b>Configurar fecha de expiración de una cuenta.</b></p><div class=\"steps2\">Propiedades del usuario → pestaña <span class=\"p\">Cuenta</span> → apartado <span class=\"p\">La cuenta expira</span> → seleccionar fecha → Aplicar.</div></div>\n<div class=\"cmd gui\"><p class=\"d\"><b>Limitar días y horas de inicio de sesión.</b></p><div class=\"steps2\">Propiedades del usuario → pestaña <span class=\"p\">Cuenta</span> → <span class=\"p\">Horas de inicio de sesión</span> → denegar todas las horas → marcar como permitida solo la franja solicitada → Aceptar.</div></div>\n<div class=\"cmd gui\"><p class=\"d\"><b>Permitir que un usuario inicie sesión solo en determinados equipos.</b></p><div class=\"steps2\">Propiedades del usuario → pestaña <span class=\"p\">Cuenta</span> → <span class=\"p\">Iniciar sesión en...</span> → seleccionar <span class=\"p\">Los siguientes equipos</span> → añadir el nombre del equipo cliente → Aceptar.</div></div>\n<div class=\"cmd gui\"><p class=\"d\"><b>Configurar perfil móvil y carpeta particular.</b></p><div class=\"steps2\">Propiedades del usuario → pestaña <span class=\"p\">Perfil</span> → en <span class=\"p\">Ruta de acceso del perfil</span> escribir <code>\\\\Servidor\\Perfiles\\%username%</code>. En <span class=\"p\">Carpeta particular</span> seleccionar Conectar, elegir una letra y escribir <code>\\\\Servidor\\Personales\\%username%</code>.</div></div>\n<div class=\"cmd gui\"><p class=\"d\"><b>Crear una GPO, vincularla a una OU y editarla.</b></p><div class=\"steps2\">Abrir <span class=\"p\">Administración de directivas de grupo (gpmc.msc)</span> → expandir el dominio → clic derecho en la OU → <span class=\"p\">Crear un GPO en este dominio y vincularlo aquí</span> → poner nombre → clic derecho en la GPO → <span class=\"p\">Editar</span> → configurar la directiva solicitada.</div></div>\n<div class=\"cmd gui\"><p class=\"d\"><b>Comprobar qué GPO se aplican al usuario o equipo.</b></p><div class=\"steps2\">En el cliente, iniciar sesión con el usuario correspondiente → abrir CMD → ejecutar <code>gpupdate /force</code> → después <code>gpresult /r</code>. Para un informe detallado: <code>gpresult /h informe.html</code>.</div></div>\n<div class=\"sec-sub\">B · Administración con PowerShell</div>\n<div class=\"cmd\"><p class=\"d\"><b>Consultar el DN del dominio actual.</b></p><p class=\"m\">En fácil: Crea una cuenta y pide cambiar la contraseña en el primer inicio.</p><div class=\"cw\"><pre>(Get-ADDomain).DistinguishedName</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Consultar el DN de un usuario.</b></p><p class=\"m\">En fácil: Muestra el DN del dominio para usarlo como ruta base.</p><div class=\"cw\"><pre>Get-ADUser -Identity \"&lt;usuario&gt;\" | Select-Object Name, DistinguishedName</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Buscar todos los usuarios del dominio.</b></p><div class=\"cw\"><pre>Get-ADUser -Filter * | Select-Object Name, SamAccountName</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Buscar todos los grupos del dominio.</b></p><div class=\"cw\"><pre>Get-ADGroup -Filter * | Select-Object Name, GroupScope, GroupCategory</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Modificar la descripción de un grupo.</b></p><div class=\"cw\"><pre>Set-ADGroup -Identity \"&lt;Nombre-grupo&gt;\" -Description \"&lt;Descripción&gt;\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Deshabilitar y habilitar un usuario.</b></p><div class=\"cw\"><pre>Disable-ADAccount -Identity \"&lt;usuario&gt;\"\nEnable-ADAccount -Identity \"&lt;usuario&gt;\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Restablecer la contraseña de un usuario.</b></p><div class=\"cw\"><pre>$pass = Read-Host \"Introduce la nueva contraseña\" -AsSecureString\nSet-ADAccountPassword -Identity \"&lt;usuario&gt;\" -Reset -NewPassword $pass</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Forzar el cambio de contraseña en el siguiente inicio de sesión.</b></p><div class=\"cw\"><pre>Set-ADUser -Identity \"&lt;usuario&gt;\" -ChangePasswordAtLogon $true</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Establecer la fecha de expiración de una cuenta.</b></p><div class=\"cw\"><pre>Set-ADAccountExpiration -Identity \"&lt;usuario&gt;\" -DateTime \"&lt;AAAA-MM-DD&gt;\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Añadir un usuario a un grupo.</b></p><div class=\"cw\"><pre>Add-ADGroupMember -Identity \"&lt;Nombre-grupo&gt;\" -Members \"&lt;usuario&gt;\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Quitar un usuario de un grupo.</b></p><div class=\"cw\"><pre>Remove-ADGroupMember -Identity \"&lt;Nombre-grupo&gt;\" -Members \"&lt;usuario&gt;\" -Confirm:$false</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Mover un usuario a otra OU.</b></p><p class=\"m\">En fácil: Muestra la dirección completa de un objeto en Active Directory.</p><div class=\"cw\"><pre>Move-ADObject -Identity \"&lt;DN-actual-del-usuario&gt;\" -TargetPath \"&lt;DN-de-la-OU-destino&gt;\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Crear una GPO y vincularla a una OU.</b></p><div class=\"cw\"><pre>New-GPO -Name \"&lt;Nombre-GPO&gt;\"\nNew-GPLink -Name \"&lt;Nombre-GPO&gt;\" -Target \"&lt;DN-de-la-OU&gt;\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"cmd\"><p class=\"d\"><b>Actualizar las directivas y generar un informe.</b></p><div class=\"cw\"><pre>gpupdate /force\ngpresult /r\ngpresult /h \"&lt;ruta\\informe.html&gt;\"</pre><button class=\"cp\" type=\"button\">Copiar</button></div></div>\n<div class=\"warn\"><b>Recuerda:</b> los comandos que cambian cuentas, contraseñas, GPO o estructura de AD deben ejecutarse con permisos adecuados y después de sustituir todos los marcadores. Comprueba siempre el DN antes de mover o crear objetos.</div>\n</section>\n</div>\n<button id=\"backTop\" type=\"button\" aria-label=\"Volver arriba\">↑ Inicio</button>\n<style>\n#backTop{position:fixed;right:18px;bottom:18px;z-index:30;border:0;border-radius:22px;padding:10px 15px;background:#243b67;color:#fff;font-weight:700;box-shadow:0 4px 14px #0003;cursor:pointer}\n#backTop:hover{background:#2f6fed}\n@media(max-width:600px){\n .wrap{padding:10px 10px 70px}\n header{padding:16px}\n header h1{font-size:1.35rem}\n nav{top:62px}\n section{padding:13px}\n .search-box input{padding:10px 12px}\n}\n</style>\n<script>\n(function(){\nvar q=document.getElementById('q'),clr=document.getElementById('clr'),st=document.getElementById('st');\nvar backTop=document.getElementById('backTop');\nbackTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});\n\nvar secs=[].slice.call(document.querySelectorAll('section')),cmds=[].slice.call(document.querySelectorAll('.cmd'));\nfunction filter(){\n  var v=q.value.trim().toLowerCase(),n=0;\n  cmds.forEach(function(c){var ok=!v||c.textContent.toLowerCase().indexOf(v)>=0;c.classList.toggle('hidden',!ok);if(ok)n++});\n  secs.forEach(function(s){s.classList.toggle('hidden',!!v&&!s.querySelector('.cmd:not(.hidden)'))});\n  st.textContent=v?(n?n+' resultado(s) para «'+q.value.trim()+'»':'No se encontró nada con «'+q.value.trim()+'»'):'';\n}\nq.addEventListener('input',filter);\nclr.addEventListener('click',function(){q.value='';filter();q.focus()});\nfunction fallback(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a)}\ndocument.querySelectorAll('.cp').forEach(function(b){\n  b.addEventListener('click',function(){\n    var t=b.parentNode.querySelector('pre').textContent;\n    function done(){b.textContent='¡Copiado!';setTimeout(function(){b.textContent='Copiar'},1200)}\n    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallback(t);done()})}else{fallback(t);done()}\n  });\n});\n})();\n<\\/script>\n</body>\n</html>\n<\/script></body></html>";
