var AD_POSIBLES="<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Posibles preguntas · Examen 3 AD<\/title>\n<style>\n:root{\n  --bg:#f4f6fb;--card:#ffffff;--ink:#1b2333;--muted:#5b6679;--line:#dde3ee;--code:#eef1f8;\n  --blue:#2f6fed;--green:#16a36a;--orange:#f28c18;--purple:#8b5cf6;--pink:#e63e8a;--teal:#0e9fb5;--red:#e5484d;\n}\n*{box-sizing:border-box}\nbody{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}\n.wrap{max-width:960px;margin:0 auto;padding:24px 16px 64px}\nheader{background:linear-gradient(135deg,#2f6fed,#7c3aed);color:#fff;padding:28px 24px;border-radius:18px;margin-bottom:20px;box-shadow:0 10px 28px rgba(47,111,237,.18)}\nheader h1{margin:0 0 6px;font-size:1.75rem}\nheader p{margin:0;opacity:.92;font-size:.98rem}\n.tip-banner{background:#eef4ff;border:1px solid #c7d9ff;color:#1e3a8a;padding:14px 16px;border-radius:12px;margin-bottom:20px;font-size:.93rem}\n.tip-banner strong{color:#1d4ed8}\n.q-card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:18px;overflow:hidden;box-shadow:0 4px 14px rgba(15,23,42,.04)}\n.q-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:#fafbfe;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}\n.q-head:hover{background:#f2f6ff}\n.q-title{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.05rem}\n.badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 10px;border-radius:999px;background:var(--blue);color:#fff;font-size:.85rem;font-weight:800}\n.pts{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:#eef2ff;color:var(--blue);white-space:nowrap}\n.pts.hi{background:#fef3c7;color:#b45309}\n.q-body{padding:18px 20px}\n.enunciado{background:#f8fafc;border-left:4px solid var(--blue);padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:16px;font-size:.95rem}\n.enunciado strong{color:var(--ink)}\nh3{margin:16px 0 8px;font-size:.96rem;color:var(--blue);text-transform:uppercase;letter-spacing:.03em}\nol,ul{margin:6px 0 12px;padding-left:22px}\nli{margin-bottom:6px}\n.path{display:inline-block;background:#eef2ff;color:#1e40af;padding:2px 7px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.86rem;font-weight:600}\n.code-wrap{position:relative;margin:10px 0 14px}\npre{margin:0;background:#0f172a;color:#e2e8f0;padding:14px 16px;border-radius:12px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.86rem;line-height:1.5}\n.copy-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:4px 10px;font-size:.76rem;cursor:pointer;font-weight:600}\n.copy-btn:hover{background:rgba(255,255,255,.24)}\n.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 14px;border-radius:10px;font-size:.9rem;margin-top:10px}\n.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:10px 14px;border-radius:10px;font-size:.9rem;margin-top:10px}\ntable{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88rem}\nth,td{border:1px solid var(--line);padding:8px 10px;text-align:left}\nth{background:#f1f5f9;font-weight:700}\n.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}\n.ctrl-btn{background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:600;font-size:.86rem;cursor:pointer}\n.ctrl-btn:hover{border-color:var(--blue);color:var(--blue)}\n@media (max-width:600px){\n  .q-head{flex-direction:column;align-items:flex-start}\n  header h1{font-size:1.45rem}\n}\n.ph{background:#fff3a3;color:#1b2333;font-weight:700;border-radius:4px;padding:0 4px}\n.legend-box{background:#fffbe0;border:1px solid #f0e08a;color:#5c4a00;padding:14px 16px;border-radius:12px;margin-bottom:18px;font-size:.9rem}\n.legend-box table{margin:8px 0 0;font-size:.85rem}\n.legend-box th{background:#f6ecab}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <h1>Posibles preguntas · Examen Práctico AD<\/h1>\n    <p>Procedimiento de los 7 ejercicios tipo examen (gráfico y PowerShell). Cambia lo resaltado como <code>&lt;AQUÍ-…&gt;<\/code> por los valores de tu enunciado.<\/p>\n  <\/header>\n\n  <div class=\"legend-box\">\n    <strong>✏️ Dónde poner lo de tu examen:<\/strong> todo lo resaltado como <span class=\"ph\">&lt;AQUÍ-…&gt;<\/span> lo cambias por el valor de tu enunciado (y borras también los &lt; &gt;).\n    <table>\n      <tr><th>Marcador<\/th><th>Qué poner<\/th><th>Ejemplo<\/th><\/tr>\n      <tr><td><span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;<\/span><\/td><td>El dominio completo<\/td><td>dominio.local<\/td><\/tr>\n      <tr><td><span class=\"ph\">&lt;AQUÍ-DOMINIO-SIN-EXTENSIÓN&gt;<\/span> / <span class=\"ph\">&lt;AQUÍ-EXTENSIÓN&gt;<\/span><\/td><td>El dominio partido en dos<\/td><td>dominio / local<\/td><\/tr>\n      <tr><td><span class=\"ph\">&lt;AQUÍ-NOMBRE-OU&gt;<\/span> (o OU-1, OU-2)<\/td><td>Nombre de la UO que pide el enunciado<\/td><td>Alumnat<\/td><\/tr>\n      <tr><td><span class=\"ph\">&lt;AQUÍ-USUARIO&gt;<\/span> (o USUARIO-1, -2)<\/td><td>Login del usuario<\/td><td>a.puig<\/td><\/tr>\n      <tr><td><span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;<\/span><\/td><td>Nombre del grupo<\/td><td>G_Alumnat<\/td><\/tr>\n      <tr><td><span class=\"ph\">&lt;AQUÍ-CONTRASEÑA&gt;<\/span><\/td><td>Contraseña que cumpla la complejidad<\/td><td>P@ssw0rd123<\/td><\/tr>\n      <tr><td><span class=\"ph\">&lt;AQUÍ-HORA-INICIO&gt;<\/span> / <span class=\"ph\">&lt;AQUÍ-HORA-FIN&gt;<\/span><\/td><td>Franja horaria permitida<\/td><td>08:00 / 15:00<\/td><\/tr>\n      <tr><td><span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;<\/span><\/td><td>Nombre (hostname) del servidor<\/td><td>SRV-AD<\/td><\/tr>\n      <tr><td><span class=\"ph\">&lt;AQUÍ-CARPETA-PERFILES&gt;<\/span> / <span class=\"ph\">&lt;AQUÍ-CARPETA-PARTICULAR&gt;<\/span> / <span class=\"ph\">&lt;AQUÍ-CARPETA-DEL-FONDO&gt;<\/span><\/td><td>Nombre de la carpeta que pide el enunciado<\/td><td>Perfils / Personals / Recursos<\/td><\/tr>\n      <tr><td><span class=\"ph\">&lt;AQUÍ-LETRA-UNIDAD&gt;<\/span><\/td><td>Letra de la unidad de red<\/td><td>Z<\/td><\/tr>\n      <tr><td><span class=\"ph\">&lt;AQUÍ-NÚMERO&gt;<\/span><\/td><td>Número que pide el enunciado (longitud, historial, intentos)<\/td><td>8 / 5 / 3<\/td><\/tr>\n    <\/table>\n  <\/div>\n\n  <div class=\"controls\">\n    <button class=\"ctrl-btn\" onclick=\"toggleAll(true)\">Expandir todas<\/button>\n    <button class=\"ctrl-btn\" onclick=\"toggleAll(false)\">Contraer todas<\/button>\n  <\/div>\n\n  <section class=\"q-card\">\n    <div class=\"q-head\" onclick=\"toggleCard(this)\">\n      <div class=\"q-title\"><span class=\"badge\">1<\/span> Crear OUs y Usuarios<\/div>\n      <span class=\"pts\">1 punto<\/span>\n    <\/div>\n    <div class=\"q-body\">\n      <div class=\"enunciado\"><strong>Te piden:<\/strong> Crear varias OUs (<code><span class=\"ph\">&lt;AQUÍ-NOMBRE-OU-1&gt;<\/span><\/code>, <code><span class=\"ph\">&lt;AQUÍ-NOMBRE-OU-2&gt;<\/span><\/code>) y usuarios dentro de cada una.<\/div>\n      <h3>A · Gráfico (ADUC)<\/h3>\n      <ol>\n        <li>Abre <span class=\"path\">dsa.msc<\/span> → clic derecho en el dominio → <strong>Nuevo → Unidad organizativa<\/strong> → <code><span class=\"ph\">&lt;AQUÍ-NOMBRE-OU-1&gt;<\/span><\/code>. Repite para <code><span class=\"ph\">&lt;AQUÍ-NOMBRE-OU-2&gt;<\/span><\/code>.<\/li>\n        <li>Clic derecho en <code><span class=\"ph\">&lt;AQUÍ-NOMBRE-OU-1&gt;<\/span><\/code> → <strong>Nuevo → Usuario<\/strong> → rellena <strong>Nombre<\/strong> y <strong>Nombre de inicio de sesión<\/strong> (<code><span class=\"ph\">&lt;AQUÍ-USUARIO-1&gt;<\/span><\/code>).<\/li>\n        <li>Pon una contraseña que cumpla la complejidad. Si el enunciado no dice nada, desmarca <em>\"El usuario debe cambiar la contraseña...\"<\/em>.<\/li>\n      <\/ol>\n      <h3>B · PowerShell<\/h3>\n      <div class=\"code-wrap\">\n        <button class=\"copy-btn\" onclick=\"copyCode(this)\">Copiar<\/button>\n<pre>New-ADOrganizationalUnit -Name \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-OU-1&gt;<\/span>\" -Path \"DC=<span class=\"ph\">&lt;AQUÍ-DOMINIO-SIN-EXTENSIÓN&gt;<\/span>,DC=<span class=\"ph\">&lt;AQUÍ-EXTENSIÓN&gt;<\/span>\"\n$pass = ConvertTo-SecureString \"<span class=\"ph\">&lt;AQUÍ-CONTRASEÑA&gt;<\/span>\" -AsPlainText -Force\nNew-ADUser -Name \"<span class=\"ph\">&lt;AQUÍ-USUARIO-1&gt;<\/span>\" -SamAccountName \"<span class=\"ph\">&lt;AQUÍ-USUARIO-1&gt;<\/span>\" `\n  -UserPrincipalName \"<span class=\"ph\">&lt;AQUÍ-USUARIO-1&gt;<\/span>@<span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;<\/span>\" `\n  -Path \"OU=<span class=\"ph\">&lt;AQUÍ-NOMBRE-OU-1&gt;<\/span>,DC=<span class=\"ph\">&lt;AQUÍ-DOMINIO-SIN-EXTENSIÓN&gt;<\/span>,DC=<span class=\"ph\">&lt;AQUÍ-EXTENSIÓN&gt;<\/span>\" `\n  -AccountPassword $pass -Enabled $true<\/pre>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"q-card\">\n    <div class=\"q-head\" onclick=\"toggleCard(this)\">\n      <div class=\"q-title\"><span class=\"badge\">2<\/span> Grupo, añadir usuario y horario de inicio de sesión<\/div>\n      <span class=\"pts\">1 punto<\/span>\n    <\/div>\n    <div class=\"q-body\">\n      <div class=\"enunciado\"><strong>Te piden:<\/strong> Crear un grupo en una OU, añadirle usuarios y limitar los días y horas de inicio de sesión (ej. lunes a viernes de 08:00 a 15:00).<\/div>\n      <h3>Paso 1 · Grupo y miembro<\/h3>\n      <ol>\n        <li>En <span class=\"path\">dsa.msc<\/span>, clic derecho en la OU → <strong>Nuevo → Grupo<\/strong>: nombre <code><span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;<\/span><\/code>, ámbito <strong>Global<\/strong>, tipo <strong>Seguridad<\/strong>.<\/li>\n        <li><strong>Propiedades<\/strong> del grupo → <strong>Miembros<\/strong> → <strong>Agregar<\/strong> → <code><span class=\"ph\">&lt;AQUÍ-USUARIO&gt;<\/span><\/code> → Comprobar nombres → Aceptar.<\/li>\n      <\/ol>\n      <h3>Paso 2 · Logon Hours<\/h3>\n      <ol>\n        <li><strong>Propiedades<\/strong> de <code><span class=\"ph\">&lt;AQUÍ-USUARIO&gt;<\/span><\/code> → pestaña <strong>Cuenta<\/strong> → <strong>Horas de inicio de sesión...<\/strong><\/li>\n        <li>Selecciona <strong>toda la cuadrícula<\/strong> → <strong>Inicio de sesión denegado<\/strong>.<\/li>\n        <li>Selecciona solo la franja permitida (<code><span class=\"ph\">&lt;AQUÍ-HORA-INICIO&gt;<\/span><\/code> a <code><span class=\"ph\">&lt;AQUÍ-HORA-FIN&gt;<\/span><\/code>) → <strong>Inicio de sesión permitido<\/strong> (azul) → Aceptar y Aplicar.<\/li>\n      <\/ol>\n      <div class=\"warn\"><strong>Ojo:<\/strong> primero deniega todo y luego pinta solo lo permitido, así no dejas horas abiertas por error.<\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"q-card\">\n    <div class=\"q-head\" onclick=\"toggleCard(this)\">\n      <div class=\"q-title\"><span class=\"badge\">3<\/span> Perfil móvil (Roaming)<\/div>\n      <span class=\"pts\">1 punto<\/span>\n    <\/div>\n    <div class=\"q-body\">\n      <div class=\"enunciado\"><strong>Te piden:<\/strong> Perfil móvil para todos los usuarios de una OU con una carpeta compartida (ej. <code>C:\\<span class=\"ph\">&lt;AQUÍ-CARPETA-PERFILES&gt;<\/span><\/code>).<\/div>\n      <h3>Paso 1 · Crear y compartir la carpeta (servidor)<\/h3>\n      <ol>\n        <li>Crea <code>C:\\<span class=\"ph\">&lt;AQUÍ-CARPETA-PERFILES&gt;<\/span><\/code> → <strong>Propiedades → Uso compartido → Uso compartido avanzado<\/strong> → <strong>Compartir esta carpeta<\/strong> (nombre <code><span class=\"ph\">&lt;AQUÍ-CARPETA-PERFILES&gt;<\/span><\/code>).<\/li>\n        <li><strong>Permisos<\/strong> → <strong>Control total<\/strong> a <em>Usuarios autenticados<\/em> (o <em>Todos<\/em>).<\/li>\n        <li><strong>Seguridad (NTFS) → Opciones avanzadas:<\/strong> <em>Administradores<\/em> y <em>SYSTEM<\/em> con Control total; el grupo de usuarios (o <em>Usuarios autenticados<\/em>) con <strong>Crear carpetas / anexar datos<\/strong> y <strong>Mostrar contenido de carpeta<\/strong> (solo <em>Esta carpeta<\/em>); <strong>CREATOR OWNER<\/strong> con <strong>Control total<\/strong> en <em>Subcarpetas y archivos solamente<\/em>.<\/li>\n      <\/ol>\n      <h3>Paso 2 · Ruta del perfil en ADUC<\/h3>\n      <ol>\n        <li>En <span class=\"path\">dsa.msc<\/span> selecciona <strong>todos los usuarios<\/strong> de la OU (Ctrl/Shift+clic) → <strong>Propiedades → Perfil<\/strong> → marca <strong>Ruta de acceso del perfil<\/strong>:<\/li>\n      <\/ol>\n      <div class=\"code-wrap\">\n        <button class=\"copy-btn\" onclick=\"copyCode(this)\">Copiar<\/button>\n<pre>\\\\<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;<\/span>\\<span class=\"ph\">&lt;AQUÍ-CARPETA-PERFILES&gt;<\/span>\\%username%<\/pre>\n      <\/div>\n      <div class=\"ok\"><strong>Comprobación:<\/strong> inicia sesión en el cliente, crea un archivo en el Escritorio y <strong>cierra sesión<\/strong> (el perfil se sube al cerrar). En el servidor debe aparecer <code><span class=\"ph\">&lt;AQUÍ-USUARIO&gt;<\/span>.V6<\/code> dentro de <code>C:\\<span class=\"ph\">&lt;AQUÍ-CARPETA-PERFILES&gt;<\/span><\/code>.<\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"q-card\">\n    <div class=\"q-head\" onclick=\"toggleCard(this)\">\n      <div class=\"q-title\"><span class=\"badge\">4<\/span> Carpeta particular (unidad de red / Home Folder)<\/div>\n      <span class=\"pts hi\">2 puntos<\/span>\n    <\/div>\n    <div class=\"q-body\">\n      <div class=\"enunciado\"><strong>Te piden:<\/strong> Carpeta particular con letra de unidad (ej. <code>Z:<\/code>) para todos los usuarios de una OU, con carpeta compartida en el servidor, y comprobarla en el cliente.<\/div>\n      <h3>Paso 1 · Crear y compartir la carpeta (servidor)<\/h3>\n      <ol>\n        <li>Crea <code>C:\\<span class=\"ph\">&lt;AQUÍ-CARPETA-PARTICULAR&gt;<\/span><\/code> → <strong>Uso compartido avanzado<\/strong> → compartir como <code><span class=\"ph\">&lt;AQUÍ-CARPETA-PARTICULAR&gt;<\/span><\/code> → <strong>Permisos<\/strong>: Control total a <em>Usuarios autenticados<\/em> (o <em>Todos<\/em>).<\/li>\n        <li><strong>Seguridad (NTFS):<\/strong> los administradores con Control total. Al asignar la ruta desde ADUC, Windows crea la subcarpeta de cada usuario con permisos privados.<\/li>\n      <\/ol>\n      <h3>Paso 2 · Unidad en ADUC<\/h3>\n      <ol>\n        <li>En <span class=\"path\">dsa.msc<\/span> selecciona todos los usuarios de la OU → <strong>Propiedades → Perfil<\/strong>.<\/li>\n        <li><strong>Carpeta particular → Conectar:<\/strong> letra <code><span class=\"ph\">&lt;AQUÍ-LETRA-UNIDAD&gt;<\/span>:<\/code> (ej. <code>Z:<\/code>) y en <strong>A:<\/strong> la ruta con <code>%username%<\/code>:<\/li>\n      <\/ol>\n      <div class=\"code-wrap\">\n        <button class=\"copy-btn\" onclick=\"copyCode(this)\">Copiar<\/button>\n<pre>\\\\<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;<\/span>\\<span class=\"ph\">&lt;AQUÍ-CARPETA-PARTICULAR&gt;<\/span>\\%username%<\/pre>\n      <\/div>\n      <div class=\"ok\"><strong>Comprobación en el cliente:<\/strong> inicia sesión con un usuario de esa OU → <strong>Este equipo<\/strong> → debe aparecer la unidad <code><span class=\"ph\">&lt;AQUÍ-LETRA-UNIDAD&gt;<\/span>:<\/code>; crea un archivo de texto dentro para confirmar que puede escribir.<\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"q-card\">\n    <div class=\"q-head\" onclick=\"toggleCard(this)\">\n      <div class=\"q-title\"><span class=\"badge\">5<\/span> Script PowerShell (OU + Usuarios + Grupo Global + Miembros)<\/div>\n      <span class=\"pts\">1 punto<\/span>\n    <\/div>\n    <div class=\"q-body\">\n      <div class=\"enunciado\"><strong>Te piden:<\/strong> Con PowerShell: crear una OU, varios usuarios habilitados con contraseña compleja, un grupo global de seguridad y añadir los usuarios al grupo.<\/div>\n      <h3>Plantilla lista para adaptar<\/h3>\n      <div class=\"code-wrap\">\n        <button class=\"copy-btn\" onclick=\"copyCode(this)\">Copiar<\/button>\n<pre># 1. Variables (cambia solo estos valores)\n$dominioDN = \"DC=<span class=\"ph\">&lt;AQUÍ-DOMINIO-SIN-EXTENSIÓN&gt;<\/span>,DC=<span class=\"ph\">&lt;AQUÍ-EXTENSIÓN&gt;<\/span>\"\n$dominioFQDN = \"<span class=\"ph\">&lt;AQUÍ-TU-DOMINIO&gt;<\/span>\"\n$ouName = \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-OU&gt;<\/span>\"\n$ouPath = \"OU=$ouName,$dominioDN\"\n$grupo = \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;<\/span>\"\n$pass = ConvertTo-SecureString \"<span class=\"ph\">&lt;AQUÍ-CONTRASEÑA&gt;<\/span>\" -AsPlainText -Force\n\n# 2. Crear la OU\nNew-ADOrganizationalUnit -Name $ouName -Path $dominioDN\n\n# 3. Crear los usuarios habilitados en la OU\n$usuarios = @(\"<span class=\"ph\">&lt;AQUÍ-USUARIO-1&gt;<\/span>\", \"<span class=\"ph\">&lt;AQUÍ-USUARIO-2&gt;<\/span>\")\nforeach ($u in $usuarios) {\n    New-ADUser -Name $u -SamAccountName $u `\n        -UserPrincipalName \"$u@$dominioFQDN\" `\n        -Path $ouPath -AccountPassword $pass -Enabled $true\n}\n\n# 4. Crear el grupo Global de Seguridad en la OU\nNew-ADGroup -Name $grupo -GroupScope Global -GroupCategory Security -Path $ouPath\n\n# 5. Añadir los usuarios al grupo\nAdd-ADGroupMember -Identity $grupo -Members $usuarios<\/pre>\n      <\/div>\n      <div class=\"warn\"><strong>Verificación:<\/strong> <code>Get-ADGroupMember -Identity \"<span class=\"ph\">&lt;AQUÍ-NOMBRE-GRUPO&gt;<\/span>\" | Select Name<\/code> muestra los usuarios del grupo.<\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"q-card\">\n    <div class=\"q-head\" onclick=\"toggleCard(this)\">\n      <div class=\"q-title\"><span class=\"badge\">6<\/span> GPO vinculada a una OU (Panel de Control + Fondo)<\/div>\n      <span class=\"pts hi\">2 puntos<\/span>\n    <\/div>\n    <div class=\"q-body\">\n      <div class=\"enunciado\"><strong>Te piden:<\/strong> Crear y vincular una GPO a una OU para restringir el Panel de control / Configuración y forzar un fondo corporativo; aplicarla y comprobarla en el cliente.<\/div>\n      <h3>Paso 1 · Imagen del fondo<\/h3>\n      <ol>\n        <li>Guarda la imagen (<code>.jpg<\/code>/<code>.png<\/code>) en una carpeta compartida del servidor con <strong>Lectura<\/strong> para <em>Usuarios autenticados<\/em> (ej. <code>\\\\<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;<\/span>\\<span class=\"ph\">&lt;AQUÍ-CARPETA-DEL-FONDO&gt;<\/span>\\fondo.jpg<\/code>).<\/li>\n      <\/ol>\n      <h3>Paso 2 · Crear y editar la GPO<\/h3>\n      <ol>\n        <li>Abre <span class=\"path\">gpmc.msc<\/span> → clic derecho en la OU <code><span class=\"ph\">&lt;AQUÍ-NOMBRE-OU&gt;<\/span><\/code> → <strong>Crear un GPO en este dominio y vincularlo aquí...<\/strong> (nombre descriptivo).<\/li>\n        <li>Clic derecho en la GPO → <strong>Editar<\/strong>.<\/li>\n      <\/ol>\n      <table>\n        <thead>\n          <tr><th>Configuración<\/th><th>Ruta exacta en el Editor de GPO<\/th><th>Valor<\/th><\/tr>\n        <\/thead>\n        <tbody>\n          <tr>\n            <td><strong>Bloquear Panel de control<\/strong><\/td>\n            <td><code>Configuración de usuario → Directivas → Plantillas administrativas → Panel de control<\/code> → <strong>Prohibir el acceso a Configuración de PC y al Panel de control<\/strong><\/td>\n            <td><strong>Habilitada<\/strong><\/td>\n          <\/tr>\n          <tr>\n            <td><strong>Fondo obligatorio<\/strong><\/td>\n            <td><code>Configuración de usuario → Directivas → Plantillas administrativas → Desktop → Desktop<\/code> → <strong>Tapiz del escritorio<\/strong><\/td>\n            <td><strong>Habilitada<\/strong> · Nombre: <code>\\\\<span class=\"ph\">&lt;AQUÍ-NOMBRE-SERVIDOR&gt;<\/span>\\<span class=\"ph\">&lt;AQUÍ-CARPETA-DEL-FONDO&gt;<\/span>\\fondo.jpg<\/code> · Estilo: <em>Rellenar<\/em> o <em>Ajustar<\/em><\/td>\n          <\/tr>\n        <\/tbody>\n      <\/table>\n      <h3>Paso 3 · Aplicar y comprobar (cliente)<\/h3>\n      <div class=\"code-wrap\">\n        <button class=\"copy-btn\" onclick=\"copyCode(this)\">Copiar<\/button>\n<pre>gpupdate /force\ngpresult /r<\/pre>\n      <\/div>\n      <div class=\"ok\"><strong>Comprobación:<\/strong> cierra sesión y entra con un usuario de esa OU (las directivas de usuario suelen pedir reinicio de sesión). Verifica el fondo y que el Panel de control muestra la restricción.<\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"q-card\">\n    <div class=\"q-head\" onclick=\"toggleCard(this)\">\n      <div class=\"q-title\"><span class=\"badge\">7<\/span> Política de Contraseñas y Bloqueo de Cuenta (Default Domain Policy)<\/div>\n      <span class=\"pts\">1 punto<\/span>\n    <\/div>\n    <div class=\"q-body\">\n      <div class=\"enunciado\"><strong>Te piden:<\/strong> Cambiar la política de contraseñas del dominio (longitud mínima, historial) y el umbral de bloqueo tras X intentos fallidos.<\/div>\n      <ol>\n        <li>Abre <span class=\"path\">gpmc.msc<\/span> → dominio → clic derecho en <strong>Default Domain Policy<\/strong> → <strong>Editar<\/strong>.<\/li>\n        <li>Ve a <span class=\"path\">Configuración del equipo → Directivas → Configuración de Windows → Configuración de seguridad → Directivas de cuenta<\/span>.<\/li>\n      <\/ol>\n      <table>\n        <thead>\n          <tr><th>Sección<\/th><th>Directiva<\/th><th>Valor ejemplo (adaptar)<\/th><\/tr>\n        <\/thead>\n        <tbody>\n          <tr><td><strong>Directiva de contraseñas<\/strong><\/td><td>Longitud mínima de la contraseña<\/td><td><code><span class=\"ph\">&lt;AQUÍ-NÚMERO&gt;<\/span><\/code> caracteres (ej. 8)<\/td><\/tr>\n          <tr><td><strong>Directiva de contraseñas<\/strong><\/td><td>Exigir historial de contraseñas<\/td><td><code><span class=\"ph\">&lt;AQUÍ-NÚMERO&gt;<\/span><\/code> contraseñas recordadas (ej. 5)<\/td><\/tr>\n          <tr><td><strong>Bloqueo de cuenta<\/strong><\/td><td>Umbral de bloqueo de cuenta<\/td><td><code><span class=\"ph\">&lt;AQUÍ-NÚMERO&gt;<\/span><\/code> intentos no válidos (ej. 3). <em>Acepta los valores sugeridos de duración y restablecimiento.<\/em><\/td><\/tr>\n        <\/tbody>\n      <\/table>\n      <div class=\"warn\"><strong>¡Muy importante!<\/strong> Contraseñas y bloqueo de cuenta se configuran <strong>siempre<\/strong> en la <strong>Default Domain Policy<\/strong> (no en una GPO de una OU). Después, <code>gpupdate /force<\/code> en el servidor.<\/div>\n    <\/div>\n  <\/section>\n<\/div>\n<script>\nfunction toggleCard(head){\n  var body = head.nextElementSibling;\n  body.style.display = (body.style.display === 'none') ? 'block' : 'none';\n}\nfunction toggleAll(show){\n  document.querySelectorAll('.q-body').forEach(function(b){ b.style.display = show ? 'block' : 'none'; });\n}\nfunction copyCode(btn){\n  var pre = btn.nextElementSibling;\n  var txt = pre.textContent;\n  if(navigator.clipboard){\n    navigator.clipboard.writeText(txt).then(function(){\n      btn.textContent = '¡Copiado!';\n      setTimeout(function(){ btn.textContent = 'Copiar'; }, 1500);\n    });\n  }\n}\n<\/script>\n<\/body>\n<\/html>";

<script type="module">
/* ===== Contador de personas conectadas (Firebase Realtime Database) =====
   1) Crea tu proyecto en Firebase y pega aquí tu configuración (ver instrucciones).
   2) Mientras databaseURL esté vacío, el contador no se muestra y no se conecta a nada.
   Solo se cuentan pestañas abiertas: no se guarda nombre, IP ni ningún dato personal. */
const FIREBASE_CONFIG={
  apiKey:"",
  authDomain:"",
  databaseURL:"",
  projectId:"",
  appId:""
};
if(FIREBASE_CONFIG.databaseURL){
  try{
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const {initializeApp}=await import(B+'firebase-app.js');
    const {getDatabase,ref,push,set,onValue,onDisconnect}=await import(B+'firebase-database.js');
    const db=getDatabase(initializeApp(FIREBASE_CONFIG)),list=ref(db,'presence');
    onValue(ref(db,'.info/connected'),function(s){
      if(s.val()===true){const me=push(list);onDisconnect(me).remove();set(me,true)}
    });
    onValue(list,function(s){window.setOnline(s.numChildren())},function(){window.setOnline(0)});
  }catch(e){window.setOnline&&window.setOnline(0)}
}
</script>
