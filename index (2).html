body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}

header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hb{color:#fff;border-color:#fff;padding:8px 14px;margin:0}
.mb{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;cursor:pointer}
.mb:hover{border-color:var(--blue)}.mb:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.mb.rec{border-color:var(--green);background:rgba(22,163,106,.1)}

.inp{width:100%;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.wrap{padding-top:72px}
header{background:var(--hg,linear-gradient(120deg,var(--blue),var(--purple)))}
.wheel{position:fixed;top:12px;left:12px;z-index:1000;width:46px;height:46px;border-radius:50%;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;overflow:hidden}

body.full .wrap{display:none}
#full{position:fixed;top:0;left:0;width:100%;height:100%;border:0;z-index:500;background:var(--bg)}
.fb{position:fixed;top:12px;right:12px;z-index:1000;margin:0;box-shadow:0 2px 8px rgba(0,0,0,.35)}

@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.card.enter{animation:in .28s ease both}
.shake{animation:shake .4s}.pop{animation:pop .35s}
.inp.shake{border-color:var(--red)}.inp.pop{border-color:var(--green)}
.mb,.opt,.btn{transition:transform .12s,border-color .12s,box-shadow .12s,background .12s}
.mb:hover,.opt:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(20,30,60,.14)}
.btn:not(:disabled):active,.mb:active,.opt:not(:disabled):active{transform:scale(.97)}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:2000;pointer-events:none;animation:fall linear forwards}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;font-weight:700;z-index:3000;animation:tin .25s both}
.stats{margin-top:18px;padding-top:12px;border-top:2px solid var(--line)}
.srow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:.88rem}
.sl{width:140px;flex:none}.sp{width:42px;text-align:right;font-weight:700}
.sbar{flex:1;height:12px;background:var(--line);border-radius:7px;overflow:hidden}
.sbar div{height:100%;border-radius:7px;transition:width .8s ease}
.fc{display:block;width:100%;height:210px;perspective:900px;background:none;border:0;padding:0;margin:8px 0;cursor:pointer;font:inherit;color:inherit}
.fci{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.fc:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:14px}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--tc,var(--blue));border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.ff b{font-size:1.35rem}.ff small{color:var(--muted)}
.ff.bk{transform:rotateY(180deg);border-color:var(--green)}
.wrap{position:relative;z-index:1}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}

@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}

.portal{position:relative;min-height:64vh;display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;font-family:'Fredoka','Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif}
.ptitle{font-size:4.2rem;line-height:1.1;margin:0 0 6px;font-weight:700;letter-spacing:.03em;text-shadow:0 0 22px rgba(255,255,255,.5),0 5px 0 rgba(0,0,0,.22)}

.cback{position:absolute;top:0;left:0;z-index:2}

.svc{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;margin-top:36px;text-align:left;font:inherit;color:#fff;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.45);border-radius:22px;padding:18px 22px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:glow 2.4s ease-in-out infinite,up .7s .7s both;transition:transform .15s,background .2s}
.svc:hover{background:rgba(255,255,255,.26)}
.svc:focus-visible{outline:3px solid var(--orange);outline-offset:3px}

</style>

// [tema, pregunta, [correcta, falsa, falsa, falsa], explicación]
var B=[
["a","¿Qué hace principalmente el DNS?",["Traduce nombres de dominio a direcciones IP","Asigna direcciones IP automáticamente","Cifra el tráfico web","Bloquea páginas peligrosas"],"El DNS traduce nombres de dominio a IP. Asignar IPs automáticamente es trabajo del DHCP."],
["a","El DNS es un sistema de nombres...",["Jerárquico sobre una base de datos distribuida","Plano y centralizado","Solo para internet público","Basado en direcciones MAC"],"Es jerárquico y funciona sobre una base de datos distribuida."],
["a","¿Dónde puede funcionar el DNS?",["En internet y en redes privadas","Solo en internet","Solo en redes privadas","Solo en redes Windows"],"Cualquier sistema conectado a internet o a una red privada puede obtener información de nombres de dominio."],
["a","Si no existiera el DNS, ¿qué tendríamos que usar para entrar en una web?",["Su dirección IP directamente","Su dirección MAC","Su número de puerto","Su máscara de red"],"Sin DNS habría que recordar las direcciones IP de cada servidor."],
["a","¿Qué significa que la base de datos del DNS sea distribuida?",["La información está repartida entre muchos servidores","Está en un único servidor central","Se copia entera en cada PC","Está cifrada"],"Ningún servidor tiene todo: la información se reparte entre muchos servidores."],
["a","¿Qué servicio traduce www.google.com a una IP?",["DNS","DHCP","FTP","NAT"],"Es el DNS. El DHCP reparte IPs a los equipos."],
["a","¿Cuál NO es una función del DNS?",["Asignar IPs automáticamente a los clientes","Traducir nombres a IP","Dar información asociada a nombres de dominio","Funcionar sobre una base de datos distribuida"],"Asignar IPs automáticamente es del DHCP."],
["a","¿Qué información devuelve normalmente el DNS al resolver un nombre?",["La dirección IP asociada","La MAC del equipo","El sistema operativo del servidor","El puerto del navegador"],"Devuelve la IP asociada al nombre."],
["b","¿Qué puerto usa el DNS?",["53","80","443","67"],"El DNS usa el puerto 53. El 80 es HTTP, el 443 HTTPS y el 67 DHCP."],
["b","¿Qué protocolo usa normalmente el DNS?",["UDP","TCP","ICMP","FTP"],"Normalmente usa UDP en el puerto 53."],
["b","¿Cuándo puede usar el DNS el protocolo TCP?",["A veces, usando el mismo puerto 53","Nunca","Siempre en vez de UDP","Solo con el puerto 80"],"En ocasiones usa el mismo puerto 53 pero con TCP."],
["b","Un administrador abre en el firewall el puerto del DNS. ¿Cuál abre?",["53","25","110","8080"],"El 25 es SMTP, el 110 POP3 y el 8080 HTTP alternativo. DNS = 53."],
["b","El DNS usa normalmente un protocolo sin conexión. ¿Cuál?",["UDP","TCP","HTTPS","SSH"],"UDP es el protocolo habitual del DNS."],
["b","¿Qué cambia cuando el DNS usa TCP en lugar de UDP?",["El protocolo, pero no el puerto","El puerto, pero no el protocolo","El puerto y el protocolo","Nada de nada"],"Cambia el protocolo de transporte, pero se mantiene el puerto 53."],
["b","El DHCP usa los puertos 67/68. ¿Qué puerto usa el DNS?",["53","67","80","443"],"El DNS usa el 53."],
["b","¿Cuál de estas afirmaciones es verdadera?",["El DNS puede usar TCP además de UDP","El DNS solo usa TCP","El DNS no usa puertos","El DNS usa ICMP"],"Normalmente UDP, y en ocasiones TCP, siempre con el puerto 53."],
["c","¿Qué es un host name?",["El nombre de un equipo, una sola palabra","El nombre completo con el dominio","Una dirección IP","El dominio de nivel superior"],"Una sola palabra con letras, números y guiones. Ej: www, PC1."],
["c","¿Cuál de estos es un FQDN?",["server1.sapalomera.cat.","server1","cat","192.168.1.1"],"El FQDN es el nombre completo: host name + punto + nombre de dominio."],

["c","¿Qué es un domain name?",["Una sucesión de nombres concatenados por puntos","Una sola palabra sin puntos","Una IP en formato texto","El servidor de correo"],"Es una sucesión de nombres unidos por puntos. Ej: www.google.com."],

["c","¿Qué diferencia hay entre host name y FQDN?",["El FQDN incluye el dominio y el host name no","Son exactamente lo mismo","El host name siempre es más largo","El FQDN no lleva puntos"],"El host name es solo el nombre del equipo; el FQDN añade el dominio."],

3px;font-weight:700}\nb.k{color:var(--c)}\n.tip,.warn{border-radius:8px;padding:10px 14px;margin:12px 0 2px;font-size:.93rem}\n.tip{background:rgba(22,163,106,.13);border-left:5px solid var(--green)}\n.warn{background:rgba(229,72,77,.12);border-left:5px solid var(--red)}\n.rec{display:grid;grid-template-columns:78px 1fr;gap:8px 12px;align-items:start}\n.badge{color:#fff;font-weight:800;text-align:center;border-radius:6px;padding:3px 0;font-size:.85rem}\n.tree{font-family:ui-monospace,Consolas,monospace;background:var(--code);padding:14px 18px;border-radius:8px;overflow-x:auto;white-space:pre;font-size:.9rem;line-height:1.5}\n.tree em{font-style:normal;color:var(--orange);font-weight:700}\n.tree strong{color:var(--green)}\n.steps{counter-reset:s;list-style:none;padding:0}\n.steps li{counter-increment:s;position:relative;padding-left:38px;margin:9px 0}\n.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;text-align:center;line-height:26px;font-size:.85rem}\n.sub{font-weight:700;margin:16px 0 4px;color:var(--c)}\n.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}\n.cols div{border-radius:8px;padding:10px 12px;border:2px solid var(--c2)}\n.cols b{color:var(--c2)}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header><h1>DNS: resumen para estudiar<\/h1><p>MP07 Servicios en red · CFGM SMX · UF1 · NF1.2<\/p><\/header>\n\n<div class=\"legend\">\n<span><mark>Amarillo<\/mark> = dato clave para el examen<\/span>\n<span><code>rosa<\/code> = comando, nombre o valor<\/span>\n<span>🟢 = truco para recordar<\/span>\n<span>🔴 = ojo, error típico<\/span>\n<\/div>\n\n<nav>\n<a href=\"#d2\" style=\"background:var(--blue)\">Qué es<\/a>\n<a href=\"#d4\" style=\"background:var(--green)\">Términos<\/a>\n<a href=\"#d5\" style=\"background:var(--orange)\">Registros<\/a>\n<a href=\"#d6\" style=\"background:var(--purple)\">Jerarquía<\/a>\n<a href=\"#d7\" style=\"background:var(--pink)\">Zonas<\/a>\n<a href=\"#d8\" style=\"background:var(--teal)\">AD DS<\/a>\n<\/nav>\n\n<section id=\"d2\" style=\"--c:var(--blue)\">\n<h2>Qué es el DNS <small>diapositivas 2 y 3<\/small><\/h2>\n<p>Sistema de nombres <mark>jerárquico<\/mark> sobre una base de datos <mark>distribuida<\/mark>. Funciona en internet y en redes privadas.<\/p>\n<p>Su trabajo: <mark>traducir nombres de dominio a direcciones IP<\/mark>.<\/p>\n<ul>\n<li>Protocolo normal: <mark>UDP<\/mark><\/li>\n<li>Puerto: <mark>53<\/mark><\/li>\n<li>A veces usa el mismo puerto con <mark>TCP<\/mark><\/li>\n<\/ul>\n<div class=\"tip\">🟢 Resumen: DNS = <b>53<\/b>, normalmente <b>UDP<\/b>, y traduce nombre → IP.<\/div>\n<\/section>\n\n<section id=\"d4\" style=\"--c:var(--green)\">\n<h2>Terminología básica <small>diapositiva 4<\/small><\/h2>\n<div class=\"cols\" style=\"--c2:var(--green)\">\n<div><b>Host name<\/b><br>Nombre de un equipo. <mark>Una sola palabra<\/mark> (letras, números, guiones).<br>Ej: <code>www<\/code>, <code>PC1<\/code><\/div>\n<div style=\"--c2:var(--blue)\"><b>FQDN<\/b><br>Nombre completo = <mark>host + punto + dominio<\/mark>.<br>Ej: <code>server1.sapalomera.cat.<\/code><\/div>\n<div style=\"--c2:var(--orange)\"><b>Domain name<\/b><br>Nombres unidos por puntos.<br>Ej: <code>www.google.com<\/code><\/div>\n<div style=\"--c2:var(--purple)\"><b>TLD<\/b><br>Dominios de <mark>nivel superior<\/mark>, no pertenecen a otro.<br>Ej: <code>com<\/code> <code>org<\/code> <code>cat<\/code><\/div>\n<\/div>\n<div class=\"tip\">🟢 FQDN = el nombre <b>entero<\/b>, el que acaba en punto.<\/div>\n<\/section>\n\n<section id=\"d5\" style=\"--c:var(--orange)\">\n<h2>Registros DNS <small>diapositiva 5<\/small><\/h2>\n<div class=\"rec\">\n<span class=\"badge\" style=\"background:var(--red)\">SOA<\/span><span>Servidor que mantiene la <mark>zona primaria<\/mark>. Solo indica el FQDN, <b>no la IP<\/b>.<\/span>\n<span class=\"badge\" style=\"background:var(--blue)\">NS<\/span><span><b>Name Server<\/b>: servidor(es) de nombres del dominio.<\/span>\n<span class=\"badge\" style=\"background:var(--green)\">A<\/span><span><b>Address<\/b>: nombre de host → <mark>IP<\/mark>.<\/span>\n<span class=\"badge\" style=\"background:var(--purple)\">CNAME<\/span><span><b>Alias<\/b> de un host.<\/span>\n<span class=\"badge\" style=\"background:var(--pink)\">MX<\/span><span><b>Mail Exchange<\/b>: servidor que recibe el <mark>correo<\/mark>.<\/span>\n<span class=\"badge\" style=\"background:var(--teal)\">PTR<\/span><span>Registro <mark>inverso<\/mark>: IP → nombre.<\/span>\n<span class=\"badge\" style=\"background:var(--orange)\">SRV<\/span><span><b>Service Locator<\/b>: los clientes encuentran <mark>servicios de red<\/mark>.<\/span>\n<\/div>\n<div class=\"warn\">🔴 No confundir: <b>A<\/b> = nombre → IP. <b>PTR<\/b> = IP → nombre.<\/div>\n<\/section>\n\n<section id=\"d6\" style=\"--c:var(--purple)\">\n<h2>Jerarquía DNS <small>diapositiva 6<\/small><\/h2>\n<div class=\"tree\"><em>.<\/em>  (raíz)\n├── <strong>com<\/strong>\n├── <strong>org<\/strong>      ← TLD\n│   ├── wikipedia   ← dominio\n│   │   ├── nds\n│   │   └── <em>es<\/em>    → es.wikipedia.org.\n│   └── fsf\n├── <strong>net<\/strong>\n└── <strong>onu<\/strong><\/div>\n<div class=\"tip\">🟢 Se lee de <b>derecha a izquierda<\/b>: raíz → TLD → dominio → subdominio.<\/div>\n<\/section>\n\n<section id=\"d7\" style=\"--c:var(--pink)\">\n<h2>Zonas DNS <small>diapositiva 7<\/small><\/h2>\n<div class=\"cols\" style=\"--c2:var(--pink)\">\n<div><b>Zona principal<\/b><br>El servidor es la <mark>fuente principal<\/mark> y guarda la <mark>copia maestra<\/mark>.<\/div>\n<div style=\"--c2:var(--blue)\"><b>Zona secundaria<\/b><br><mark>Copia<\/mark> de una zona principal que está en <mark>otro servidor<\/mark>.<\/div>\n<div style=\"--c2:var(--orange)\"><b>Zona de rutas internas<\/b> (stub)<br>Solo los registros para identificar los <mark>servidores DNS autoritativos<\/mark>.<\/div>\n<\/div>\n<\/section>\n\n<section id=\"d8\" style=\"--c:var(--teal)\">\n<h2>Integración con Active Directory <small>diapositiva 8<\/small><\/h2>\n<p>El DNS es <mark>imprescindible<\/mark> para AD DS:<\/p>\n<ul>\n<li>Los <b class=\"k\">clientes<\/b> buscan los <mark>controladores de dominio<\/mark> por DNS (así se autentican equipos y usuarios).<\/li>\n<li>Los controladores <b class=\"k\">se encuentran entre sí<\/b> por DNS (así hay <mark>replicación<\/mark>).<\/li>\n<li>También localizan al <mark>Catálogo Global<\/mark> mediante DNS.<\/li>\n<\/ul>\n<\/section>\n<\/div>\n<\/body>\n<\/html>\n";
